<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>按道具采购-下单成功</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { min-width: 760px; color: #333; font: 14px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; background: #fff; }
    .order-success-page { min-height: 500px; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .success-content { padding: 40px; text-align: center; }
    .success-icon { width: 80px; height: 80px; margin: 0 auto 20px; border-radius: 50%; background: #52c41a; color: #fff; font-size: 48px; line-height: 80px; }
    .success-title { margin-bottom: 12px; font-size: 24px; font-weight: 600; }
    .success-desc { color: #999; }
    .action-buttons { display: flex; gap: 16px; margin-top: 30px; }
    button { min-width: 100px; height: 34px; padding: 0 15px; border: 1px solid #dcdfe6; border-radius: 4px; background: #fff; color: #606266; cursor: pointer; }
    button.primary { border-color: #1890ff; background: #1890ff; color: #fff; }
  </style>
</head>
<body>
  <main class="order-success-page">
    <section class="success-content">
      <div class="success-icon">✓</div>
      <div class="success-title">下单成功</div>
      <div class="success-desc">可到订单详情页面查看进度</div>
    </section>
    <div class="action-buttons">
      <button id="backToList" type="button">返回订单列表</button>
      <button class="primary" id="viewOrder" type="button">查看订单详情</button>
    </div>
  </main>
  <script>
    function goToList() {
      if (window.parent !== window) {
        window.parent.postMessage({ type: 'prototype-route', action: 'originalStoreOrders' }, '*');
        return;
      }
      window.parent.postMessage({ type: "prototype-route", action: "originalStoreOrders" }, "*");
    }
    function viewOrder() {
      if (window.parent !== window) {
        window.parent.postMessage({ type: 'prototype-route', action: 'propConfirmOrder' }, '*');
        return;
      }
      window.parent.postMessage({ type: "prototype-route", action: "propConfirmOrder" }, "*");
    }
    document.getElementById('backToList').addEventListener('click', goToList);
    document.getElementById('viewOrder').addEventListener('click', viewOrder);
  </script>
</body>
</html>
