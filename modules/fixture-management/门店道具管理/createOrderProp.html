<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>按道具采购 - 提交订单</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #1f2937;
      background: #f2f4f7;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    .create-order-page {
      height: 100vh;
      padding: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .create-order-main {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .store-tabs {
      flex: none;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      max-height: 84px;
      overflow: auto;
      margin-bottom: 8px;
    }

    .store-tab {
      min-height: 34px;
      border: 1px solid #dcdfe6;
      border-radius: 4px;
      padding: 6px 14px;
      color: #606266;
      background: #fff;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .store-tab.active {
      background: #527DF7;
      border-color: #527DF7;
      color: #fff;
    }

    .store-tab-count {
      font-weight: 600;
      opacity: 0.9;
    }

    .info-section {
      flex: none;
      margin-bottom: 12px;
    }

    .info-card,
    .items-section {
      background: #fff;
      border: 1px solid #e8e8e8;
      border-radius: 8px;
    }

    .info-card {
      padding: 16px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #eee;
      margin-bottom: 12px;
    }

    .section-title {
      font-size: 14px;
      font-weight: 600;
    }

    .receipt-grid {
      display: grid;
      grid-template-columns: minmax(320px, 1.4fr) minmax(240px, 0.7fr) minmax(320px, 1fr);
      gap: 18px;
      align-items: flex-start;
    }

    .info-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      min-width: 0;
      font-size: 13px;
    }

    .label {
      flex: none;
      color: #909399;
      white-space: nowrap;
    }

    .required-mark {
      color: #f56c6c;
      margin-right: 4px;
    }

    .value {
      color: #303133;
      min-width: 0;
      line-height: 20px;
    }

    .address-text {
      word-break: break-all;
    }

    .inline-value {
      margin-right: 8px;
    }

    .input,
    .select,
    .textarea {
      width: 100%;
      border: 1px solid #dcdfe6;
      border-radius: 4px;
      color: #303133;
      background: #fff;
      outline: none;
    }

    .input,
    .select {
      height: 34px;
      padding: 0 10px;
    }

    .textarea {
      min-height: 74px;
      padding: 8px 10px;
      resize: none;
      line-height: 18px;
    }

    .input:focus,
    .select:focus,
    .textarea:focus {
      border-color: #527DF7;
    }

    .btn {
      min-height: 34px;
      border: 1px solid #dcdfe6;
      border-radius: 4px;
      padding: 6px 14px;
      background: #fff;
      color: #606266;
      cursor: pointer;
      white-space: nowrap;
      transition: 0.16s ease;
    }

    .btn:hover {
      border-color: #527DF7;
      color: #527DF7;
    }

    .btn-primary {
      background: #527DF7;
      border-color: #527DF7;
      color: #fff;
    }

    .btn-primary:hover {
      background: #527DF7;
      border-color: #527DF7;
      color: #fff;
    }

    .btn-danger,
    .btn-link-danger,
    .danger-link {
      color: #f56c6c;
    }

    .btn-link {
      min-height: auto;
      padding: 0;
      border: 0;
      background: transparent;
      color: #527DF7;
    }

    .btn-link:disabled {
      color: #c0c4cc;
      cursor: not-allowed;
    }

    .btn-small {
      min-height: 28px;
      padding: 4px 10px;
      font-size: 13px;
    }

    .items-section {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 16px;
      margin-bottom: 12px;
    }

    .items-section > .section-title {
      flex: none;
      margin-bottom: 12px;
    }

    .items-table-body {
      flex: 1;
      min-height: 0;
      overflow: auto;
      border: 1px solid #ebeef5;
      border-radius: 6px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 13px;
    }

    thead th {
      position: sticky;
      top: 0;
      z-index: 2;
      background: #f5f7fa;
      color: #909399;
      font-weight: 600;
      border-bottom: 1px solid #ebeef5;
      padding: 10px 8px;
      text-align: left;
    }

    tbody td {
      border-bottom: 1px solid #ebeef5;
      padding: 10px 8px;
      vertical-align: middle;
      background: #fff;
    }

    tbody tr.selected td {
      background: #eef3ff;
    }

    tbody tr:hover td {
      background: #f8fafc;
    }

    .tree-check-cell {
      text-align: center;
    }

    .tree-info-header {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .tree-expand-toggle {
      color: #527DF7;
      cursor: pointer;
      user-select: none;
      font-size: 13px;
      padding: 2px 8px;
      border: 1px solid #d9e2ff;
      border-radius: 999px;
      background: #eef3ff;
      font-weight: 600;
    }

    .tree-info-cell {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .row-expand-toggle {
      width: 18px;
      height: 18px;
      border: 0;
      padding: 0;
      flex: 0 0 auto;
      display: inline-grid;
      place-items: center;
      color: #909399;
      background: transparent;
      cursor: pointer;
      font-size: 12px;
      line-height: 18px;
    }

    .row-expand-toggle:hover {
      color: #527DF7;
    }

    .tree-level-form,
    .tree-level-spec {
      padding-left: 18px;
    }

    .tree-type-icon,
    .tree-form-icon,
    .tree-spec-image {
      flex: 0 0 auto;
      display: grid;
      place-items: center;
    }

    .tree-type-icon {
      width: 28px;
      height: 28px;
      border-radius: 5px;
      color: #fff;
      font-size: 16px;
    }

    .type-visual {
      background: linear-gradient(135deg, #ff9a56, #ff6b6b);
    }

    .type-graphic {
      background: linear-gradient(135deg, #e6a23c, #f6c15f);
    }

    .type-display {
      background: linear-gradient(135deg, #4facfe, #00bcd4);
    }

    .type-engineering {
      background: linear-gradient(135deg, #67c23a, #95d475);
    }

    .tree-form-icon {
      width: 24px;
      height: 24px;
      color: #527DF7;
    }

    .tree-spec-image {
      position: relative;
      width: 50px;
      height: 50px;
      border-radius: 6px;
      border: 1px solid #edf0f5;
      background: linear-gradient(135deg, #eef6ff, #f8fbff);
      overflow: hidden;
    }

    .tree-spec-image svg {
      width: 52%;
      height: 52%;
    }

    .tree-image-badge {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 11px;
      line-height: 18px;
    }

    .tree-image-badge.non-standard {
      background: rgba(245, 108, 108, 0.92);
    }

    .tree-image-badge.custom {
      background: rgba(82, 125, 247, 0.92);
    }

    .tree-text {
      min-width: 0;
      flex: 1;
    }

    .position-title {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      color: #303133;
      font-weight: 500;
    }

    .tree-level-type .position-title {
      font-size: 15px;
      font-weight: 600;
    }

    .position-title-text,
    .position-desc,
    .text-ellipsis {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .position-desc {
      margin-top: 4px;
      color: #909399;
      font-size: 12px;
    }

    .type-row-stats {
      flex: none;
      display: inline-flex;
      gap: 14px;
      color: #909399;
      font-size: 12px;
      font-weight: 400;
    }

    .money,
    .total-amount {
      color: #ff4d4f;
      font-weight: 600;
    }

    .number-input {
      width: 96px;
      height: 32px;
      border: 1px solid #dcdfe6;
      border-radius: 4px;
      padding: 0 8px;
      outline: none;
      text-align: center;
    }

    .qty-edit-field {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
    }

    .qty-edit-field span {
      color: #606266;
      font-size: 13px;
    }

    .supplier-select {
      width: 100%;
      height: 32px;
      border: 1px solid #dcdfe6;
      border-radius: 4px;
      padding: 0 8px;
      background: #fff;
      outline: none;
    }

    .reason-control {
      position: relative;
      display: grid;
      gap: 6px;
    }

    .info-row .reason-control {
      width: 172px;
    }

    .reason-select-btn,
    .reason-input {
      width: 100%;
      height: 32px;
      border: 1px solid #dcdfe6;
      border-radius: 4px;
      padding: 0 8px;
      background: #fff;
      outline: none;
      color: #303133;
    }

    .reason-select-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      font-size: 14px;
      text-align: left;
    }

    .reason-select-btn::after {
      content: "⌄";
      color: #909399;
      font-size: 13px;
    }

    .reason-select-btn.open {
      border-color: #527DF7;
      box-shadow: 0 0 0 2px rgba(82, 125, 247, 0.16);
    }

    .reason-menu {
      position: absolute;
      z-index: 20;
      top: 34px;
      left: 0;
      right: 0;
      display: none;
      padding: 4px;
      border: 1px solid #dcdfe6;
      border-radius: 4px;
      background: #fff;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
    }

    .reason-menu.open {
      display: block;
    }

    .reason-option {
      width: 100%;
      height: 30px;
      border: 0;
      border-radius: 3px;
      padding: 0 8px;
      background: transparent;
      color: #303133;
      cursor: pointer;
      text-align: left;
    }

    .reason-option:hover,
    .reason-option.active {
      background: #eef3ff;
      color: #527DF7;
    }

    .reason-input {
      display: none;
    }

    .reason-input.show {
      display: block;
    }

    .page-footer-bar,
    .tree-batch-action-bar {
      flex: none;
      background: #fff;
      border-top: 1px solid #e8e8e8;
      box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.06);
    }

    .action-buttons {
      min-height: 58px;
      padding: 12px 16px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 10px;
    }

    .total-label {
      color: #666;
    }

    .total-amount {
      font-size: 22px;
      margin-right: 10px;
    }

    .tree-batch-action-bar {
      height: 56px;
      padding: 0 16px 0 40px;
      display: none;
      justify-content: space-between;
      align-items: center;
    }

    .tree-batch-action-bar.show {
      display: flex;
    }

    .batch-selected-text em {
      color: #527DF7;
      font-style: normal;
      font-weight: 600;
      font-size: 16px;
    }

    .batch-actions {
      display: flex;
      gap: 12px;
    }

    .modal-mask {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(15, 23, 42, 0.42);
      backdrop-filter: blur(4px);
    }

    .modal-mask.open {
      display: flex;
    }

    .modal {
      width: min(560px, calc(100vw - 48px));
      max-height: calc(100vh - 80px);
      background: #fff;
      border-radius: 8px;
      border: 1px solid #e4e7ed;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 18px 48px rgba(15, 23, 42, 0.22);
    }

    .modal-header {
      height: 56px;
      flex: none;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #ebeef5;
      background: #f8fafc;
      font-weight: 600;
    }

    .modal-body {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 18px 20px;
    }

    .modal-footer {
      flex: none;
      padding: 12px 20px;
      border-top: 1px solid #ebeef5;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      background: #f8fafc;
    }

    .modal-close {
      border: 0;
      background: transparent;
      color: #909399;
      font-size: 22px;
      cursor: pointer;
    }

    .form-grid {
      display: grid;
      gap: 14px;
    }

    .form-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-item label {
      color: #303133;
      font-size: 13px;
      font-weight: 600;
    }

    .preview-list {
      max-height: 280px;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 12px;
    }

    .preview-item {
      padding: 9px 12px;
      border-radius: 6px;
      background: #f5f7fa;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .preview-item-image {
      width: 42px;
      height: 42px;
      flex: 0 0 auto;
      border-radius: 6px;
      border: 1px solid #e4e7ed;
      background: #fff;
      display: grid;
      place-items: center;
    }

    .preview-item-image svg {
      width: 24px;
      height: 24px;
    }

    .preview-item-content {
      min-width: 0;
      flex: 1;
    }

    .preview-item-name {
      font-weight: 500;
      color: #303133;
      margin-bottom: 4px;
    }

    .preview-item-meta {
      color: #909399;
      font-size: 12px;
      line-height: 18px;
    }

    .toast {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      min-width: 220px;
      padding: 10px 16px;
      background: #f0f9eb;
      color: #67c23a;
      border: 1px solid #b3e19d;
      border-radius: 6px;
      box-shadow: 0 8px 22px rgba(15, 23, 42, 0.12);
      display: none;
      z-index: 80;
      text-align: center;
    }

    .toast.show {
      display: block;
    }

    :root {
      --surface: rgba(255, 255, 255, 0.94);
      --surface-strong: #fff;
      --line-soft: #e7edf5;
      --line-strong: #d8e2ee;
      --text-strong: #172033;
      --text-main: #334155;
      --text-muted: #7b8798;
      --primary: #527DF7;
      --primary-soft: #eef3ff;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 12px 30px rgba(15, 23, 42, 0.08);
      --shadow-lg: 0 24px 70px rgba(15, 23, 42, 0.18);
    }

    body {
      color: var(--text-main);
      background: linear-gradient(180deg, #f7f9fc 0%, #eef2f7 100%);
    }

    .create-order-page {
      padding: 18px;
    }

    .info-card,
    .items-section,
    .modal {
      background: var(--surface);
      border: 1px solid rgba(216, 226, 238, 0.9);
      border-radius: 8px;
      box-shadow: var(--shadow-sm);
      backdrop-filter: blur(10px);
    }

    .section-header,
    .modal-header,
    .modal-footer {
      border-color: var(--line-soft);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(248, 250, 252, 0.92));
    }

    .section-title,
    .position-title,
    .preview-item-name {
      color: var(--text-strong);
    }

    .label,
    .position-desc,
    .preview-item-meta,
    .total-label {
      color: var(--text-muted);
    }

    .store-tab {
      border-color: var(--line-strong);
      border-radius: 6px;
      color: #465466;
      background: linear-gradient(180deg, #fff, #f8fafc);
      box-shadow: 0 1px 1px rgba(15, 23, 42, 0.03);
    }

    .store-tab:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .store-tab.active {
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
      box-shadow: 0 8px 18px rgba(82, 125, 247, 0.22);
    }

    .input,
    .select,
    .textarea,
    .number-input,
    .supplier-select,
    .reason-select-btn,
    .reason-input {
      border-color: var(--line-strong);
      border-radius: 6px;
      color: var(--text-main);
      background: #fff;
      transition: border-color 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
    }

    .input:focus,
    .select:focus,
    .textarea:focus,
    .number-input:focus,
    .supplier-select:focus,
    .reason-select-btn.open,
    .reason-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(82, 125, 247, 0.12);
    }

    .btn {
      border-color: var(--line-strong);
      border-radius: 6px;
      color: #465466;
      background: linear-gradient(180deg, #fff, #f8fafc);
      box-shadow: 0 1px 1px rgba(15, 23, 42, 0.03);
    }

    .btn:hover {
      border-color: var(--primary);
      color: var(--primary);
      box-shadow: 0 6px 16px rgba(82, 125, 247, 0.12);
      transform: translateY(-1px);
    }

    .btn-primary {
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
      box-shadow: 0 8px 18px rgba(82, 125, 247, 0.22);
    }

    .btn-primary:hover {
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:disabled {
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
      box-shadow: none;
      opacity: 0.45;
    }

    .btn-link {
      color: var(--primary);
      background: transparent;
      box-shadow: none;
    }

    .items-table-body {
      border-color: var(--line-soft);
      border-radius: 8px;
      background: #fff;
    }

    thead th {
      color: #7b8798;
      background: #f8fafc;
      border-bottom-color: var(--line-soft);
    }

    tbody td {
      color: var(--text-main);
      border-bottom-color: var(--line-soft);
    }

    tbody tr.selected td {
      background: var(--primary-soft);
    }

    tbody tr:hover td {
      background: #f8fbff;
    }

    .tree-expand-toggle,
    .row-expand-toggle:hover,
    .reason-option:hover,
    .reason-option.active,
    .batch-selected-text em {
      color: var(--primary);
    }

    .reason-option:hover,
    .reason-option.active {
      background: var(--primary-soft);
    }

    .tree-form-icon,
    .tree-spec-image,
    .preview-item-image {
      border-color: var(--line-soft);
      background: linear-gradient(135deg, #f8fafc, var(--primary-soft));
    }

    .tree-image-badge {
      box-shadow: 0 4px 10px rgba(15, 23, 42, 0.12);
    }

    .page-footer-bar,
    .tree-batch-action-bar {
      border-top-color: var(--line-soft);
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 -8px 24px rgba(15, 23, 42, 0.04);
    }

    .modal-mask {
      background: rgba(15, 23, 42, 0.46);
      backdrop-filter: blur(6px);
    }

    .modal {
      box-shadow: var(--shadow-lg);
    }

    .preview-item {
      border: 1px solid var(--line-soft);
      background: #f8fafc;
    }

    .procurement-tree-table th:nth-child(2),
    .procurement-tree-table td:nth-child(2) {
      width: 360px;
      max-width: 360px;
    }

    .procurement-tree-table .tree-info-cell {
      align-items: flex-start;
      max-width: 100%;
    }

    .procurement-tree-table .tree-text {
      min-width: 0;
      max-width: 100%;
    }

    .procurement-tree-table .position-title {
      align-items: flex-start;
      flex-wrap: wrap;
      row-gap: 4px;
    }

    .procurement-tree-table .position-title-text,
    .procurement-tree-table .position-desc {
      overflow: visible;
      white-space: normal;
      text-overflow: clip;
      word-break: break-all;
      line-height: 18px;
    }

    .procurement-tree-table .type-row-stats {
      flex-wrap: wrap;
      gap: 6px 12px;
    }

    .procurement-tree-table .qty-edit-field {
      width: 100%;
      justify-content: center;
      gap: 5px;
    }

    .procurement-tree-table .qty-edit-field .number-input {
      width: 84px;

<body>
  <div class="create-order-page">
    <div class="create-order-main">
      <div class="store-tabs" id="storeTabs"></div>

      <div class="info-section" id="infoSection"></div>

      <section class="items-section">
        <div class="section-title">采购明细</div>
        <div class="items-table-body">
          <table class="procurement-tree-table">
            <thead>
              <tr>
                <th style="width: 66px;" class="tree-check-cell"><input id="checkAll" type="checkbox" /></th>
                <th style="width: 360px;">
                  <div class="tree-info-header">
                    <span class="tree-expand-toggle" id="expandToggle">收起</span>
                    <span>仓位 / 道具信息</span>
                  </div>
                </th>
                <th style="width: 170px;"><span class="required-mark">*</span>采购原因</th>
                <th style="width: 150px; text-align: right;">每单位价格（元）</th>
                <th style="width: 145px; text-align: center;"><span class="required-mark">*</span>数量</th>
                <th style="width: 210px;"><span class="required-mark">*</span>供应商</th>
                <th style="width: 70px; text-align: center;">操作</th>
              </tr>
            </thead>
            <tbody id="treeBody"></tbody>
          </table>
        </div>
      </section>
    </div>

    <div class="page-footer-bar">
      <div class="action-buttons">
        <span class="total-label" id="totalLabel">合计包含0件道具，预估总金额：</span>
        <span class="total-amount" id="totalAmount">¥0.00</span>
        <button class="btn" id="backBtn" type="button">返回上一页面</button>
        <button class="btn" id="orderRemarkBtn" type="button">设置整单备注</button>
        <button class="btn" id="draftSaveBtn" type="button">暂存订单</button>
        <button class="btn btn-primary" id="submitBtn" type="button">下 单</button>
      </div>
    </div>

    <div class="tree-batch-action-bar" id="batchBar">
      <span class="batch-selected-text">已选择 <em id="selectedCount">0</em> 个道具</span>
      <div class="batch-actions">
        <button class="btn btn-primary" id="batchSupplierBtn" type="button">批量修改供应商</button>
        <button class="btn" id="batchQtyBtn" type="button">批量修改数量</button>
        <button class="btn" id="clearSelectionBtn" type="button">取消选择</button>
      </div>
    </div>
  </div>

  <div class="modal-mask" id="modalMask"></div>
  <div class="toast" id="toast"></div>

  <script>
    const ALL_STORES_ID = "__ALL_STORES__";
    const MULTI_SUPPLIER_VALUE = "__MULTI_SUPPLIER__";

    const supplierOptions = [

    const supplementReasonOptions = [

    ];

    const stores = [
      {
        id: "S001",

        storeForm: "旗舰形象",
        deliveryTime: "2026-06-18",
        remark: "请在营业前完成到货交接",

        }
      },
      {
        id: "S002",

        storeName: "成都春熙路标准店",
        storeForm: "标准形象",
        deliveryTime: "2026-06-19",
        remark: "",
        receiptInfo: {
          provinceName: "四川省",
          cityName: "成都市",
          districtName: "锦江区",
          detail: "春熙路北段 88 号 2F",
          contact: "周宁",
          phone: "13900139002"
        }
      },
      {
        id: "S003",
        storeCode: "WH003",
        storeName: "武汉光谷社区店",

        deliveryTime: "",
        remark: "",
        receiptInfo: {

          detail: "光谷社区商业街 18 号",
          contact: "王晓",
          phone: "13700137003"
        }
      }
    ];
    const DRAWING_STORE_KEY = "prototype:opened-store:design-drawings";
    const defaultStoreDrawings = {
      CQ001: [{ fileName: "CQ001-门店平面图.pdf", drawingType: "平面图", source: "已开业门店", dataUrl: "", mimeType: "application/pdf" }]
    };
    function readDrawingStore() {
      try { return JSON.parse(localStorage.getItem(DRAWING_STORE_KEY) || "{}"); } catch (error) { return {}; }
    }
    function writeDrawingStore(data) { localStorage.setItem(DRAWING_STORE_KEY, JSON.stringify(data)); }
    function drawingsForStore(store) {
      const saved = readDrawingStore()[store.storeCode] || defaultStoreDrawings[store.storeCode] || [];
      return [...saved, ...(store.designDrawings || [])];
    }
    function saveOrderDrawingsToOpenedStore() {
      const all = readDrawingStore();
      stores.forEach(store => {
        if (store.designDrawings?.length) all[store.storeCode] = [...(all[store.storeCode] || defaultStoreDrawings[store.storeCode] || []), ...store.designDrawings];
      });
      writeDrawingStore(all);
    }
    function goUploadDrawing(store) {
      window.parent.postMessage({ type: "prototype-route", action: "openStoreDrawingTab", storeCode: store.storeCode }, "*");
    }
    function drawingHtml(store) {
      const drawings = drawingsForStore(store);
      const files = drawings.length
        ? drawings.map((drawing, index) => `<span style="display:inline-flex;align-items:center;gap:6px;margin:0 8px 6px 0;padding:4px 8px;border:1px solid #d9ecff;background:#f0f7ff;color:#409eff;border-radius:3px"><span>${escapeHtml(drawing.fileName)}</span><button class="btn btn-small" style="min-height:24px;padding:1px 7px" data-preview-drawing="${index}" type="button">预览</button></span>`).join("")
        : `<span style="display:inline-flex;align-items:center;min-height:28px;color:#f56c6c">未上传设计图纸，请联系管理员/审核人上传</span>`;
      const refreshButton = `<button class="btn btn-small" style="min-height:28px;margin:0 8px 6px 0;padding:3px 12px;color:#527DF7" data-refresh-drawing type="button">刷新</button>`;
      return `<div class="info-row"><div class="label"><span class="required-mark">*</span>设计图纸:</div><div class="value" style="display:block"><div id="drawingList">${files}${refreshButton}</div></div></div>`;
    }
    function previewDrawing(store, index) {
      const drawing = drawingsForStore(store)[index];
      if (!drawing) return;
      const isImage = /^image\//.test(drawing.mimeType || "") || /\.(png|jpe?g)$/i.test(drawing.fileName);
      const content = drawing.dataUrl
        ? (isImage ? `<img src="${drawing.dataUrl}" alt="${escapeHtml(drawing.fileName)}" style="display:block;max-width:100%;max-height:58vh;margin:auto">` : `<iframe src="${drawing.dataUrl}" title="${escapeHtml(drawing.fileName)}" style="width:100%;height:58vh;border:0"></iframe>`)
        : `<div style="padding:40px 12px;text-align:center;color:#606266"><div style="font-size:28px;margin-bottom:12px">PDF</div><div>${escapeHtml(drawing.fileName)}</div><div style="margin-top:8px;color:#909399">该图纸来自已开业门店档案</div></div>`;
      modalShell("预览设计图纸", content, `<button class="btn btn-primary" data-modal-close type="button">关闭</button>`);
    }

    const storeProps = {
      S001: [
        {
          propType: "visual",
          propTypeDesc: "美陈道具",
          formName: "旗舰形象",
          specCode: "P1001",
          propName: "季节主题灯箱",
          specDesc: "亚克力面板 600*900mm，内置高亮灯带",
          propKind: "nonStandard",
          price: 328,
          unit: "个",
          qty: 4,
          supplierCode: "SUP001",
          supplierName: "山城广告制作"
        },
        {
          propType: "visual",
          propTypeDesc: "美陈道具",
          formName: "旗舰形象",
          specCode: "P1002",
          propName: "橱窗磁吸画面",
          specDesc: "磁吸软膜画面，可按门店尺寸裁切",
          propKind: "custom",
          price: 86,
          unit: "平米",
          qty: 2,
          supplierCode: "SUP002",
          supplierName: "华南印务"
        },
        {
          propType: "graphic",
          propTypeDesc: "平面道具",
          formName: "旗舰形象",
          specCode: "P2001",
          propName: "吊旗画面",
          specDesc: "双面写真覆膜，含吊挂配件",
          price: 39,
          unit: "平米",
          qty: 3,
          supplierCode: "SUP002",
          supplierName: "华南印务"
        }
      ],
      S002: [
        {
          propType: "display",
          propTypeDesc: "陈列道具",
          formName: "标准形象",
          specCode: "P3001",
          propName: "金属台卡",
          specDesc: "拉丝金属底座，适配 A5 画面",
          price: 58,
          unit: "个",
          qty: 5,
          supplierCode: "SUP003",
          supplierName: "简造陈列供应商"
        },
        {
          propType: "engineering",
          propTypeDesc: "工程道具",
          formName: "标准形象",
          specCode: "P4001",
          propName: "导视灯箱电源",
          specDesc: "12V 电源组件，含固定配件",
          price: 148,
          unit: "个",
          qty: 1,
          supplierCode: "SUP005",
          supplierName: "简造工程配套"
        }
      ],
      S003: [
        {
          propType: "graphic",
          propTypeDesc: "平面道具",
          formName: "社区形象",
          specCode: "P5001",
          propName: "社区门店促销海报",
          specDesc: "写真覆膜，适配社区店海报框",
          price: 24,
          unit: "平米",
          qty: 6,
          supplierCode: "",
          supplierName: ""
        }
      ]
    };

    const state = {
      currentStoreId: ALL_STORES_ID,
      expanded: true,
      collapsedRowIds: new Set(),
      selectedSpecIds: new Set(),
      orderRemark: "",
      activeDraftId: null,
      modalType: null
    };

    const els = {
      storeTabs: document.getElementById("storeTabs"),
      infoSection: document.getElementById("infoSection"),
      treeBody: document.getElementById("treeBody"),
      checkAll: document.getElementById("checkAll"),
      expandToggle: document.getElementById("expandToggle"),
      totalLabel: document.getElementById("totalLabel"),
      totalAmount: document.getElementById("totalAmount"),
      selectedCount: document.getElementById("selectedCount"),
      batchBar: document.getElementById("batchBar"),
      batchSupplierBtn: document.getElementById("batchSupplierBtn"),
      batchQtyBtn: document.getElementById("batchQtyBtn"),
      clearSelectionBtn: document.getElementById("clearSelectionBtn"),
      backBtn: document.getElementById("backBtn"),
      draftSaveBtn: document.getElementById("draftSaveBtn"),
      orderRemarkBtn: document.getElementById("orderRemarkBtn"),
      submitBtn: document.getElementById("submitBtn"),
      modalMask: document.getElementById("modalMask"),
      toast: document.getElementById("toast")
    };

    const DRAFT_STORAGE_KEY = "MAIN_POS_CREATE_ORDER_PROP_DRAFTS";

    function money(value) {
      return `¥${Number(value || 0).toFixed(2)}`;
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function propIcon(type) {
      const map = {
        visual: ["#f56c6c", "#fef0f0"],
        display: ["#67c23a", "#f0f9eb"],
        engineering: ["#909399", "#f4f4f5"],
        graphic: ["#e6a23c", "#fdf6ec"]
      };
      const [stroke, fill] = map[type] || ["#527DF7", "#eef3ff"];
      return `<svg viewBox="0 0 48 48" aria-hidden="true"><rect x="10" y="10" width="28" height="28" rx="5" fill="${fill}" stroke="${stroke}" stroke-width="2"/><path d="M17 19h14M17 25h14M17 31h9" stroke="${stroke}" stroke-width="2" stroke-linecap="round"/></svg>`;
    }

    function showToast(message, type = "success") {
      els.toast.textContent = message;
      els.toast.style.background = type === "warn" ? "#fffbe6" : "#f0f9eb";
      els.toast.style.color = type === "warn" ? "#d48806" : "#67c23a";
      els.toast.style.borderColor = type === "warn" ? "#ffe58f" : "#b3e19d";
      els.toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => els.toast.classList.remove("show"), 2400);
    }

    function readDrafts() {
      try {
        return JSON.parse(localStorage.getItem(DRAFT_STORAGE_KEY) || "[]");
      } catch (error) {
        return [];
      }
    }

    function writeDrafts(drafts) {
      localStorage.setItem(DRAFT_STORAGE_KEY, JSON.stringify(drafts));
    }

    function draftSnapshot() {
      return {
        currentStoreId: state.currentStoreId,
        expanded: state.expanded,
        collapsedRowIds: [...state.collapsedRowIds],
        selectedSpecIds: [...state.selectedSpecIds],
        orderRemark: state.orderRemark,
        stores,
        storeProps
      };
    }

    function restoreArray(target, source) {
      target.splice(0, target.length, ...(source || []));
    }

    function restoreObject(target, source) {
      Object.keys(target).forEach(key => delete target[key]);
      Object.assign(target, source || {});
    }

    function saveDraft() {
      const missing = allLeaves().filter(leaf => !leaf.supplierCode || !leaf.supplementReasonCode || Number(leaf.qty) < 0).length;
      const drafts = readDrafts();
      const id = `create_prop_${Date.now()}`;
      state.activeDraftId = id;
      drafts.unshift({
        id,
        title: `道具建单草稿-${totalQty()}件-${money(totalAmount())}`,
        stage: missing ? `建单中，${missing}项待完善` : "建单中",
        count: totalQty(),
        amount: money(totalAmount()),
        updatedAt: new Date().toLocaleString("zh-CN", { hour12: false }),
        snapshot: draftSnapshot()
      });
      writeDrafts(drafts.slice(0, 10));
      showToast(missing ? `已暂存，仍有 ${missing} 项信息待完善` : "已暂存订单草稿");
    }

    function restoreDraft(id) {
      const draft = readDrafts().find(item => item.id === id);
      if (!draft) return showToast("草稿不存在", "warn");
      const data = draft.snapshot || {};
      state.currentStoreId = data.currentStoreId || ALL_STORES_ID;
      state.expanded = data.expanded !== false;
      state.collapsedRowIds = new Set(data.collapsedRowIds || []);
      state.selectedSpecIds = new Set(data.selectedSpecIds || []);
      state.orderRemark = data.orderRemark || "";
      restoreArray(stores, data.stores);
      restoreObject(storeProps, data.storeProps);
      closeModal();
      render();
      showToast("已恢复暂存草稿");
    }

    function deleteDraft(id) {
      writeDrafts(readDrafts().filter(item => item.id !== id));
      renderDraftList();
      showToast("草稿已删除");
    }

    function renderDraftList() {
      const drafts = readDrafts();
      modalShell("暂存记录", `${drafts.length ? `<table class="procurement-tree-table">
        <thead><tr><th>草稿名称</th><th style="width:150px;">状态</th><th style="width:150px;">更新时间</th><th style="width:140px;">操作</th></tr></thead>
        <tbody>${drafts.map(draft => `<tr>
          <td>${escapeHtml(draft.title)}</td>
          <td>${escapeHtml(draft.stage)}</td>
          <td>${escapeHtml(draft.updatedAt)}</td>
          <td><button class="btn btn-link" data-restore-draft="${draft.id}" type="button">继续编辑</button><button class="btn btn-link danger-link" data-delete-draft="${draft.id}" type="button">删除</button></td>
        </tr>`).join("")}</tbody>
      </table>` : `<div class="empty-data-tip">暂无暂存记录</div>`}`, `<button class="btn" data-modal-close type="button">关闭</button>`);
    }

    function allLeaves() {
      return Object.entries(storeProps).flatMap(([storeId, props]) => props.map(prop => ({ ...prop, storeId })));
    }

    function currentLeaves() {
      if (state.currentStoreId === ALL_STORES_ID) return allLeaves();
      return (storeProps[state.currentStoreId] || []).map(prop => ({ ...prop, storeId: state.currentStoreId }));
    }

    function lineTotal(prop) {
      return Number(prop.price || 0) * Number(prop.qty || 0);
    }

    function formatUnitPrice(row) {
      if (row.priceDisplay) return row.priceDisplay;
      return `${money(row.price || 0)}/每${row.unit || "个"}`;
    }

    function formatQty(row) {
      if (row.qtyDisplay) return row.qtyDisplay;
      return `${row.qty || 0}${row.unit || "个"}`;
    }

    function inferUnit(rows) {
      const units = [...new Set(rows.map(row => row.unit || "个"))];
      return units.length === 1 ? units[0] : "";
    }

    function inferPriceDisplay(rows) {
      const values = [...new Set(rows.map(row => `${Number(row.price || 0)}__${row.unit || "个"}`))];
      if (values.length === 1) return formatUnitPrice(rows[0]);
      return "多价格";
    }

    function inferQtyDisplay(row) {
      return row.unit ? `${row.qty || 0}${row.unit}` : `${row.qty || 0}`;
    }

    function selectedStore() {
      return stores.find(store => store.id === state.currentStoreId);
    }

    function getStoreItemCount(storeId) {
      return (storeProps[storeId] || []).reduce((sum, prop) => sum + Number(prop.qty || 0), 0);
    }

    function totalAmount() {
      return allLeaves().reduce((sum, prop) => sum + lineTotal(prop), 0);
    }

    function totalQty() {
      return allLeaves().reduce((sum, prop) => sum + Number(prop.qty || 0), 0);
    }

    function uniqueSupplierCount(rows) {
      return new Set(rows.map(row => row.supplierCode).filter(Boolean)).size;
    }

    function buildTreeRows() {
      const leaves = currentLeaves();
      const typeMap = new Map();
      leaves.forEach(leaf => {
        const typeKey = leaf.propType;
        if (!typeMap.has(typeKey)) {
          typeMap.set(typeKey, {
            id: `type_${typeKey}`,
            level: "type",
            propType: typeKey,
            label: leaf.propTypeDesc,
            children: new Map()
          });
        }
        const typeNode = typeMap.get(typeKey);
        if (state.currentStoreId === ALL_STORES_ID) {
          const categoryKey = leaf.propKind === "custom" ? "定制道具" : (leaf.formName || "其他形象");
          const categoryLevel = leaf.propKind === "custom" ? "customCategory" : "form";
          if (!typeNode.children.has(categoryKey)) {
            typeNode.children.set(categoryKey, {
              id: `${categoryLevel}_${typeKey}_${categoryKey}`,
              level: "form",
              categoryLevel,
              propType: typeKey,
              label: categoryKey,
              children: new Map()
            });
          }
          const formNode = typeNode.children.get(categoryKey);
          const specKey = `${leaf.specCode}_${categoryKey}`;
          if (!formNode.children.has(specKey)) {
            formNode.children.set(specKey, makeSpecAggregate(typeKey, categoryKey, leaf));
          } else {
            mergeSpecAggregate(formNode.children.get(specKey), leaf);
          }
        } else {
          const specKey = leaf.specCode;
          if (!typeNode.children.has(specKey)) {
            typeNode.children.set(specKey, makeSpecAggregate(typeKey, leaf.formName, leaf));
          } else {
            mergeSpecAggregate(typeNode.children.get(specKey), leaf);
          }
        }
      });

      const rows = [];
      typeMap.forEach(typeNode => {
        const childRows = [...typeNode.children.values()].map(child => normalizeParent(child));
        rows.push(normalizeParent({ ...typeNode, children: childRows }));
      });
      return rows;
    }

    function makeSpecAggregate(typeKey, formName, leaf) {
      return {
        id: `spec_${typeKey}_${formName}_${leaf.specCode}`,
        level: "spec",
        propType: typeKey,
        formName,
        originalFormName: leaf.formName,
        label: leaf.propName,
        subLabel: leaf.specDesc,
        specCode: leaf.specCode,
        propKind: leaf.propKind || "standard",
        price: leaf.price,
        unit: leaf.unit || "个",
        qty: Number(leaf.qty || 0),
        total: lineTotal(leaf),
        supplierCode: leaf.supplierCode,
        supplierName: leaf.supplierName,
        supplementReasonCode: leaf.supplementReasonCode || "",
        supplementReasonText: leaf.supplementReasonText || "",
        leaves: [leaf]
      };
    }

    function mergeSpecAggregate(row, leaf) {
      row.qty += Number(leaf.qty || 0);
      row.total += lineTotal(leaf);
      row.leaves.push(leaf);
      row.unit = inferUnit(row.leaves);
      row.priceDisplay = inferPriceDisplay(row.leaves);
      const supplierCodes = [...new Set(row.leaves.map(item => item.supplierCode).filter(Boolean))];
      row.supplierCode = supplierCodes.length === 1 ? supplierCodes[0] : supplierCodes.length > 1 ? MULTI_SUPPLIER_VALUE : "";
      row.supplierName = row.supplierCode === MULTI_SUPPLIER_VALUE ? "多供应商" : supplierName(row.supplierCode);
      row.supplementReasonCode = inferReasonCode(row.leaves);
      row.supplementReasonText = inferReasonText(row.leaves);
    }

    function normalizeParent(node) {
      if (node.level === "spec") {
        const leaves = node.leaves || [];
        return {
          ...node,
          children: [],
          qty: leaves.reduce((sum, leaf) => sum + Number(leaf.qty || 0), 0),
          unit: inferUnit(leaves),
          priceDisplay: inferPriceDisplay(leaves),
          qtyDisplay: inferQtyDisplay({ qty: leaves.reduce((sum, leaf) => sum + Number(leaf.qty || 0), 0), unit: inferUnit(leaves) }),
          total: leaves.reduce((sum, leaf) => sum + lineTotal(leaf), 0),
          supplierCode: inferSupplierCode(leaves),
          supplierName: inferSupplierName(leaves),
          supplementReasonCode: inferReasonCode(leaves),
          supplementReasonText: inferReasonText(leaves)
        };
      }
      const children = Array.isArray(node.children) ? node.children : [...(node.children || new Map()).values()];
      const specRows = flattenSpecs(children);
      return {
        ...node,
        children,
        qty: specRows.reduce((sum, row) => sum + Number(row.qty || 0), 0),
        unit: inferUnit(specRows),
        priceDisplay: inferPriceDisplay(specRows),
        qtyDisplay: inferQtyDisplay({ qty: specRows.reduce((sum, row) => sum + Number(row.qty || 0), 0), unit: inferUnit(specRows) }),
        total: specRows.reduce((sum, row) => sum + Number(row.total || 0), 0),
        supplierCode: inferSupplierCode(specRows),
        supplierName: inferSupplierName(specRows),
        supplementReasonCode: inferReasonCode(specRows),
        supplementReasonText: inferReasonText(specRows),
        specCount: specRows.length,
        supplierCount: uniqueSupplierCount(specRows)
      };
    }

    function flattenSpecs(rows) {
      return rows.flatMap(row => row.level === "spec" ? [row] : flattenSpecs(row.children || []));
    }

    function inferSupplierCode(specRows) {
      const codes = [...new Set(specRows.map(row => row.supplierCode).filter(Boolean).filter(code => code !== MULTI_SUPPLIER_VALUE))];
      if (codes.length === 1) return codes[0];
      if (codes.length > 1) return MULTI_SUPPLIER_VALUE;
      return "";
    }

    function inferSupplierName(specRows) {
      const code = inferSupplierCode(specRows);
      return code === MULTI_SUPPLIER_VALUE ? "多供应商" : supplierName(code);
    }

    function supplierName(code) {
      return supplierOptions.find(item => item.code === code)?.name || "";
    }

    function reasonName(code) {
      return supplementReasonOptions.find(item => item.code === code)?.name || "";
    }

    function reasonDisplay(row) {
      if (row.supplementReasonCode === "other") return row.supplementReasonText || "其它";
      if (row.supplementReasonCode === "__MULTI_REASON__") return "多采购原因";
      return reasonName(row.supplementReasonCode) || "请选择";
    }

    function reasonKey(item) {
      const code = item.supplementReasonCode || "";
      return code === "other" ? `${code}:${item.supplementReasonText || ""}` : code;
    }

    function inferReasonCode(rows) {
      const keys = [...new Set(rows.map(reasonKey).filter(Boolean))];
      if (keys.length === 1) return keys[0].split(":")[0];
      if (keys.length > 1) return "__MULTI_REASON__";
      return "";
    }

    function inferReasonText(rows) {
      const keys = [...new Set(rows.map(reasonKey).filter(Boolean))];
      if (keys.length !== 1 || !keys[0].startsWith("other:")) return "";
      return keys[0].slice("other:".length);
    }

    function visibleRows(rows = buildTreeRows()) {
      const result = [];
      rows.forEach(typeRow => {
        result.push(typeRow);
        if (!state.expanded || state.collapsedRowIds.has(typeRow.id)) return;
        (typeRow.children || []).forEach(child => {
          result.push(child);
          if (child.level !== "spec" && !state.collapsedRowIds.has(child.id)) result.push(...(child.children || []));
        });
      });
      return result;
    }

    function specRows() {
      return flattenSpecs(buildTreeRows());
    }

    function rowSpecs(row) {
      return row.level === "spec" ? [row] : flattenSpecs(row.children || []);
    }

    function isRowChecked(row) {
      const specs = rowSpecs(row);
      return specs.length > 0 && specs.every(spec => state.selectedSpecIds.has(spec.id));
    }

    function isRowIndeterminate(row) {
      const specs = rowSpecs(row);
      const count = specs.filter(spec => state.selectedSpecIds.has(spec.id)).length;
      return count > 0 && count < specs.length;
    }

    function setRowSelected(row, checked) {
      rowSpecs(row).forEach(spec => {
        if (checked) state.selectedSpecIds.add(spec.id);
        else state.selectedSpecIds.delete(spec.id);
      });
      render();
    }

    function selectedSpecs() {
      const valid = specRows();
      const validIds = new Set(valid.map(row => row.id));
      [...state.selectedSpecIds].forEach(id => {
        if (!validIds.has(id)) state.selectedSpecIds.delete(id);
      });
      return valid.filter(row => state.selectedSpecIds.has(row.id));
    }

    function storeReasonRow() {
      const specs = specRows();
      return {
        id: "store_all",
        level: "store",
        children: specs,
        supplementReasonCode: inferReasonCode(specs),
        supplementReasonText: inferReasonText(specs)
      };
    }

    function renderStoreTabs() {
      const tabs = [];
      if (stores.length > 1) tabs.push({ id: ALL_STORES_ID, label: "全部门店", isAll: true, count: totalQty() });
      stores.forEach(store => tabs.push({ id: store.id, label: store.storeName, count: getStoreItemCount(store.id) }));
      els.storeTabs.innerHTML = tabs.map(tab => `<button class="store-tab ${state.currentStoreId === tab.id ? "active" : ""}" data-store-tab="${tab.id}" type="button">
        ${tab.isAll ? "▦" : ""}<span>${escapeHtml(tab.label)}</span><span class="store-tab-count">${tab.count}</span>
      </button>`).join("");
    }

    function renderInfoSection() {
      if (state.currentStoreId === ALL_STORES_ID) {
        els.infoSection.innerHTML = "";
        return;
      }
      const store = selectedStore();
      const receipt = store?.receiptInfo || {};
      const address = [receipt.provinceName, receipt.cityName, receipt.districtName, receipt.detail].filter(Boolean).join("");
      els.infoSection.innerHTML = `<div class="info-card delivery-info">
        <div class="section-header"><span class="section-title">订单信息</span></div>
        <div class="receipt-grid">
          <div class="info-row">
            <div class="label"><span class="required-mark">*</span>收货信息:</div>
            <div class="value">
              <div class="address-text" title="${escapeHtml(address || "-")}">${escapeHtml(address || "-")}</div>
              <span class="inline-value">${escapeHtml(receipt.contact || "-")}</span>
              <span class="inline-value">${escapeHtml(receipt.phone || "-")}</span>
              <button class="btn btn-small" id="editAddressBtn" type="button">修改</button>
            </div>
          </div>
          <div class="info-row">
            <div class="label"><span class="required-mark">*</span>采购原因:</div>
            ${reasonControlHtml(storeReasonRow(), "store")}
          </div>
          <div class="info-row">
            <div class="label"><span class="required-mark">*</span>要求到货时间:</div>
            <input class="input" id="deliveryTimeInput" type="date" value="${escapeHtml(store?.deliveryTime || "")}">
          </div>
          ${drawingHtml(store)}
          <div class="info-row">
            <div class="label">备注:</div>
            <textarea class="textarea" id="storeRemarkInput" maxlength="500" placeholder="请输入备注">${escapeHtml(store?.remark || "")}</textarea>
          </div>
        </div>
      </div>`;
    }

    function renderTree() {
      const rows = visibleRows();
      els.treeBody.innerHTML = rows.map(row => {
        const checked = isRowChecked(row);
        const ind = isRowIndeterminate(row);
        const isSpec = row.level === "spec";
        const supplierValue = row.supplierCode || "";
        const disabledDelete = specRows().length <= rowSpecs(row).length;
        const rowClasses = [
          checked || ind ? "selected" : "",
          `tree-row-${row.level}`,
          isSpec ? "tree-row-spec" : "tree-row-parent"
        ].filter(Boolean).join(" ");
        return `<tr class="${rowClasses}" data-row-id="${row.id}">
          <td class="tree-check-cell">
            <input type="checkbox" data-check-row="${row.id}" ${checked ? "checked" : ""} ${ind ? "data-indeterminate='true'" : ""}>
          </td>
          <td>${treeInfoHtml(row)}</td>
          <td>${reasonSelectHtml(row)}</td>
          <td style="text-align: right;">${isSpec ? formatUnitPrice(row) : ""}</td>
          <td style="text-align: center;">
            ${isSpec ? (state.currentStoreId !== ALL_STORES_ID ? `<div class="qty-edit-field"><input class="number-input" data-qty-row="${row.id}" type="number" min="0" step="1" value="${row.qty}"><span>${row.unit || "个"}</span></div>` : formatQty(row)) : ""}
          </td>
          <td>${supplierSelectHtml(row, supplierValue)}</td>
          <td style="text-align: center;"><button class="btn btn-link btn-link-danger" data-delete-row="${row.id}" ${disabledDelete ? "disabled" : ""} type="button">删除</button></td>
        </tr>`;
      }).join("");
      els.treeBody.querySelectorAll("[data-indeterminate='true']").forEach(input => input.indeterminate = true);
    }

    function rowToggleHtml(row) {
      if (row.level === "spec") return "";
      const collapsed = state.collapsedRowIds.has(row.id);
      return `<button class="row-expand-toggle" data-toggle-row="${row.id}" type="button" aria-label="${collapsed ? "展开" : "收起"}">${collapsed ? "▶" : "▼"}</button>`;
    }

    function treeInfoHtml(row) {
      if (row.level === "type") {
        return `<div class="tree-info-cell tree-level-type">
          ${rowToggleHtml(row)}
          <div class="tree-type-icon type-${row.propType}">◇</div>
          <div class="tree-text">
            <div class="position-title">
              <span class="level-badge level-badge-type">类型</span>
              <span class="position-title-text" title="${escapeHtml(row.label)}">${escapeHtml(row.label)}</span>
              <span class="type-row-stats"><span>${row.specCount}件道具</span><span>${row.supplierCount}个供应商</span></span>
            </div>
          </div>
        </div>`;
      }
      if (row.level === "form") {
        return `<div class="tree-info-cell tree-level-form">
          ${rowToggleHtml(row)}
          <div class="tree-form-icon">${row.categoryLevel === "customCategory" ? "✦" : "⌂"}</div>
          <div class="tree-text"><div class="position-title"><span class="level-badge level-badge-form">${row.categoryLevel === "customCategory" ? "定制" : "装修形象"}</span><span class="position-title-text" title="${escapeHtml(row.label)}">${escapeHtml(row.label)}</span></div></div>
        </div>`;
      }
      const badge = row.propKind === "nonStandard"
        ? `<div class="tree-image-badge non-standard">非标</div>`
        : row.propKind === "custom"
          ? `<div class="tree-image-badge custom">定制</div>`
          : "";
      return `<div class="tree-info-cell tree-level-spec">
        <div class="tree-spec-image">${propIcon(row.propType)}${badge}</div>
        <div class="tree-text">
          <div class="position-title"><span class="position-title-text" title="${escapeHtml(row.label)}">${escapeHtml(row.label)}</span></div>
          <div class="position-desc" title="${escapeHtml(row.subLabel || "-")}">${escapeHtml(row.subLabel || "-")}</div>
        </div>
      </div>`;
    }

    function supplierSelectHtml(row, value) {
      return `<select class="supplier-select" data-supplier-row="${row.id}" onchange="handleSupplierChange('${escapeHtml(row.id)}', this.value, this)">
        <option value="">请选择</option>
        ${value === MULTI_SUPPLIER_VALUE ? `<option value="${MULTI_SUPPLIER_VALUE}" selected disabled>多供应商</option>` : ""}
        ${supplierOptions.map(opt => `<option value="${opt.code}" ${value === opt.code ? "selected" : ""}>${opt.name}</option>`).join("")}
      </select>`;
    }

    function renderFooter() {
      const qty = totalQty();
      els.totalLabel.textContent = `合计包含${qty}件道具，预估总金额：`;
      els.totalAmount.textContent = money(totalAmount());
      const selected = selectedSpecs();
      els.selectedCount.textContent = selected.length;
      els.batchBar.classList.toggle("show", selected.length > 0);
      const all = specRows();
      const selectedAll = all.length > 0 && all.every(row => state.selectedSpecIds.has(row.id));
      const selectedSome = all.some(row => state.selectedSpecIds.has(row.id));
      els.checkAll.checked = selectedAll;
      els.checkAll.indeterminate = selectedSome && !selectedAll;
      els.expandToggle.textContent = state.expanded ? "收起" : "展开";
    }

    function render() {
      renderStoreTabs();
      renderInfoSection();
      renderTree();
      renderFooter();
    }

    function findRow(rowId) {
      return visibleRows().find(row => row.id === rowId) || specRows().find(row => row.id === rowId);
    }

    function updateUnderlyingLeaves(specRow, fields) {
      (specRow.leaves || []).forEach(leaf => {
        const list = storeProps[leaf.storeId] || [];
        const item = list.find(prop => prop.specCode === leaf.specCode && prop.formName === leaf.formName);
        if (!item) return;
        if (fields.qty !== undefined) item.qty = fields.qty;
        if (fields.supplierCode !== undefined) {
          item.supplierCode = fields.supplierCode;
          item.supplierName = supplierName(fields.supplierCode);
        }
        if (fields.supplementReasonCode !== undefined) item.supplementReasonCode = fields.supplementReasonCode;
        if (fields.supplementReasonText !== undefined) item.supplementReasonText = fields.supplementReasonText;
      });
    }

    function applySupplier(row, code, shouldRender = true) {
      rowSpecs(row).forEach(spec => updateUnderlyingLeaves(spec, { supplierCode: code || "" }));
      if (shouldRender) render();
    }

    function applyQty(row, qty) {
      rowSpecs(row).forEach(spec => updateUnderlyingLeaves(spec, { qty: Math.max(0, Math.floor(Number(qty) || 0)) }));
      render();
    }

    function applyReason(row, code, text = "", shouldRender = true) {
      rowSpecs(row).forEach(spec => updateUnderlyingLeaves(spec, {
        supplementReasonCode: code || "",
        supplementReasonText: code === "other" ? text : ""
      }));
      if (shouldRender) render();
    }

    function applyStoreReason(code, text = "", shouldRender = true) {
      specRows().forEach(spec => updateUnderlyingLeaves(spec, {
        supplementReasonCode: code || "",
        supplementReasonText: code === "other" ? text : ""
      }));
      if (shouldRender) render();
    }

    function attrSelectorValue(value) {
      return String(value).replace(/\\/g, "\\\\").replace(/"/g, '\\"');
    }

    function syncReasonControls() {
      [storeReasonRow(), ...visibleRows()].forEach(row => {
        const container = row.level === "store" ? els.infoSection : els.treeBody;
        const button = container.querySelector(`[data-reason-row="${attrSelectorValue(row.id)}"]`);
        if (!button) return;
        const value = row.supplementReasonCode || "";
        button.dataset.reasonValue = value;
        button.querySelector(".reason-select-text").textContent = reasonDisplay(row);
        const control = button.closest(".reason-control");
        control?.querySelectorAll(".reason-option").forEach(option => {
          option.classList.toggle("active", option.dataset.reasonOption === value);
        });
        const input = control?.querySelector("[data-reason-text-row]");
        if (input) {
          input.classList.toggle("show", value === "other");
          input.value = value === "other" ? row.supplementReasonText || "" : "";
        }
      });
    }

    function handleSupplierChange(rowId, code, selectEl) {
      const row = findRow(rowId);
      if (!row) return;
      applySupplier(row, code, false);
      if (selectEl) selectEl.value = code;
      renderFooter();
    }

    function handleReasonChange(rowId, code, triggerEl, scope = "tree") {
      if (scope === "store") {
        applyStoreReason(code || "", "", false);
      } else {
        const row = findRow(rowId);
        if (!row) return;
        applyReason(row, code || "", "", false);
      }
      if (triggerEl) {
        const input = triggerEl.closest(".reason-control")?.querySelector("[data-reason-text-row]");
        if (input) {
          input.classList.toggle("show", code === "other");
          if (code !== "other") input.value = "";
          if (code === "other") input.focus();
        }
      }
      syncReasonControls();
    }

    function handleReasonTextInput(rowId, text, scope = "tree") {
      if (scope === "store") {
        applyStoreReason("other", text, false);
      } else {
        const row = findRow(rowId);
        if (!row) return;
        applyReason(row, "other", text, false);
      }
      syncReasonControls();
    }

    function closeReasonMenus() {
      document.querySelectorAll(".reason-menu.open").forEach(item => item.classList.remove("open"));
      document.querySelectorAll(".reason-select-btn.open").forEach(item => item.classList.remove("open"));
    }

    function handleReasonControlClick(event) {
      const reasonBtn = event.target.closest("[data-reason-row]");
      if (reasonBtn) {
        const control = reasonBtn.closest(".reason-control");
        const menu = control?.querySelector(".reason-menu");
        const shouldOpen = !menu?.classList.contains("open");
        closeReasonMenus();
        if (shouldOpen) {
          menu?.classList.add("open");
          reasonBtn.classList.add("open");
        }
        return true;
      }
      const reasonOption = event.target.closest("[data-reason-option]");
      if (reasonOption) {
        const control = reasonOption.closest(".reason-control");
        const button = control?.querySelector("[data-reason-row]");
        if (button) handleReasonChange(button.dataset.reasonRow, reasonOption.dataset.reasonOption || "", reasonOption, button.dataset.reasonScope || "tree");
        control?.querySelector(".reason-menu")?.classList.remove("open");
        button?.classList.remove("open");
        return true;
      }
      return false;
    }

    function removeRow(row) {
      rowSpecs(row).forEach(spec => {
        (spec.leaves || []).forEach(leaf => {
          storeProps[leaf.storeId] = (storeProps[leaf.storeId] || []).filter(prop => !(prop.specCode === leaf.specCode && prop.formName === leaf.formName));
        });
      });
      state.selectedSpecIds.clear();
      render();
      showToast("清除成功");
    }

    function openModal(type) {
      state.modalType = type;
      if (type === "supplier") return renderSupplierModal();
      if (type === "reason") return renderReasonModal();
      if (type === "qty") return renderQtyModal();
      if (type === "address") return renderAddressModal();
      if (type === "remark") return renderRemarkModal();
      if (type === "submit") return renderSubmitModal();
      if (type === "back") return renderBackModal();
    }

    function closeModal() {
      state.modalType = null;
      els.modalMask.classList.remove("open");
      els.modalMask.innerHTML = "";
    }

    function modalShell(title, body, footer) {
      els.modalMask.classList.add("open");
      els.modalMask.innerHTML = `<div class="modal">
        <div class="modal-header"><span>${title}</span><button class="modal-close" data-modal-close type="button">×</button></div>
        <div class="modal-body">${body}</div>
        <div class="modal-footer">${footer}</div>
      </div>`;
    }

    function selectedPreviewHtml() {
      return `<div class="preview-list">${selectedSpecs().map(row => `<div class="preview-item">
        <div class="preview-item-image">${propIcon(row.propType)}</div>
        <div class="preview-item-content">
          <div class="preview-item-name" title="${escapeHtml(row.label)}">${escapeHtml(row.label)}</div>
          <div class="preview-item-meta" title="${escapeHtml(row.subLabel || "-")}">规格：${escapeHtml(row.subLabel || "-")}</div>
          <div class="preview-item-meta">${escapeHtml(row.formName || "")} · 当前供应商：${escapeHtml(row.supplierName || "未选择")} · 数量：${row.qty}</div>
        </div>
      </div>`).join("")}</div>`;
    }

    function reasonControlHtml(row, scope = "tree") {
      const value = row.supplementReasonCode || "";
      const customValue = row.supplementReasonText || "";
      const options = supplementReasonOptions.map(opt => `<button class="reason-option ${value === opt.code ? "active" : ""}" data-reason-option="${opt.code}" type="button">${opt.name}</button>`).join("");
      return `<div class="reason-control">
        <button class="reason-select-btn" data-reason-row="${row.id}" data-reason-scope="${scope}" data-reason-value="${value}" type="button"><span class="reason-select-text">${escapeHtml(reasonDisplay(row))}</span></button>
        <div class="reason-menu" data-reason-menu="${row.id}">
          <button class="reason-option ${!value ? "active" : ""}" data-reason-option="" type="button">请选择</button>
          ${options}
        </div>
        <input class="reason-input ${value === "other" ? "show" : ""}" data-reason-text-row="${row.id}" data-reason-scope="${scope}" oninput="handleReasonTextInput('${escapeHtml(row.id)}', this.value, '${scope}')" maxlength="50" value="${escapeHtml(customValue)}" placeholder="请输入采购原因">
      </div>`;
    }

    function reasonSelectHtml(row) {
      return reasonControlHtml(row, "tree");
    }

    function renderReasonModal() {
      modalShell("设置采购原因", `<div class="form-grid">
        <div class="form-item"><label><span class="required-mark">*</span>采购原因：</label><select class="select" id="batchReasonSelect"><option value="">请选择</option>${supplementReasonOptions.map(opt => `<option value="${opt.code}">${opt.name}</option>`).join("")}</select></div>
        <div class="form-item" id="batchReasonTextWrap" style="display:none;"><label><span class="required-mark">*</span>自定义原因：</label><input class="input" id="batchReasonInput" maxlength="50" placeholder="请输入采购原因"></div>
        <div><p class="batch-supplier-list-title">以下道具将被设置采购原因：</p>${selectedPreviewHtml()}</div>
      </div>`, `<button class="btn" data-modal-close type="button">取消</button><button class="btn btn-primary" data-confirm-reason type="button">确认设置</button>`);
    }

    function renderSupplierModal() {
      modalShell("批量修改供应商", `<div class="form-grid">
        <div class="form-item"><label><span class="required-mark">*</span>选择新供应商：</label><select class="select" id="batchSupplierSelect"><option value="">请选择</option>${supplierOptions.map(opt => `<option value="${opt.code}">${opt.name}</option>`).join("")}</select></div>
        <div><p class="batch-supplier-list-title">以下道具将被修改供应商：</p>${selectedPreviewHtml()}</div>
      </div>`, `<button class="btn" data-modal-close type="button">取消</button><button class="btn btn-primary" data-confirm-supplier type="button">确认修改</button>`);
    }

    function renderQtyModal() {
      modalShell("批量修改数量", `<div class="form-grid">
        <div class="form-item"><label><span class="required-mark">*</span>设置新数量：</label><input class="input" id="batchQtyInput" type="number" min="0" step="1" value="1"></div>
        <div><p class="batch-supplier-list-title">以下 ${selectedSpecs().length} 个道具的数量将被修改：</p>${selectedPreviewHtml()}</div>
      </div>`, `<button class="btn" data-modal-close type="button">取消</button><button class="btn btn-primary" data-confirm-qty type="button">确认修改</button>`);
    }

    function renderAddressModal() {
      const store = selectedStore();
      const receipt = store.receiptInfo;
      modalShell("修改收货地址", `<div class="form-grid">
        <div class="form-item"><label>所属区域</label><input class="input" id="addrArea" value="${escapeHtml([receipt.provinceName, receipt.cityName, receipt.districtName].filter(Boolean).join("/"))}"></div>
        <div class="form-item"><label>详细地址</label><textarea class="textarea" id="addrDetail">${escapeHtml(receipt.detail || "")}</textarea></div>
        <div class="form-item"><label>收货人名字</label><input class="input" id="addrContact" value="${escapeHtml(receipt.contact || "")}"></div>
        <div class="form-item"><label>手机号</label><input class="input" id="addrPhone" value="${escapeHtml(receipt.phone || "")}"></div>
      </div>`, `<button class="btn" data-modal-close type="button">取消</button><button class="btn btn-primary" data-save-address type="button">保存</button>`);
    }

    function renderRemarkModal() {
      modalShell("设置整单备注", `<div class="form-item"><label>整单备注</label><textarea class="textarea" id="orderRemarkInput" maxlength="500" style="min-height: 130px;" placeholder="请输入整单备注（最多500字）">${escapeHtml(state.orderRemark)}</textarea></div>`, `<button class="btn" data-modal-close type="button">取消</button><button class="btn btn-primary" data-save-remark type="button">保存</button>`);
    }

    function renderSubmitModal() {
      modalShell("提示", `<div>确定提交订单吗？</div>`, `<button class="btn" data-modal-close type="button">取消</button><button class="btn btn-primary" data-confirm-submit type="button">确定</button>`);
    }

    function renderBackModal() {
      modalShell("提示", `<div>返回后供应商及数量将会恢复默认配置，确定返回？</div>`, `<button class="btn" data-modal-close type="button">取消</button><button class="btn btn-primary" data-confirm-back type="button">确定</button>`);
    }

    function validateBeforeSubmit() {
      const missingSupplier = allLeaves().filter(leaf => !leaf.supplierCode);
      const missingReason = allLeaves().filter(leaf => !leaf.supplementReasonCode || (leaf.supplementReasonCode === "other" && !String(leaf.supplementReasonText || "").trim()));
      const missingQty = allLeaves().filter(leaf => leaf.qty === "" || leaf.qty === null || Number(leaf.qty) < 0);
      const receiptIssues = stores.filter(store => getStoreItemCount(store.id) > 0 && (!store.deliveryTime || !store.receiptInfo?.detail || !store.receiptInfo?.contact || !/^1[3-9]\d{9}$/.test(store.receiptInfo?.phone || "")));
      const drawingIssues = stores.filter(store => getStoreItemCount(store.id) > 0 && drawingsForStore(store).length === 0);
      if (!allLeaves().length) {
        showToast("暂无采购明细，不允许提交订单", "warn");
        return false;
      }
      if (missingSupplier.length || missingReason.length || missingQty.length || receiptIssues.length || drawingIssues.length) {
        const parts = [];
        if (missingSupplier.length) parts.push(`${missingSupplier.length} 项未选择供应商`);
        if (missingReason.length) parts.push(`${missingReason.length} 项未填写采购原因`);
        if (missingQty.length) parts.push(`${missingQty.length} 项数量无效`);
        if (receiptIssues.length) parts.push(`${receiptIssues.length} 家门店收货信息或到货时间不完整`);
        if (drawingIssues.length) parts.push(`${drawingIssues.length} 家门店未上传设计图纸`);
        showToast(parts.join("，"), "warn");
        return false;
      }
      return true;
    }

    els.storeTabs.addEventListener("click", event => {
      const btn = event.target.closest("[data-store-tab]");
      if (!btn) return;
      state.currentStoreId = btn.dataset.storeTab;
      state.selectedSpecIds.clear();
      state.collapsedRowIds.clear();
      render();
    });

    els.infoSection.addEventListener("input", event => {
      const store = selectedStore();
      if (!store) return;
      if (event.target.id === "deliveryTimeInput") store.deliveryTime = event.target.value;
      if (event.target.id === "storeRemarkInput") store.remark = event.target.value;
    });
    els.infoSection.addEventListener("click", event => {
      const store = selectedStore();
      if (!store) return;
      const refresh = event.target.closest("[data-refresh-drawing]");
      if (refresh) {
        renderInfoSection();
        showToast("设计图纸已刷新");
        return;
      }
      const preview = event.target.closest("[data-preview-drawing]");
      if (preview) previewDrawing(store, Number(preview.dataset.previewDrawing));
    });
    els.infoSection.addEventListener("change", event => {
      if (event.target.id !== "designDrawingInput") return;
      const file = event.target.files?.[0];
      const store = selectedStore();
      if (!file || !store) return;
      if (!/^(image\/(png|jpeg)|application\/pdf)$/.test(file.type)) return showToast("仅支持 PNG、JPG、PDF 格式图纸", "warn");
      if (file.size > 20 * 1024 * 1024) return showToast("图纸文件不能超过 20MB", "warn");
      const reader = new FileReader();
      reader.onload = () => { store.designDrawings = [...(store.designDrawings || []), { fileName: file.name, drawingType: "设计图纸", source: "本次下单", dataUrl: reader.result, mimeType: file.type }]; renderInfoSection(); showToast("设计图纸已上传，下单后将同步至已开业门店"); };
      reader.readAsDataURL(file);
    });

    els.infoSection.addEventListener("click", event => {
      if (handleReasonControlClick(event)) return;
      if (event.target.closest("#editAddressBtn")) openModal("address");
    });

    els.expandToggle.addEventListener("click", () => {
      state.expanded = !state.expanded;
      state.collapsedRowIds.clear();
      render();
    });

    els.checkAll.addEventListener("change", () => {
      state.selectedSpecIds.clear();
      if (els.checkAll.checked) specRows().forEach(row => state.selectedSpecIds.add(row.id));
      render();
    });

    els.treeBody.addEventListener("change", event => {
      const check = event.target.closest("[data-check-row]");
      if (check) {
        const row = findRow(check.dataset.checkRow);
        if (row) setRowSelected(row, check.checked);
        return;
      }
      const supplier = event.target.closest("[data-supplier-row]");
      if (supplier) {
        if (supplier.hasAttribute("onchange")) return;
        const row = findRow(supplier.dataset.supplierRow);
        if (row) applySupplier(row, supplier.value, false);
        renderFooter();
        return;
      }
      const qty = event.target.closest("[data-qty-row]");
      if (qty) {
        const row = findRow(qty.dataset.qtyRow);
        if (row) applyQty(row, qty.value);
      }
    });

    els.treeBody.addEventListener("click", event => {
      if (handleReasonControlClick(event)) return;
      const toggle = event.target.closest("[data-toggle-row]");
      if (toggle) {
        const rowId = toggle.dataset.toggleRow;
        state.expanded = true;
        if (state.collapsedRowIds.has(rowId)) state.collapsedRowIds.delete(rowId);
        else state.collapsedRowIds.add(rowId);
        render();
        return;
      }
      const del = event.target.closest("[data-delete-row]");
      if (!del || del.disabled) return;
      const row = findRow(del.dataset.deleteRow);
      if (row) removeRow(row);
    });

    document.addEventListener("click", event => {
      if (event.target.closest(".reason-control")) return;
      closeReasonMenus();
    });

    els.treeBody.addEventListener("input", event => {
      const reasonText = event.target.closest("[data-reason-text-row]");
      if (!reasonText) return;
      if (reasonText.hasAttribute("oninput")) return;
      const row = findRow(reasonText.dataset.reasonTextRow);
      if (row) applyReason(row, "other", reasonText.value, false);
    });

    els.batchSupplierBtn.addEventListener("click", () => openModal("supplier"));
    els.batchQtyBtn.addEventListener("click", () => {
      if (state.currentStoreId === ALL_STORES_ID) return showToast("全部门店视图不支持批量修改数量", "warn");
      openModal("qty");
    });
    els.clearSelectionBtn.addEventListener("click", () => {
      state.selectedSpecIds.clear();
      render();
    });
    els.orderRemarkBtn.addEventListener("click", () => openModal("remark"));
    els.draftSaveBtn.addEventListener("click", saveDraft);
    function goBackToPurchase() {
      if (window.parent !== window) {
        window.parent.postMessage({ type: "prototype-route", action: "propPurchase" }, "*");
        return;
      }
      window.parent.postMessage({ type: "prototype-route", action: "propPurchase" }, "*");
    }
    els.backBtn.addEventListener("click", () => {
      openModal("back");
    });
    els.submitBtn.addEventListener("click", () => {
      if (validateBeforeSubmit()) openModal("submit");
    });

    els.modalMask.addEventListener("click", event => {
      if (event.target === els.modalMask || event.target.closest("[data-modal-close]")) {
        closeModal();
        return;
      }
      if (event.target.closest("[data-confirm-supplier]")) {
        const code = document.getElementById("batchSupplierSelect")?.value || "";
        if (!code) return showToast("请选择供应商", "warn");
        selectedSpecs().forEach(row => applySupplier(row, code));
        state.selectedSpecIds.clear();
        closeModal();
        render();
        showToast("修改成功");
      }
      if (event.target.id === "batchReasonSelect") {
        const wrap = document.getElementById("batchReasonTextWrap");
        if (wrap) wrap.style.display = event.target.value === "other" ? "flex" : "none";
      }
      if (event.target.closest("[data-confirm-reason]")) {
        const code = document.getElementById("batchReasonSelect")?.value || "";
        const text = document.getElementById("batchReasonInput")?.value.trim() || "";
        if (!code) return showToast("请选择采购原因", "warn");
        if (code === "other" && !text) return showToast("请输入自定义采购原因", "warn");
        selectedSpecs().forEach(row => applyReason(row, code, text, false));
        state.selectedSpecIds.clear();
        closeModal();
        render();
        showToast("设置成功");
      }
      if (event.target.closest("[data-confirm-qty]")) {
        const qty = document.getElementById("batchQtyInput")?.value || 0;
        selectedSpecs().forEach(row => applyQty(row, qty));
        state.selectedSpecIds.clear();
        closeModal();
        render();
        showToast("修改成功");
      }
      if (event.target.closest("[data-save-address]")) {
        const store = selectedStore();
        const area = (document.getElementById("addrArea")?.value || "").split("/");
        store.receiptInfo.provinceName = area[0] || "";
        store.receiptInfo.cityName = area[1] || "";
        store.receiptInfo.districtName = area[2] || "";
        store.receiptInfo.detail = document.getElementById("addrDetail")?.value || "";
        store.receiptInfo.contact = document.getElementById("addrContact")?.value || "";
        store.receiptInfo.phone = document.getElementById("addrPhone")?.value || "";
        closeModal();
        render();
        showToast("保存成功");
      }
      if (event.target.closest("[data-save-remark]")) {
        state.orderRemark = document.getElementById("orderRemarkInput")?.value || "";
        closeModal();
        showToast("备注保存成功");
      }
      if (event.target.closest("[data-confirm-submit]")) {
        closeModal();
        saveOrderDrawingsToOpenedStore();
        writeDrafts(readDrafts().filter(item => item.id !== state.activeDraftId));
        if (window.parent !== window) {
          window.parent.postMessage({ type: "prototype-route", action: "propOrderSuccess" }, "*");
          return;
        }
        window.parent.postMessage({ type: "prototype-route", action: "propOrderSuccess" }, "*");
      }
      const restoreDraftBtn = event.target.closest("[data-restore-draft]");
      if (restoreDraftBtn) {
        state.activeDraftId = restoreDraftBtn.dataset.restoreDraft;
        restoreDraft(restoreDraftBtn.dataset.restoreDraft);
      }
      const deleteDraftBtn = event.target.closest("[data-delete-draft]");
      if (deleteDraftBtn) {
        deleteDraft(deleteDraftBtn.dataset.deleteDraft);
      }
      if (event.target.closest("[data-confirm-back]")) {
        closeModal();
        goBackToPurchase();
      }
    });

    els.modalMask.addEventListener("change", event => {
      if (event.target.id !== "batchReasonSelect") return;
      const wrap = document.getElementById("batchReasonTextWrap");
      if (wrap) wrap.style.display = event.target.value === "other" ? "flex" : "none";
    });

    const initialDraftId = new URLSearchParams(window.location.search).get("draftId");
    if (initialDraftId) {
      state.activeDraftId = initialDraftId;
      restoreDraft(initialDraftId);
    } else {
      render();
    }
    window.handleSupplierChange = handleSupplierChange;
    window.handleReasonChange = handleReasonChange;
    window.handleReasonTextInput = handleReasonTextInput;
  </script>
</body>
</html>
