<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>仓位采购 - 复原页</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #1f2937;
      background: #f2f4f7;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .position-purchase-page {
      height: 100vh;
      padding: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .selected-stores-bar,
    .left-section,
    .right-section {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04);
    }

    .selected-stores-bar {
      padding: 12px 16px;
      margin-bottom: 12px;
    }

    .mode-tabs-bar {
      margin: -2px 0 10px;
      padding: 0 2px;
      border-bottom: 1px solid #dcdfe6;
    }

    .page-header {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 8px;
    }

    .title {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
    }

    .selected-count-top {
      font-size: 14px;
      color: #99999a;
    }

    .btn {
      border: 1px solid #dcdfe6;
      border-radius: 4px;
      min-height: 32px;
      padding: 6px 14px;
      cursor: pointer;
      background: #fff;
      color: #606266;
      transition: 0.16s ease;
      white-space: nowrap;
    }

    .btn:hover {
      border-color: #527DF7;
      color: #527DF7;
    }

    .btn-primary {
      color: #fff;
      background: #527DF7;
      border-color: #527DF7;
    }

    .btn-primary:hover {
      background: #527DF7;
      border-color: #527DF7;
      color: #fff;
    }

    .btn-primary:disabled {
      cursor: not-allowed;
      background: #527DF7;
      border-color: #527DF7;
      color: #fff;
      opacity: 0.45;
    }

    .btn-link {
      border: 0;
      background: transparent;
      color: #527DF7;
      padding: 0;
      min-height: auto;
    }

    .danger-link {
      color: #f56c6c;
    }

    .required-star {
      color: #f56c6c;
      margin-right: 2px;
      font-weight: 700;
    }

    .btn-small {
      position: relative;
      min-height: 28px;
      padding: 4px 10px;
      font-size: 13px;
    }

    .table-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
    }

    .purchase-badge {
      position: absolute;
      top: -8px;
      right: -8px;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      border-radius: 9px;
      background: #f56c6c;
      color: #fff;
      border: 1px solid #fff;
      font-size: 12px;
      line-height: 18px;
      text-align: center;
      box-shadow: 0 2px 6px rgba(245, 108, 108, 0.35);
    }

    .tags-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      max-height: 66px;
      overflow: auto;
    }

    .tag-item {
      display: flex;
      align-items: center;
      background: #f5f6f7;
      border-radius: 4px;
      padding: 4px 8px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 0 8px;
      border-radius: 4px;
      font-size: 12px;
      border: 1px solid;
    }

    .tag-danger {
      color: #f56c6c;
      background: #fef0f0;
      border-color: #fde2e2;
    }

    .tag-success {
      color: #67c23a;
      background: #f0f9eb;
      border-color: #e1f3d8;
    }

    .tag-info {
      color: #909399;
      background: #f4f4f5;
      border-color: #e9e9eb;
    }

    .tag-primary {
      color: #527DF7;
      background: #eef3ff;
      border-color: #d7e1ff;
    }

    .tag-store-name {
      margin: 0 10px;
      font-size: 14px;
    }

    .main-content {
      flex: 1;
      display: flex;
      gap: 12px;
      min-height: 0;
      overflow: hidden;
    }

    .main-content.non-standard-mode {
      display: block;
    }

    .main-content.non-standard-mode .left-section {
      display: none;
    }

    .main-content.non-standard-mode .right-section {
      height: 100%;
    }

    .left-section {
      width: 320px;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }

    .tabs {
      display: flex;
      gap: 22px;
      padding: 0 12px;
      margin-top: -4px;
      margin-bottom: 8px;
      border-top: 1px solid #f2f3f5;
      border-bottom: 1px solid #edf0f5;
    }

    .mode-tabs {
      display: flex;
      gap: 24px;
    }

    .mode-tab {
      position: relative;
      height: 32px;
      padding: 0 4px;
      border: 0;
      background: transparent;
      color: #606266;
      cursor: pointer;
    }

    .mode-tab.active {
      color: #527DF7;
      font-weight: 600;
    }

    .mode-tab.active::after {
      content: "";
      position: absolute;
      right: 0;
      bottom: -1px;
      left: 0;
      height: 2px;
      background: #527DF7;
      border-radius: 2px 2px 0 0;
    }

    .tab {
      position: relative;
      padding: 14px 0 12px;
      color: #606266;
      cursor: pointer;
      background: none;
      border: 0;
    }

    .tab.active {
      color: #527DF7;
      font-weight: 500;
    }

    .tab.active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -1px;
      height: 2px;
      border-radius: 2px;
      background: #527DF7;
    }

    .filter-toolbar {
      padding: 12px;
    }

    .input-wrap {
      display: flex;
      width: 100%;
      margin-bottom: 12px;
    }

    .input,
    .select {
      width: 100%;
      height: 34px;
      border: 1px solid #dcdfe6;
      border-radius: 4px;
      padding: 0 10px;
      outline: none;
      background: #fff;
      color: #606266;
    }

    .input:focus,
    .select:focus {
      border-color: #527DF7;
    }

    .search-button {
      width: 42px;
      border-radius: 0 4px 4px 0;
      margin-left: -1px;
      padding: 0;
    }

    .input-wrap .input {
      border-radius: 4px 0 0 4px;
    }

    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .filter-row .select {
      flex: 1 1 calc(50% - 4px);
      min-width: calc(50% - 4px);
    }

    .prop-type-filter {
      position: relative;
      margin-top: 10px;
    }

    .type-filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .type-filter-row .prop-type-filter {
      flex: 1 1 calc(50% - 4px);
      max-width: calc(50% - 4px);
      min-width: 0;
      margin-top: 0;
    }

    .type-filter-row .applicable-area-filter {
      flex-basis: 100%;
      max-width: 100%;
    }

    .multi-select-trigger {
      width: 100%;
      min-height: 34px;
      border: 1px solid #dcdfe6;
      border-radius: 4px;
      padding: 0 10px;
      background: #fff;
      color: #606266;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
    }

    .multi-select-trigger.open {
      border-color: #527DF7;
    }

    .multi-select-label {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .multi-select-arrow {
      color: #909399;
      transition: transform 0.2s ease;
    }

    .multi-select-trigger.open .multi-select-arrow {
      transform: rotate(180deg);
    }

    .multi-select-panel {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 4px);
      z-index: 10;
      padding: 8px 10px;
      border: 1px solid #e4e7ed;
      border-radius: 4px;
      background: #fff;
      box-shadow: 0 8px 20px rgba(16, 24, 40, 0.12);
      display: none;
    }

    .multi-select-panel.open {
      display: block;
    }

    .multi-select-option {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 30px;
      color: #606266;
      cursor: pointer;
    }

    .position-list {
      flex: 1;
      min-height: 0;
      margin: 0 12px;
      overflow: auto;
    }

    .position-item {
      display: flex;
      gap: 12px;
      padding: 10px;
      border: 1px solid transparent;
      border-bottom-color: #f5f5f5;
      background: #efefef;
      margin-top: 5px;
      border-radius: 8px;
      cursor: pointer;
    }

    .position-item:hover {
      background: #fafafa;
    }

    .position-item.active {
      background: #eef3ff;
      border-color: #527DF7;
    }

    .pos-image,
    .prop-image {
      flex: 0 0 auto;
      width: 50px;
      height: 50px;
      border-radius: 4px;
      background: linear-gradient(135deg, #eef6ff, #f6f8fb);
      border: 1px solid #edf0f5;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .pos-image svg,
    .prop-image svg {
      width: 34px;
      height: 34px;
    }

    .pos-info {
      flex: 1;
      min-width: 0;
    }

    .pos-name {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-weight: 500;
    }

    .position-item.active .pos-name {
      color: #0b7ff5;
    }

    .pos-location {
      margin-top: 8px;
      font-size: 12px;
      color: #999;
    }

    .pos-meta-tags {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
      min-width: 0;
      max-width: 100%;
      overflow: visible;
    }

    .pos-meta-tag {
      flex: 0 0 auto;
      max-width: 100%;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .pos-area-tag {
      flex: 0 0 auto;
      max-width: 100%;
      cursor: help;
    }

    .pos-area-row {
      flex: 0 0 100%;
      display: flex;
      min-width: 0;
    }

    .area-tooltip-floating {
      position: fixed;
      z-index: 99999;
      max-width: 280px;
      padding: 8px 10px;
      border-radius: 4px;
      background: rgba(28, 35, 48, 0.94);
      color: #fff;
      font-size: 12px;
      line-height: 1.5;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.18);
      pointer-events: none;
      word-break: break-all;
      display: none;
    }

    .left-footer {
      flex: none;
      padding: 0 6px 12px;
      background: #fff;
    }

    .selected-count {
      line-height: 44px;
      text-align: center;
      border-top: 1px solid #eee;
    }

    .selected-count-num {
      color: #0b7ff5;
      font-weight: 600;
    }

    .right-section {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .position-detail {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      padding: 12px;
      position: relative;
    }

    .detail-header {
      flex: none;
      font-size: 16px;
      font-weight: 600;
      padding-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .detail-header-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      min-width: 0;
      margin-left: auto;
    }

    .global-non-standard {
      flex: 1;
      min-height: 0;
      margin-bottom: 72px;
      border: 1px solid #ebeef5;
      border-radius: 6px;
      overflow: hidden;
      background: #fff;
    }

    .custom-list-filter {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 0 1 360px;
      min-width: 260px;
    }

    .custom-list-filter label {
      flex: none;
      color: #606266;
      font-size: 13px;
      font-weight: 600;
    }

    .custom-list-filter .input {
      max-width: 260px;
    }

    .detail-scroll {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding-bottom: 72px;
      padding-right: 2px;
    }

    .prop-group {
      margin-bottom: 12px;
      border: 1px solid #ebeef5;
      border-radius: 4px;
      background: #fff;
      overflow: hidden;
    }

    .group-header {
      padding: 12px 12px 0;
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 12px;
      cursor: pointer;
      font-weight: 500;
    }

    .estimated-price {
      font-weight: 600;
    }

    .price-label {
      color: #999;
    }

    .price-value {
      color: #f56c6c;
    }

    .collapse-icon {
      margin-left: auto;
      color: #999;
      transition: transform 0.2s ease;
    }

    .collapse-icon.expanded {
      transform: rotate(180deg);
    }

    .selection-header {
      padding: 6px 12px;
      background: #fafafa;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .selection-header label,
    .store-checkboxes label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      color: #606266;
      white-space: nowrap;
    }

    .store-purchase-qty {
      width: 58px;
      height: 26px;
      border: 1px solid #dcdfe6;
      border-radius: 4px;
      padding: 0 6px;
      outline: none;
      color: #606266;
    }

    .store-purchase-qty:focus {
      border-color: #527DF7;
    }

    .store-purchase-qty:disabled {
      background: #f5f7fa;
      color: #c0c4cc;
      cursor: not-allowed;
    }

    .toggle-config-btn {
      margin-left: auto;
    }

    .selection-actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .selection-actions .toggle-config-btn {
      margin-left: 0;
    }

    .store-checkboxes {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 16px;
      padding: 12px;
      border-top: 1px solid #eee;
      border-bottom: 1px solid #eee;
      background: #fff;
    }

    .store-checkboxes label.disabled {
      color: #c0c4cc;
      cursor: not-allowed;
    }

    .prop-table-wrap {
      padding: 12px;
      overflow: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 14px;
    }

    th,
    td {
      border-bottom: 1px solid #ebeef5;
      padding: 10px 8px;
      text-align: left;
      vertical-align: middle;
    }

    th {
      color: #909399;
      font-weight: 500;
      background: #f5f7fa;
    }

    td {
      color: #606266;
    }

    .text-ellipsis {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .prop-name-cell {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
      min-width: 0;
    }

    .custom-image-cell {
      width: 48px;
      height: 48px;
      border-radius: 6px;
      border: 1px solid #edf0f5;
      background: linear-gradient(135deg, #eef6ff, #f8fbff);
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .custom-image-cell svg {
      width: 60%;
      height: 60%;
    }

    .non-standard-tag {
      display: inline-flex;
      align-items: center;
      min-height: 20px;
      padding: 0 7px;
      border-radius: 4px;
      color: #e6a23c;
      background: #fdf6ec;
      border: 1px solid #faecd8;
      font-size: 12px;
      line-height: 20px;
    }

    .detail-footer {
      position: absolute;
      right: 12px;
      bottom: 12px;
      left: 12px;
      padding-top: 12px;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      background: #fff;
      border-top: 1px solid #eee;
    }

    .detail-footer .btn {
      width: 100px;
    }

    .empty-detail,
    .empty-data-tip {
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999;
      font-size: 14px;
    }

    .empty-detail {
      flex: 1;
      flex-direction: column;
      padding: 16px;
    }

    .toast {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      min-width: 260px;
      max-width: min(720px, calc(100vw - 32px));
      padding: 10px 14px;
      background: #fdf6ec;
      color: #e6a23c;
      border: 1px solid #faecd8;
      border-radius: 4px;
      box-shadow: 0 6px 18px rgba(16, 24, 40, 0.12);
      display: none;
      z-index: 20;
    }

    .toast.show {
      display: block;
    }

    .modal-mask {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(15, 23, 42, 0.38);
    }

    .modal-mask.open {
      display: flex;
    }

    .purchase-modal {
      width: min(860px, calc(100vw - 48px));
      max-height: calc(100vh - 72px);
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 20px 48px rgba(15, 23, 42, 0.22);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-header {
      flex: none;
      height: 54px;
      padding: 0 18px;
      border-bottom: 1px solid #ebeef5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 600;
    }

    .modal-close {
      border: 0;
      background: transparent;
      color: #909399;
      font-size: 22px;
      cursor: pointer;
      line-height: 1;
    }

    .modal-body {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 16px 18px;
    }

    .modal-prop-summary {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px;
      margin-bottom: 14px;
      border-radius: 6px;
      background: #f8fafc;
      border: 1px solid #edf0f5;
    }

    .modal-prop-name {
      font-size: 16px;
      font-weight: 600;
    }

    .modal-prop-meta {
      margin-top: 6px;
      color: #909399;
      font-size: 13px;
    }

    .non-standard-form {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .form-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
      color: #606266;
    }

    .form-item.full {
      grid-column: 1 / -1;
    }

    .form-item label {
      font-weight: 500;
      color: #303133;
    }

    .form-item input,
    .form-item select {
      width: 100%;
      height: 34px;
      border: 1px solid #dcdfe6;
      border-radius: 4px;
      padding: 0 10px;
      outline: none;
      color: #606266;
      background: #fff;
    }

    .form-item input:focus,
    .form-item select:focus {
      border-color: #527DF7;
    }

    .unit-price-field,
    .quantity-field {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .unit-price-field input,
    .quantity-field input {
      flex: 1;
      min-width: 0;
    }

    .unit-prefix,
    .quantity-suffix {
      color: #606266;
      font-size: 13px;
      white-space: nowrap;
    }

    .unit-price-field select {
      width: 116px;
      flex: 0 0 116px;
    }

    .store-multi-select {
      position: relative;
    }

    .store-multi-select .multi-select-trigger {
      min-height: 34px;
      text-align: left;
    }

    .store-multi-select .multi-select-panel {
      z-index: 30;
      max-height: 180px;
      overflow: auto;
    }

    .store-multi-select .multi-select-option {
      justify-content: flex-start;
      white-space: nowrap;
    }

    .store-multi-select .multi-select-option input {
      flex: none;
      width: 14px;
      height: 14px;
      padding: 0;
      margin: 0;
    }

    .upload-box {
      min-height: 96px;
      border: 1px dashed #c0c4cc;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      cursor: pointer;
      background: #fbfdff;
      transition: 0.16s ease;
    }

    .upload-box:hover {
      border-color: #527DF7;
      background: #eef3ff;
    }

    .upload-preview {
      width: 64px;
      height: 64px;
      border-radius: 4px;
      background: #f5f7fa;
      border: 1px solid #edf0f5;
      display: grid;
      place-items: center;
      color: #909399;
      overflow: hidden;
      flex: 0 0 auto;
    }

    .upload-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .upload-text {
      display: flex;
      flex-direction: column;
      gap: 4px;
      color: #606266;
    }

    .upload-tip {
      color: #909399;
      font-size: 12px;
    }

    .hidden-file-input {
      display: none;
    }

      return `¥${Number(value || 0).toFixed(2)}`;
    }

    function formatUnitPrice(prop) {
      return `${formatMoney(prop?.price || 0)}/每${prop?.unit || "个"}`;
    }

    function formatQtyWithUnit(prop) {
      return `${prop?.qty ?? 1}${prop?.unit || "个"}`;
    }

    function escapeAttr(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function formatApplicableAreaLabel(areas) {
      const list = (areas || []).filter(Boolean);
      if (!list.length) return "-";
      if (list.length === 1) return list[0];
      return `适用${list.length}个区域`;
    }

    function selectedStoresForCurrentImage() {
      return state.currentImage ? stores.filter(store => store.storeForm === state.currentImage) : stores;
    }

    function getWarehouseGroups(code) {
      return specs[code] || [];
    }

    function groupKey(code, type) {
      return `${code}_${type}`;
    }

    function storeGroupQtyKey(groupKeyValue, storeId) {
      return `${groupKeyValue}__${storeId}`;
    }

    function selectedWarehouseCodes() {
      const codes = new Set();
      Object.entries(state.selections).forEach(([key, storeIds]) => {
        if (storeIds && storeIds.length) {
          codes.add(key.split("_")[0]);
        }
      });
      return codes;
    }

    function filteredWarehouses() {
      const selectedCodes = selectedWarehouseCodes();
      return warehouses.filter(warehouse => {
        if (state.currentImage && !warehouse.formCodes.includes(state.currentImage)) return false;
        if (state.keyword && !warehouse.warehouseName.includes(state.keyword)) return false;
        if (state.location && warehouse.location !== state.location) return false;
        if (state.warehouseTypes.length && !state.warehouseTypes.includes(warehouse.warehouseType)) return false;
        if (state.applicableArea && !(warehouse.applicableAreas || []).includes(state.applicableArea)) return false;
        if (state.selectedFilter === "selected" && !selectedCodes.has(warehouse.warehouseCode)) return false;
        if (state.selectedFilter === "unselected" && selectedCodes.has(warehouse.warehouseCode)) return false;
        if (state.propTypes.length) {
          const warehouseTypes = getWarehouseGroups(warehouse.warehouseCode).map(group => group.propTypeDesc);
          if (!state.propTypes.some(type => warehouseTypes.includes(type))) return false;
        }
        return true;
      });
    }

    function ensureCurrentPosition() {
      const list = filteredWarehouses();
      if (!list.some(item => item.warehouseCode === state.currentPositionCode)) {
        state.currentPositionCode = list[0]?.warehouseCode || "";
      }
    }

    function showToast(message) {
      els.toast.textContent = message;
      els.toast.classList.add("show");
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => els.toast.classList.remove("show"), 2600);
    }

    function readDrafts() {
      try {
        return JSON.parse(localStorage.getItem(DRAFT_STORAGE_KEY) || "[]");
      } catch (error) {
        return [];
      }
    }

    function writeDrafts(drafts) {
      localStorage.setItem(DRAFT_STORAGE_KEY, JSON.stringify(drafts));
    }

    function draftSnapshot() {
      return {
        currentImage: state.currentImage,
        purchaseMode: state.purchaseMode,
        currentPositionCode: state.currentPositionCode,
        keyword: state.keyword,
        location: state.location,
        selectedFilter: state.selectedFilter,
        propTypes: state.propTypes,
        warehouseTypes: state.warehouseTypes,
        applicableArea: state.applicableArea,
        nonStandardKeyword: state.nonStandardKeyword,
        storePropConfigs: state.storePropConfigs,
        storeGroupPurchaseQty: state.storeGroupPurchaseQty,
        globalNonStandardProps: state.globalNonStandardProps,
        collapsedStoreConfigs: [...state.collapsedStoreConfigs],
        expandedGroups: [...state.expandedGroups],
        expandedConfig: [...state.expandedConfig],
        selections: state.selections
      };
    }

    function saveDraft() {
      const count = state.purchaseMode === "nonStandard" ? state.globalNonStandardProps.length : purchasedPositionCount();
      const mode = state.purchaseMode === "nonStandard" ? "定制道具" : "标准仓位";
      const drafts = readDrafts();
      drafts.unshift({
        id: `position_${Date.now()}`,
        title: `仓位采购草稿-${mode}-${count}项`,
        stage: "采购入口",
        count,
        updatedAt: new Date().toLocaleString("zh-CN", { hour12: false }),
        snapshot: draftSnapshot()
      });
      writeDrafts(drafts.slice(0, 10));
      showToast("已暂存，可在原始订单列表的暂存记录中继续编辑");
    }

    function restoreDraft(id) {
      const draft = readDrafts().find(item => item.id === id);
      if (!draft) return showToast("草稿不存在");
      const data = draft.snapshot || {};
      Object.assign(state, data);
      state.collapsedStoreConfigs = new Set(data.collapsedStoreConfigs || []);
      state.expandedGroups = new Set(data.expandedGroups || []);
      state.expandedConfig = new Set(data.expandedConfig || []);
      state.activePurchase = null;
      state.activeWarehouseConfig = null;
      state.activeNonStandardAdd = null;
      closePurchaseModal();
      render();
      showToast("已恢复暂存草稿");
    }

    function deleteDraft(id) {
      writeDrafts(readDrafts().filter(item => item.id !== id));
      renderDraftList();
      showToast("草稿已删除");
    }

    function renderDraftList() {
      const drafts = readDrafts();
      els.purchaseModal.classList.add("open");
      els.purchaseModal.innerHTML = `<div class="purchase-modal">
        <div class="modal-header">
          <span>暂存记录</span>
          <button class="modal-close" data-modal-close type="button">×</button>
        </div>
        <div class="modal-body">
          ${drafts.length ? `<table class="config-table">
            <thead><tr><th>草稿名称</th><th style="width:120px;">阶段</th><th style="width:160px;">更新时间</th><th style="width:140px;">操作</th></tr></thead>
            <tbody>${drafts.map(draft => `<tr>
              <td>${escapeHtml(draft.title)}</td>
              <td>${escapeHtml(draft.stage)}</td>
              <td>${escapeHtml(draft.updatedAt)}</td>
              <td><button class="btn btn-link" data-restore-draft="${draft.id}" type="button">继续编辑</button><button class="btn btn-link danger-link" data-delete-draft="${draft.id}" type="button">删除</button></td>
            </tr>`).join("")}</tbody>
          </table>` : `<div class="empty-data-tip">暂无暂存记录</div>`}
        </div>
      </div>`;
    }

    function renderStores() {
      els.selectedStoreCount.textContent = stores.length;
      els.storeTags.innerHTML = stores.map(store => {
        const type = storeTypes[store.storeType] || storeTypes.JM;
        return `<div class="tag-item">
          <span class="tag ${type.className}">${type.label}</span>
          <span class="tag-store-name">${store.storeName}</span>
        </div>`;
      }).join("");
    }

    function renderTabs() {
      els.modeTabs.innerHTML = modeTabs.map(tab => (
        `<button class="mode-tab ${tab.value === state.purchaseMode ? "active" : ""}" data-mode="${tab.value}" type="button">${tab.label}</button>`
      )).join("");
      els.imageTabs.style.display = state.purchaseMode === "standard" ? "" : "none";
      els.imageTabs.innerHTML = imageTabs.map(tab => (
        `<button class="tab ${tab.value === state.currentImage ? "active" : ""}" data-image="${tab.value}">${tab.label}</button>`
      )).join("");
    }

    function renderLocations() {
      const locations = [...new Set(warehouses
        .filter(warehouse => !state.currentImage || warehouse.formCodes.includes(state.currentImage))
        .map(warehouse => warehouse.location))];
      els.locationSelect.innerHTML = `<option value="">全部位置</option>${locations.map(location => (
        `<option value="${location}" ${location === state.location ? "selected" : ""}>${location}</option>`
      )).join("")}`;
    }

    function renderPropTypeFilter() {
      els.propTypeLabel.textContent = state.propTypes.length ? state.propTypes.join("、") : "全部道具类型";
      els.propTypeTrigger.classList.toggle("open", state.propTypePanelOpen);
      els.propTypePanel.classList.toggle("open", state.propTypePanelOpen);
      els.propTypePanel.innerHTML = propTypeFilterOptions.map(type => (
        `<label class="multi-select-option">
          <input type="checkbox" value="${type}" ${state.propTypes.includes(type) ? "checked" : ""}>
          ${type}
        </label>`
      )).join("");
    }

    function renderWarehouseTypeFilter() {
      els.warehouseTypeLabel.textContent = state.warehouseTypes.length ? state.warehouseTypes.join("、") : "全部仓位类型";
      els.warehouseTypeTrigger.classList.toggle("open", state.warehouseTypePanelOpen);
      els.warehouseTypePanel.classList.toggle("open", state.warehouseTypePanelOpen);
      els.warehouseTypePanel.innerHTML = warehouseTypeOptions.map(type => (
        `<label class="multi-select-option">
          <input type="checkbox" value="${type}" ${state.warehouseTypes.includes(type) ? "checked" : ""}>
          ${type}
        </label>`
      )).join("");
    }

    function renderApplicableAreaFilter() {
      els.applicableAreaSelect.innerHTML = `<option value="">全部适用区域</option>${applicableAreaOptions.map(area => (
        `<option value="${area}" ${state.applicableArea === area ? "selected" : ""}>${area}</option>`
      )).join("")}`;
    }

    function renderPositions() {
      if (state.purchaseMode === "nonStandard") {
        const list = state.globalNonStandardProps.filter(prop => !state.keyword || prop.propName.includes(state.keyword));
        if (list.length === 0) {
          els.positionList.innerHTML = `<div class="empty-data-tip">暂无定制道具</div>`;
          return;
        }
        els.positionList.innerHTML = list.map((prop, index) => (
          `<div class="position-item ${index === 0 ? "active" : ""}">
            <div class="pos-image">${propIcon(prop.propType)}</div>
            <div class="pos-info">
              <div class="pos-name">
                <span class="text-ellipsis">${prop.propName}</span>
                <span class="tag tag-info">非标</span>
              </div>
              <div class="pos-location">${prop.propType || "未分类"} / ${formatMoney(prop.price || 0)} x ${prop.qty || 0}</div>
            </div>
          </div>`
        )).join("");
        return;
      }

      const list = filteredWarehouses();
      const selectedCodes = selectedWarehouseCodes();
      if (!list.length) {
        els.positionList.innerHTML = `<div class="empty-data-tip">暂无仓位数据</div>`;
        return;
      }
      els.positionList.innerHTML = list.map(pos => (
        `<div class="position-item ${pos.warehouseCode === state.currentPositionCode ? "active" : ""}" data-code="${pos.warehouseCode}">
          <div class="pos-image">${warehouseIcon(pos.icon)}</div>
          <div class="pos-info">
            <div class="pos-name">
              <span class="text-ellipsis">${pos.warehouseName}</span>
              ${selectedCodes.has(pos.warehouseCode) ? `<span class="tag tag-success">已选</span>` : ""}
            </div>
            <div class="pos-meta-tags" title="位置：${escapeHtml(pos.location || "-")}；类型：${escapeHtml(pos.warehouseType || "未分类")}；适用区域：${escapeHtml((pos.applicableAreas || []).join("、") || "-")}">
              <span class="tag tag-info pos-meta-tag">${escapeHtml(pos.location || "-")}</span>
              <span class="tag tag-primary pos-meta-tag">${escapeHtml(pos.warehouseType || "未分类")}</span>
              <span class="pos-area-row">
                <span class="tag tag-info pos-meta-tag pos-area-tag" data-area-tooltip="${escapeHtml((pos.applicableAreas || []).join("、") || "-")}">${escapeHtml(formatApplicableAreaLabel(pos.applicableAreas))}</span>
              </span>
            </div>
          </div>
        </div>`
      )).join("");
    }

    function groupTotal(group) {
      return (group.specList || []).reduce((sum, prop) => sum + Number(prop.price || 0) * Number(prop.qty || 1), 0);
    }

    function propConfigKey(warehouseCode, propType, propName) {
      return `${warehouseCode}__${propType}__${propName}`;
    }

    function getPropConfig(configKey) {
      return state.storePropConfigs[configKey] || {};
    }

    function getPurchasedPropQty(configKey) {
      const configs = getPropConfig(configKey);
      return Object.values(configs).reduce((sum, config) => sum + Number(config.qty || 0), 0);
    }

    function getAllSuppliers(extraSupplier) {
      return [...new Set(["简造陈列供应商", "山城广告制作", "华南印务", "简造五金", "简造工程配套", extraSupplier].filter(Boolean))];
    }

    function isNonStandardProp(prop) {
      return prop?.isNonStandard === true || (Number(prop?.qty || 0) === 0 && prop?.isNonStandard !== false);
    }

    function isPurchasableZeroQtyProp(prop) {
      return Number(prop?.qty || 0) === 0;
    }

    function ensurePropConfig(warehouseCode, propType, prop) {
      const configKey = propConfigKey(warehouseCode, propType, prop.propName);
      if (!state.storePropConfigs[configKey]) {
        state.storePropConfigs[configKey] = {};
      }
      stores.forEach(store => {
        if (!state.storePropConfigs[configKey][store.id]) {
          state.storePropConfigs[configKey][store.id] = {
            specDesc: prop.specDesc || "",
            qty: prop.qty ?? 1,
            supplierName: prop.supplierName || ""
          };
        }
      });
      return configKey;
    }

    function getWarehouseConfigRows(warehouseCode) {
      return getWarehouseGroups(warehouseCode).flatMap(group => {
        return (group.specList || []).map(prop => ({
          propType: group.propTypeDesc,
          prop,
          configKey: ensurePropConfig(warehouseCode, group.propTypeDesc, prop)
        }));
      });
    }

    function openPurchaseModal(warehouseCode, propType, propName) {
      const group = getWarehouseGroups(warehouseCode).find(item => item.propTypeDesc === propType);
      const prop = group?.specList?.find(item => item.propName === propName);
      if (!group || !prop) return;
      ensurePropConfig(warehouseCode, propType, prop);
      state.activePurchase = { warehouseCode, propType, propName };
      renderPurchaseModal();
    }

    function closePurchaseModal() {
      state.activePurchase = null;
      state.activeWarehouseConfig = null;
      state.activeNonStandardAdd = null;
      renderPurchaseModal();
    }

    function renderPurchaseModal() {
      if (!state.activePurchase && !state.activeWarehouseConfig && !state.activeNonStandardAdd) {
        els.purchaseModal.classList.remove("open");
        els.purchaseModal.innerHTML = "";
        return;
      }

      if (state.activeNonStandardAdd) {
        renderNonStandardAddModal();
        return;
      }

      if (state.activeWarehouseConfig) {
        renderWarehouseConfigModal();
        return;
      }

      const { warehouseCode, propType, propName } = state.activePurchase;
      const group = getWarehouseGroups(warehouseCode).find(item => item.propTypeDesc === propType);
      const prop = group?.specList?.find(item => item.propName === propName);
      const specReadonly = prop && !isNonStandardProp(prop);
      const configKey = propConfigKey(warehouseCode, propType, propName);
      const configs = getPropConfig(configKey);
      const suppliers = getAllSuppliers(prop?.supplierName);

      els.purchaseModal.classList.add("open");
      els.purchaseModal.innerHTML = `<div class="purchase-modal">
        <div class="modal-header">
          <span>采购配置</span>
          <button class="modal-close" data-modal-close type="button">×</button>
        </div>
        <div class="modal-body">
          <div class="modal-prop-summary">
            <div class="prop-image">${propIcon(propType)}</div>
            <div>
              <div class="modal-prop-name">${propName}</div>
              <div class="modal-prop-meta">${propType} / ${formatUnitPrice(prop)}</div>
            </div>
          </div>
          <table class="config-table">
            <thead>
              <tr>
                <th style="width: 24%;">门店</th>
                <th>${specReadonly ? "规格说明" : `<span class="required-star">*</span>规格说明`}</th>
                <th style="width: 150px;">数量</th>
                <th style="width: 190px;">供应商</th>
              </tr>
            </thead>
            <tbody>
              ${stores.filter(store => (state.selections[groupKey(warehouseCode, propType)] || []).includes(store.id)).map(store => {
                const config = configs[store.id] || {};
                return `<tr>
                  <td class="text-ellipsis">${store.storeName}</td>
                  <td>${specReadonly ? `<span class="spec-readonly-text">${escapeHtml(config.specDesc || prop?.specDesc || "-")}</span>` : `<input data-config-field="specDesc" data-store-id="${store.id}" value="${config.specDesc || prop?.specDesc || ""}" />`}</td>
                  <td><div class="config-qty-field"><input data-config-field="qty" data-store-id="${store.id}" type="number" min="0" step="1" value="${config.qty ?? 1}" /><span class="config-qty-unit">${prop?.unit || "个"}</span></div></td>
                  <td>
                    <select data-config-field="supplierName" data-store-id="${store.id}">
                      ${suppliers.map(supplier => `<option value="${supplier}" ${supplier === (config.supplierName || prop?.supplierName) ? "selected" : ""}>${supplier}</option>`).join("")}
                    </select>
                  </td>
                </tr>`;
              }).join("")}
            </tbody>
          </table>
        </div>
        <div class="modal-footer">
          <button class="btn" data-modal-close type="button">取消</button>
          <button class="btn btn-primary" data-modal-save type="button">保存</button>
        </div>
      </div>`;
    }

    function openNonStandardAddModal(index = null) {
      const editingProp = Number.isInteger(index) ? state.globalNonStandardProps[index] : null;
      state.activeNonStandardAdd = {
        index,
        storeIds: editingProp?.storeIds ? [...editingProp.storeIds] : [],
        storePanelOpen: false
      };
      state.activePurchase = null;
      state.activeWarehouseConfig = null;
      renderPurchaseModal();
    }

    function renderNonStandardAddModal() {
      const suppliers = getAllSuppliers();
      const editingProp = Number.isInteger(state.activeNonStandardAdd.index)
        ? state.globalNonStandardProps[state.activeNonStandardAdd.index]
        : null;
      const selectedStoreIds = state.activeNonStandardAdd.storeIds || [];
      const storeLabel = selectedStoreIds.length
        ? stores.filter(store => selectedStoreIds.includes(store.id)).map(store => store.storeName).join("、")
        : "请选择采购门店";
      els.purchaseModal.classList.add("open");
      els.purchaseModal.innerHTML = `<div class="purchase-modal">
        <div class="modal-header">
          <span>${editingProp ? "编辑定制道具" : "采购定制道具"}</span>
          <button class="modal-close" data-modal-close type="button">×</button>
        </div>
        <div class="modal-body">
          <div class="non-standard-form">
            <div class="form-item full">
              <label>采购门店</label>
              <div class="store-multi-select" data-store-multi-select>
                <button class="multi-select-trigger ${state.activeNonStandardAdd.storePanelOpen ? "open" : ""}" data-store-select-trigger type="button">
                  <span class="multi-select-label" data-store-select-label>${storeLabel}</span>
                  <span class="multi-select-arrow">⌄</span>
                </button>
                <div class="multi-select-panel ${state.activeNonStandardAdd.storePanelOpen ? "open" : ""}" data-store-select-panel>
                  ${stores.map(store => `<label class="multi-select-option">
                    <input type="checkbox" data-non-standard-store value="${store.id}" ${selectedStoreIds.includes(store.id) ? "checked" : ""}>
                    ${store.storeName}
                  </label>`).join("")}
                </div>
              </div>
            </div>
            <div class="form-item">
              <label>道具名称</label>
              <input data-non-standard-field="propName" placeholder="请输入道具名称" value="${escapeAttr(editingProp?.propName)}" />
            </div>
            <div class="form-item">
              <label>道具类型</label>
              <select data-non-standard-field="propType">
                ${propTypeOptions.filter(type => type !== "非标").map(type => `<option value="${type}" ${type === editingProp?.propType ? "selected" : ""}>${type}</option>`).join("")}
              </select>
            </div>
            <div class="form-item full">
              <label>规格说明</label>
              <input data-non-standard-field="specDesc" placeholder="请输入规格说明" value="${escapeAttr(editingProp?.specDesc)}" />
            </div>
            <div class="form-item">
              <label>图片</label>
              <div class="upload-box" data-upload-trigger>
                <div class="upload-preview" id="nonStandardImagePreview">${editingProp?.imageName ? propIcon(editingProp.propType) : "+"}</div>
                <div class="upload-text">
                  <span id="nonStandardImageName">${escapeAttr(editingProp?.imageName) || "上传图片"}</span>
                  <span class="upload-tip">支持本地选择，示例页仅展示预览</span>
                </div>
              </div>
              <input class="hidden-file-input" data-non-standard-field="imageName" type="file" accept="image/*" />
            </div>
            <div class="form-item">
              <label>供应商</label>
              <select data-non-standard-field="supplierName">
                ${suppliers.map(supplier => `<option value="${supplier}" ${supplier === editingProp?.supplierName ? "selected" : ""}>${supplier}</option>`).join("")}
              </select>
            </div>
            <div class="form-item">
              <label>每单位价格（元）</label>
              <div class="unit-price-field">
                <input data-non-standard-field="price" type="number" min="0" step="0.01" placeholder="0.00" value="${editingProp?.price ?? ""}" />
                <span class="unit-prefix">/每</span>
                <select data-non-standard-field="unit">
                  <option value="" ${editingProp?.unit ? "" : "selected"}>请选择单位</option>
                  ${["平米", "米", "个", "对"].map(unit => `<option value="${unit}" ${unit === editingProp?.unit ? "selected" : ""}>${unit}</option>`).join("")}
                </select>
              </div>
            </div>
            <div class="form-item">
              <label>数量</label>
              <div class="quantity-field">
                <input data-non-standard-field="qty" type="number" min="0" step="1" value="${editingProp?.qty ?? 1}" />
                <span class="quantity-suffix" data-non-standard-qty-unit>${escapeHtml(editingProp?.unit || "")}</span>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn" data-modal-close type="button">取消</button>
          <button class="btn btn-primary" data-save-non-standard type="button">保存</button>
        </div>
      </div>`;
    }

    function saveNonStandardProp() {
      if (!state.activeNonStandardAdd) return;
      const read = field => els.purchaseModal.querySelector(`[data-non-standard-field="${field}"]`)?.value?.trim() || "";
      const storeIds = state.activeNonStandardAdd.storeIds || [];
      if (storeIds.length === 0) {
        showToast("请选择采购门店");
        return;
      }
      const propName = read("propName");
      if (!propName) {
        showToast("请填写道具名称");
        return;
      }
      const prop = {
        propName,
        propType: read("propType"),
        specDesc: read("specDesc"),
        imageName: els.purchaseModal.querySelector('[data-non-standard-field="imageName"]')?.files?.[0]?.name || (Number.isInteger(state.activeNonStandardAdd.index) ? state.globalNonStandardProps[state.activeNonStandardAdd.index]?.imageName : "") || "",
        price: Number(read("price") || 0),
        unit: read("unit"),
        qty: Number(read("qty") || 1),
        supplierName: read("supplierName"),
        storeIds,
        storeNames: stores.filter(store => storeIds.includes(store.id)).map(store => store.storeName)
      };
      const isEdit = Number.isInteger(state.activeNonStandardAdd.index);
      if (isEdit) {
        state.globalNonStandardProps[state.activeNonStandardAdd.index] = prop;
      } else {
        state.globalNonStandardProps.push(prop);
      }
      closePurchaseModal();
      render();
      showToast(isEdit ? "定制道具已更新" : "定制道具已添加");
    }

    function renderGlobalNonStandardSection() {
      const keyword = state.nonStandardKeyword.trim();
      const customRows = state.globalNonStandardProps
        .map((prop, index) => ({ prop, index }))
        .filter(({ prop }) => !keyword || (prop.propName || "").includes(keyword));
      const listHtml = state.globalNonStandardProps.length === 0
        ? `<div class="empty-data-tip">暂无定制道具</div>`
        : customRows.length === 0
          ? `<div class="empty-data-tip">未找到匹配的定制道具</div>`
          : `<div class="prop-table-wrap">
          <table>
            <thead>
              <tr>
                <th style="width: 180px;">采购门店</th>
                <th>道具名称</th>
                <th style="width: 120px;">道具类型</th>
                <th>规格说明</th>
                <th style="width: 72px;">图片</th>
                <th style="width: 140px;">每单位价格（元）</th>
                <th style="width: 80px;">数量</th>
                <th>供应商</th>
                <th style="width: 100px;">操作</th>
              </tr>
            </thead>
            <tbody>
              ${customRows.map(({ prop, index }) => {
                const storeNames = (prop.storeNames || []).join("、") || "-";
                const propName = prop.propName || "-";
                const propType = prop.propType || "-";
                const specDesc = prop.specDesc || "-";
                const price = formatUnitPrice(prop);
                const qty = `${prop.qty || 0}${prop.unit || "个"}`;
                const supplierName = prop.supplierName || "-";
                return `<tr>
                  <td class="text-ellipsis" title="${escapeHtml(storeNames)}">${escapeHtml(storeNames)}</td>

                  <td title="${escapeHtml(propType)}">${escapeHtml(propType)}</td>
                  <td class="text-ellipsis" title="${escapeHtml(specDesc)}">${escapeHtml(specDesc)}</td>
                  <td><div class="custom-image-cell">${propIcon(prop.propType)}</div></td>
                  <td title="${escapeHtml(price)}">${price}</td>
                  <td title="${escapeHtml(qty)}">${qty}</td>
                  <td class="text-ellipsis" title="${escapeHtml(supplierName)}">${escapeHtml(supplierName)}</td>
                  <td><div class="table-actions"><button class="btn btn-link" data-edit-non-standard="${index}" type="button">编辑</button><button class="btn btn-link danger-link" data-delete-non-standard="${index}" type="button">删除</button></div></td>

            </tbody>

        ${listHtml}

    function nonStandardFilterHtml() {
      return `<div class="custom-list-filter">
        <label for="nonStandardKeywordInput">道具名称</label>
        <input class="input" id="nonStandardKeywordInput" data-non-standard-keyword placeholder="请输入道具名称" value="${escapeHtml(state.nonStandardKeyword)}" />
      </div>`;
    }

    function openWarehouseConfigModal(warehouseCode) {
      getWarehouseConfigRows(warehouseCode);
      state.activeWarehouseConfig = { warehouseCode };
      state.activePurchase = null;
      renderPurchaseModal();
    }

      const position = warehouses.find(item => item.warehouseCode === warehouseCode);
      const rows = getWarehouseConfigRows(warehouseCode);
      const suppliers = getAllSuppliers();

      els.purchaseModal.classList.add("open");
      els.purchaseModal.innerHTML = `<div class="purchase-modal">
        <div class="modal-header">
          <span>${position?.warehouseName || "仓位"} - 道具明细配置</span>
          <button class="modal-close" data-modal-close type="button">×</button>
        </div>
        <div class="modal-body">
          <div class="batch-config">
            <div>批量配置当前仓位下的道具明细</div>
            <input data-batch-qty type="number" min="0" step="1" placeholder="数量" />
            <select data-batch-supplier>
              <option value="">选择供应商</option>
              ${suppliers.map(supplier => `<option value="${supplier}">${supplier}</option>`).join("")}
            </select>
            <button class="btn btn-primary" data-apply-batch type="button">应用</button>
          </div>
          ${stores.map(store => {

            const collapsed = state.collapsedStoreConfigs.has(blockKey);
            return `<section class="store-config-block">
            <div class="store-config-title" data-toggle-store-config="${blockKey}">
              <span class="store-config-name">${store.storeName}</span>
              <span class="store-config-arrow ${collapsed ? "collapsed" : ""}">⌄</span>
            </div>
            ${collapsed ? "" : `<table class="config-table">
              <thead>
                <tr>
                  <th style="width: 22%;">道具名称</th>
                  <th>规格说明</th>
                  <th style="width: 150px;">数量</th>

                  return `<tr>
                    <td><div class="prop-name-cell"><span class="text-ellipsis">${prop.propName}</span>${isNonStandardProp(prop) ? `<span class="non-standard-tag">非标</span>` : ""}</div></td>
                    <td>${isNonStandardProp(prop) ? `<input data-warehouse-config-field="specDesc" data-config-key="${configKey}" data-store-id="${store.id}" value="${config.specDesc || ""}" />` : `<span>${prop.specDesc || "-"}</span>`}</td>
                    <td><div class="config-qty-field"><input data-warehouse-config-field="qty" data-config-key="${configKey}" data-store-id="${store.id}" type="number" min="0" step="1" value="${config.qty ?? (prop.qty ?? 1)}" /><span class="config-qty-unit">${prop.unit || "个"}</span></div></td>
                    <td>
                      <select data-warehouse-config-field="supplierName" data-config-key="${configKey}" data-store-id="${store.id}">
                        ${getAllSuppliers(prop.supplierName).map(supplier => `<option value="${supplier}" ${supplier === (config.supplierName || prop.supplierName) ? "selected" : ""}>${supplier}</option>`).join("")}

            </table>`}

          }).join("")}
        </div>
        <div class="modal-footer">
          <button class="btn" data-modal-close type="button">取消</button>
          <button class="btn btn-primary" data-modal-save type="button">保存</button>
        </div>
      </div>`;
    }

    function renderDetail() {
      if (state.purchaseMode === "nonStandard") {
        els.detailPanel.innerHTML = `<div class="position-detail">
          <div class="detail-header">
            <div class="detail-header-left">
              <span>定制道具</span>
              ${nonStandardFilterHtml()}
            </div>
            <div class="detail-header-actions">
              <button class="btn btn-primary btn-small" data-add-non-standard type="button">采购定制道具</button>
            </div>
          </div>
          ${renderGlobalNonStandardSection()}
          <div class="detail-footer">
            <button class="btn" id="draftSaveBtn" type="button">暂存</button>
            <button class="btn btn-primary" id="nextBtn" ${purchasedPositionCount() === 0 && state.globalNonStandardProps.length === 0 ? "disabled" : ""}>去下单</button>
          </div>
        </div>`;
        return;
      }

      const position = warehouses.find(item => item.warehouseCode === state.currentPositionCode);
      if (!position) {
        els.detailPanel.innerHTML = `<div class="empty-detail">请在左侧选择仓位<div class="detail-footer"><button class="btn btn-primary" disabled>去下单</button></div></div>`;
        return;
      }

      const groups = getWarehouseGroups(position.warehouseCode);
      const applicableStores = selectedStoresForCurrentImage();
      const groupHtml = groups.map(group => {
        const key = groupKey(position.warehouseCode, group.propTypeDesc);
        const selectedIds = state.selections[key] || [];
        const allSelected = stores.length > 0 && stores.every(store => selectedIds.includes(store.id));
        const indeterminate = selectedIds.length > 0 && selectedIds.length < stores.length;
        const expanded = state.expandedGroups.has(key);
        const configExpanded = state.expandedConfig.has(key);

        return `<section class="prop-group">
          <div class="group-header" data-toggle-group="${key}">
            <span>${group.propTypeDesc}</span>
            <span class="estimated-price"><span class="price-label">预估价格：</span><span class="price-value">${formatMoney(groupTotal(group))}</span></span>
            <span class="collapse-icon ${expanded ? "expanded" : ""}">⌄</span>
          </div>
          <div class="store-selection">
            <div class="selection-header">
              <span>采购门店</span>
              <label>
                <input type="checkbox" data-select-all="${key}" ${allSelected ? "checked" : ""} ${indeterminate ? "data-indeterminate='true'" : ""}>
                全选所有门店
              </label>
              <div class="selection-actions">
                <button class="btn btn-link toggle-config-btn" data-toggle-config="${key}" type="button">${configExpanded ? "收起" : "展开"}</button>
              </div>
            </div>
            ${configExpanded ? `<div class="store-checkboxes">
              ${stores.map(store => {
                const checked = selectedIds.includes(store.id);
                const qtyKey = storeGroupQtyKey(key, store.id);
                return `<label>
                  <input type="checkbox" data-store-check="${key}" value="${store.id}" ${checked ? "checked" : ""}>
                  ${store.storeName}
                  ${checked ? `<input class="store-purchase-qty" data-store-purchase-qty="${qtyKey}" type="number" min="0" step="1" value="${state.storeGroupPurchaseQty[qtyKey] ?? 1}" onclick="event.stopPropagation()">` : ""}
                </label>`;
              }).join("")}
            </div>` : ""}
          </div>
          ${expanded ? `<div class="prop-table-wrap">
            <table>
              <thead>
                <tr>
                  <th>道具名称</th>
                  <th>规格说明</th>
                  <th style="width: 72px;">图片</th>
                  <th style="width: 130px;">每单位价格(元)</th>
                  <th style="width: 90px;">标准数量</th>
                  <th>供应商</th>
                  <th style="width: 88px;">操作</th>
                </tr>
              </thead>
              <tbody>
                ${(group.specList || []).map(prop => `<tr>
                  <td><div class="prop-name-cell"><span class="text-ellipsis">${prop.propName}</span>${isNonStandardProp(prop) ? `<span class="non-standard-tag">非标</span>` : ""}</div></td>
                  <td class="text-ellipsis">${prop.specDesc || "-"}</td>
                  <td><div class="prop-image">${propIcon(group.propTypeDesc)}</div></td>
                  <td>${formatUnitPrice(prop)}</td>
                  <td>${formatQtyWithUnit(prop)}</td>
                  <td class="text-ellipsis">${prop.supplierName || "-"}</td>
                  <td>${isPurchasableZeroQtyProp(prop) && selectedIds.length > 0 ? `<button class="btn btn-primary btn-small" data-purchase-prop="${position.warehouseCode}|${group.propTypeDesc}|${prop.propName}" type="button">采购${getPurchasedPropQty(propConfigKey(position.warehouseCode, group.propTypeDesc, prop.propName)) > 0 ? `<span class="purchase-badge">${getPurchasedPropQty(propConfigKey(position.warehouseCode, group.propTypeDesc, prop.propName))}</span>` : ""}</button>` : ""}</td>
                </tr>`).join("")}
              </tbody>
            </table>
          </div>` : ""}
        </section>`;
      }).join("");

      els.detailPanel.innerHTML = `<div class="position-detail">
        <div class="detail-header">
          <span>仓位：${position.warehouseName}</span>
        </div>
        <div class="detail-scroll">${groupHtml || `<div class="empty-data-tip">暂无道具数据</div>`}</div>
        <div class="detail-footer">
          <button class="btn" id="draftSaveBtn" type="button">暂存</button>
          <button class="btn btn-primary" id="nextBtn" ${purchasedPositionCount() === 0 ? "disabled" : ""}>去下单</button>
        </div>
      </div>`;

      document.querySelectorAll("input[data-indeterminate='true']").forEach(input => {
        input.indeterminate = true;
      });
    }

    function purchasedPositionCount() {
      return selectedWarehouseCodes().size;
    }

    function renderCounters() {
      els.purchasedPositionCount.textContent = purchasedPositionCount();
    }

    function render() {
      ensureCurrentPosition();
      renderStores();
      renderTabs();
      renderLocations();
      renderPropTypeFilter();
      renderWarehouseTypeFilter();
      renderApplicableAreaFilter();
      els.mainContent.classList.toggle("non-standard-mode", state.purchaseMode === "nonStandard");
      els.keywordInput.placeholder = state.purchaseMode === "standard" ? "搜索仓位名称" : "搜索定制道具名称";
      els.locationSelect.closest(".filter-row").style.display = state.purchaseMode === "standard" ? "" : "none";
      els.typeFilterRow.style.display = state.purchaseMode === "standard" ? "" : "none";
      renderPositions();
      renderDetail();
      renderCounters();
    }

    els.modeTabs.addEventListener("click", event => {
      const button = event.target.closest("[data-mode]");
      if (!button) return;
      state.purchaseMode = button.dataset.mode;
      render();
    });

    els.imageTabs.addEventListener("click", event => {
      const button = event.target.closest("[data-image]");
      if (!button) return;
      state.currentImage = button.dataset.image;
      state.location = "";
      render();
    });

    els.searchBtn.addEventListener("click", () => {
      state.keyword = els.keywordInput.value.trim();
      render();
    });

    els.keywordInput.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        state.keyword = els.keywordInput.value.trim();
        render();
      }
    });

    els.keywordInput.addEventListener("input", () => {
      if (!els.keywordInput.value) {
        state.keyword = "";
        render();
      }
    });

    els.locationSelect.addEventListener("change", () => {
      state.location = els.locationSelect.value;
      render();
    });

    els.selectedSelect.addEventListener("change", () => {
      state.selectedFilter = els.selectedSelect.value;
      render();
    });

    els.propTypeTrigger.addEventListener("click", event => {
      event.stopPropagation();
      state.propTypePanelOpen = !state.propTypePanelOpen;
      state.warehouseTypePanelOpen = false;
      render();
    });

    els.propTypePanel.addEventListener("change", event => {
      const input = event.target.closest("input[type='checkbox']");
      if (!input) return;
      const selected = new Set(state.propTypes);
      if (input.checked) selected.add(input.value);
      else selected.delete(input.value);
      state.propTypes = [...selected];
      state.propTypePanelOpen = true;
      render();
    });

    els.warehouseTypeTrigger.addEventListener("click", event => {
      event.stopPropagation();
      state.warehouseTypePanelOpen = !state.warehouseTypePanelOpen;
      state.propTypePanelOpen = false;
      render();
    });

    els.warehouseTypePanel.addEventListener("change", event => {
      const input = event.target.closest("input[type='checkbox']");
      if (!input) return;
      const selected = new Set(state.warehouseTypes);
      if (input.checked) selected.add(input.value);
      else selected.delete(input.value);
      state.warehouseTypes = [...selected];
      state.warehouseTypePanelOpen = true;
      render();
    });

    els.applicableAreaSelect.addEventListener("change", () => {
      state.applicableArea = els.applicableAreaSelect.value;
      render();
    });

    document.addEventListener("click", event => {
      if (!els.propTypeFilter.contains(event.target) && state.propTypePanelOpen) {
        state.propTypePanelOpen = false;
        render();
      }
      if (!els.warehouseTypeFilter.contains(event.target) && state.warehouseTypePanelOpen) {
        state.warehouseTypePanelOpen = false;
        render();
      }
    });

    els.positionList.addEventListener("click", event => {
      const item = event.target.closest("[data-code]");
      if (!item) return;
      state.currentPositionCode = item.dataset.code;
      render();
    });

    function areaTooltip() {
      let tooltip = document.getElementById("areaTooltipFloating");
      if (!tooltip) {
        tooltip = document.createElement("div");
        tooltip.id = "areaTooltipFloating";
        tooltip.className = "area-tooltip-floating";
        document.body.appendChild(tooltip);
      }
      return tooltip;
    }

    function moveAreaTooltip(event) {
      const tooltip = areaTooltip();
      const gap = 12;
      let left = event.clientX + gap;
      let top = event.clientY + gap;
      const rect = tooltip.getBoundingClientRect();
      if (left + rect.width > window.innerWidth - gap) {
        left = Math.max(gap, window.innerWidth - rect.width - gap);
      }
      if (top + rect.height > window.innerHeight - gap) {
        top = Math.max(gap, event.clientY - rect.height - gap);
      }
      tooltip.style.left = `${left}px`;
      tooltip.style.top = `${top}px`;
    }

    els.positionList.addEventListener("mouseover", event => {
      const target = event.target.closest(".pos-area-tag[data-area-tooltip]");
      if (!target || !els.positionList.contains(target)) return;
      const tooltip = areaTooltip();
      tooltip.textContent = target.dataset.areaTooltip || "-";
      tooltip.style.display = "block";
      moveAreaTooltip(event);
    });

    els.positionList.addEventListener("mousemove", event => {
      if (document.getElementById("areaTooltipFloating")?.style.display === "block") {
        moveAreaTooltip(event);
      }
    });

    els.positionList.addEventListener("mouseout", event => {
      const target = event.target.closest(".pos-area-tag[data-area-tooltip]");
      if (!target || target.contains(event.relatedTarget)) return;
      areaTooltip().style.display = "none";
    });

    els.detailPanel.addEventListener("click", event => {
      const groupToggle = event.target.closest("[data-toggle-group]");
      if (groupToggle) {
        const key = groupToggle.dataset.toggleGroup;
        if (state.expandedGroups.has(key)) {
          state.expandedGroups.delete(key);
        } else {
          const code = key.split("_")[0];
          [...state.expandedGroups].forEach(item => {
            if (item.startsWith(`${code}_`)) state.expandedGroups.delete(item);
          });
          state.expandedGroups.add(key);
        }
        render();
        return;
      }

      const configToggle = event.target.closest("[data-toggle-config]");
      if (configToggle) {
        const key = configToggle.dataset.toggleConfig;
        if (state.expandedConfig.has(key)) state.expandedConfig.delete(key);
        else state.expandedConfig.add(key);
        render();
        return;
      }

      const purchaseBtn = event.target.closest("[data-purchase-prop]");
      if (purchaseBtn) {
        const [warehouseCode, propType, propName] = purchaseBtn.dataset.purchaseProp.split("|");
        openPurchaseModal(warehouseCode, propType, propName);
        return;
      }

      const addNonStandardBtn = event.target.closest("[data-add-non-standard]");
      if (addNonStandardBtn) {
        openNonStandardAddModal();
        return;
      }

      const editNonStandardBtn = event.target.closest("[data-edit-non-standard]");
      if (editNonStandardBtn) {
        openNonStandardAddModal(Number(editNonStandardBtn.dataset.editNonStandard));
        return;
      }

      const deleteNonStandardBtn = event.target.closest("[data-delete-non-standard]");
      if (deleteNonStandardBtn) {
        state.globalNonStandardProps.splice(Number(deleteNonStandardBtn.dataset.deleteNonStandard), 1);
        render();
        showToast("定制道具已删除");
        return;
      }

      if (event.target.closest("#draftSaveBtn")) {
        saveDraft();
        return;
      }

      if (event.target.id === "nextBtn") {
        const missingStores = stores.filter(store => {
          return !Object.values(state.selections).some(ids => ids.includes(store.id));
        });
        if (missingStores.length) {
          showToast(`以下门店未选择仓位道具：${missingStores.map(s => s.storeName).join("、")}`);
          return;
        }
        window.parent.postMessage({ type: "prototype-route", action: "warehouseCreateOrder" }, "*");
      }
    });

    els.detailPanel.addEventListener("change", event => {
      const allInput = event.target.closest("[data-select-all]");
      if (allInput) {
        const key = allInput.dataset.selectAll;
        state.selections[key] = allInput.checked ? stores.map(store => store.id) : [];
        render();
        return;
      }

      const storeInput = event.target.closest("[data-store-check]");
      if (storeInput) {
        const key = storeInput.dataset.storeCheck;
        const selected = new Set(state.selections[key] || []);
        const qtyKey = storeGroupQtyKey(key, storeInput.value);
        if (storeInput.checked) {
          selected.add(storeInput.value);
          if (state.storeGroupPurchaseQty[qtyKey] == null) {
            state.storeGroupPurchaseQty[qtyKey] = 1;
          }
        } else {
          selected.delete(storeInput.value);
        }
        state.selections[key] = [...selected];
        render();
      }
    });

    els.reselectBtn.addEventListener("click", () => {
      showToast("静态复原页：这里会返回“选择门店”页面");
    });

    els.purchaseModal.addEventListener("click", event => {
      if (event.target === els.purchaseModal || event.target.closest("[data-modal-close]")) {
        closePurchaseModal();
        return;
      }

      if (event.target.closest("[data-store-select-trigger]") && state.activeNonStandardAdd) {
        state.activeNonStandardAdd.storePanelOpen = !state.activeNonStandardAdd.storePanelOpen;
        const panel = els.purchaseModal.querySelector("[data-store-select-panel]");
        const trigger = els.purchaseModal.querySelector("[data-store-select-trigger]");
        panel?.classList.toggle("open", state.activeNonStandardAdd.storePanelOpen);
        trigger?.classList.toggle("open", state.activeNonStandardAdd.storePanelOpen);
        return;
      }

      if (!event.target.closest("[data-store-multi-select]") && state.activeNonStandardAdd?.storePanelOpen) {
        state.activeNonStandardAdd.storePanelOpen = false;
        els.purchaseModal.querySelector("[data-store-select-panel]")?.classList.remove("open");
        els.purchaseModal.querySelector("[data-store-select-trigger]")?.classList.remove("open");
      }

      const storeConfigToggle = event.target.closest("[data-toggle-store-config]");
      if (storeConfigToggle && state.activeWarehouseConfig) {
        const key = storeConfigToggle.dataset.toggleStoreConfig;
        if (state.collapsedStoreConfigs.has(key)) state.collapsedStoreConfigs.delete(key);
        else state.collapsedStoreConfigs.add(key);
        renderWarehouseConfigModal();
        return;
      }

      if (event.target.closest("[data-modal-save]")) {
        closePurchaseModal();
        render();
        showToast("采购配置已保存");
        return;
      }

      const restoreDraftBtn = event.target.closest("[data-restore-draft]");
      if (restoreDraftBtn) {
        restoreDraft(restoreDraftBtn.dataset.restoreDraft);
        return;
      }

      const deleteDraftBtn = event.target.closest("[data-delete-draft]");
      if (deleteDraftBtn) {
        deleteDraft(deleteDraftBtn.dataset.deleteDraft);
        return;
      }

      if (event.target.closest("[data-save-non-standard]")) {
        saveNonStandardProp();
        return;
      }

      const uploadTrigger = event.target.closest("[data-upload-trigger]");
      if (uploadTrigger && state.activeNonStandardAdd) {
        els.purchaseModal.querySelector('[data-non-standard-field="imageName"]')?.click();
      }

      if (event.target.closest("[data-apply-batch]") && state.activeWarehouseConfig) {
        const qtyInput = els.purchaseModal.querySelector("[data-batch-qty]");
        const supplierSelect = els.purchaseModal.querySelector("[data-batch-supplier]");
        const hasQty = qtyInput && qtyInput.value !== "";
        const supplier = supplierSelect?.value || "";
        getWarehouseConfigRows(state.activeWarehouseConfig.warehouseCode).forEach(({ configKey }) => {
          stores.forEach(store => {
            if (!state.storePropConfigs[configKey][store.id]) {
              state.storePropConfigs[configKey][store.id] = {};
            }
            if (hasQty) {
              state.storePropConfigs[configKey][store.id].qty = Number(qtyInput.value || 0);
            }
            if (supplier) {
              state.storePropConfigs[configKey][store.id].supplierName = supplier;
            }
          });
        });
        renderWarehouseConfigModal();
        showToast("已应用批量配置");
      }
    });

    els.purchaseModal.addEventListener("input", event => {
      const field = event.target.closest("[data-config-field]");
      if (!field || !state.activePurchase) return;
      const { warehouseCode, propType, propName } = state.activePurchase;
      const configKey = propConfigKey(warehouseCode, propType, propName);
      const storeId = field.dataset.storeId;
      if (!state.storePropConfigs[configKey]) state.storePropConfigs[configKey] = {};
      if (!state.storePropConfigs[configKey][storeId]) state.storePropConfigs[configKey][storeId] = {};
      state.storePropConfigs[configKey][storeId][field.dataset.configField] = field.dataset.configField === "qty"
        ? Number(field.value || 0)
        : field.value;
    });

    els.detailPanel.addEventListener("input", event => {
      const keywordInput = event.target.closest("[data-non-standard-keyword]");
      if (keywordInput) {
        state.nonStandardKeyword = keywordInput.value;
        renderDetail();
        return;
      }
      const qtyInput = event.target.closest("[data-store-purchase-qty]");
      if (!qtyInput) return;
      state.storeGroupPurchaseQty[qtyInput.dataset.storePurchaseQty] = Number(qtyInput.value || 0);
    });

    els.detailPanel.addEventListener("change", event => {
      const qtyInput = event.target.closest("[data-store-purchase-qty]");
      if (!qtyInput) return;
      state.storeGroupPurchaseQty[qtyInput.dataset.storePurchaseQty] = Number(qtyInput.value || 0);
    });

    els.purchaseModal.addEventListener("change", event => {
      const storeInput = event.target.closest("[data-non-standard-store]");
      if (storeInput && state.activeNonStandardAdd) {
        const selected = new Set(state.activeNonStandardAdd.storeIds || []);
        if (storeInput.checked) selected.add(storeInput.value);
        else selected.delete(storeInput.value);
        state.activeNonStandardAdd.storeIds = [...selected];
        const label = els.purchaseModal.querySelector("[data-store-select-label]");
        if (label) {
          label.textContent = state.activeNonStandardAdd.storeIds.length
            ? stores.filter(store => state.activeNonStandardAdd.storeIds.includes(store.id)).map(store => store.storeName).join("、")
            : "请选择采购门店";
        }
        return;
      }

      const unitSelect = event.target.closest('[data-non-standard-field="unit"]');
      if (unitSelect && state.activeNonStandardAdd) {
        const suffix = els.purchaseModal.querySelector("[data-non-standard-qty-unit]");
        if (suffix) suffix.textContent = unitSelect.value || "";
        return;
      }

      const imageInput = event.target.closest('[data-non-standard-field="imageName"]');
      if (imageInput && state.activeNonStandardAdd) {
        const file = imageInput.files?.[0];
        if (!file) return;
        const nameEl = els.purchaseModal.querySelector("#nonStandardImageName");
        const previewEl = els.purchaseModal.querySelector("#nonStandardImagePreview");
        if (nameEl) nameEl.textContent = file.name;
        if (previewEl) {
          const reader = new FileReader();
          reader.onload = () => {
            previewEl.innerHTML = `<img src="${reader.result}" alt="">`;
          };
          reader.readAsDataURL(file);
        }
        return;
      }

      const field = event.target.closest("[data-config-field]");
      if (!field || !state.activePurchase) return;
      const { warehouseCode, propType, propName } = state.activePurchase;
      const configKey = propConfigKey(warehouseCode, propType, propName);
      const storeId = field.dataset.storeId;
      if (!state.storePropConfigs[configKey]) state.storePropConfigs[configKey] = {};
      if (!state.storePropConfigs[configKey][storeId]) state.storePropConfigs[configKey][storeId] = {};
      state.storePropConfigs[configKey][storeId][field.dataset.configField] = field.dataset.configField === "qty"
        ? Number(field.value || 0)
        : field.value;
    });

    function updateWarehouseConfigField(field) {
      const configKey = field.dataset.configKey;
      const storeId = field.dataset.storeId;
      if (!configKey || !storeId) return;
      if (!state.storePropConfigs[configKey]) state.storePropConfigs[configKey] = {};
      if (!state.storePropConfigs[configKey][storeId]) state.storePropConfigs[configKey][storeId] = {};
      state.storePropConfigs[configKey][storeId][field.dataset.warehouseConfigField] = field.dataset.warehouseConfigField === "qty"
        ? Number(field.value || 0)
        : field.value;
    }

    els.purchaseModal.addEventListener("input", event => {
      const field = event.target.closest("[data-warehouse-config-field]");
      if (!field || !state.activeWarehouseConfig) return;
      updateWarehouseConfigField(field);
    });

    els.purchaseModal.addEventListener("change", event => {
      const field = event.target.closest("[data-warehouse-config-field]");
      if (!field || !state.activeWarehouseConfig) return;
      updateWarehouseConfigField(field);
    });

    const initialDraftId = new URLSearchParams(window.location.search).get("draftId");
    if (initialDraftId) restoreDraft(initialDraftId);
    else render();
  </script>
</body>
</html>
