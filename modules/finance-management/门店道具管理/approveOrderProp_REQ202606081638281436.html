          deliveryTime: "2026-06-19",
          items: [
            { id: "D007", propType: "graphic", propName: "入口活动海报", specCode: "P2011", specDesc: "高清写真覆哑膜，门店标准海报框尺寸", purchaseReason: "换季", price: 46, qty: 4, unit: "张", supplierName: "华南印务", supplierCode: "SUP002" },
            { id: "D008", propType: "visual", propName: "侧招灯片", specCode: "P1017", specDesc: "柔性灯片，适配门头侧招灯箱", purchaseReason: "破损", price: 199, qty: 1, unit: "平米", supplierName: "山城广告制作", supplierCode: "SUP001", isNonStandard: true }
          ]
        }
      ]
    };

    const state = {
      currentStoreId: orderData.stores[0].id,
      currentSupplierCode: "",
      approveResult: "",
      addressDraft: null,
      detailMode: "standard"
    };

    const els = {
      orderNoText: document.getElementById("orderNoText"),
      summaryStrip: document.getElementById("summaryStrip"),
      storeTabs: document.getElementById("storeTabs"),
      deliveryInfo: document.getElementById("deliveryInfo"),
      detailTitle: document.getElementById("detailTitle"),
      detailExtra: document.getElementById("detailExtra"),
      detailTabs: document.getElementById("detailTabs"),
      detailHead: document.getElementById("detailHead"),
      detailBody: document.getElementById("detailBody"),
      supplierTabs: document.getElementById("supplierTabs"),
      supplierBody: document.getElementById("supplierBody"),
      purchaseSummary: document.getElementById("purchaseSummary"),
      submitBtn: document.getElementById("submitBtn"),
      approveRemark: document.getElementById("approveRemark"),
      addressModal: document.getElementById("addressModal"),
      toast: document.getElementById("toast")
    };

    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }

    function money(value) { return `¥${Number(value || 0).toFixed(2)}`; }
    function unitPrice(item) { return `${money(item.price || 0)}/每${item.unit || "个"}`; }
    function qtyText(item) { return `${item.qty || 0}${item.unit || "个"}`; }
    function amount(item) { return Number(item.price || 0) * Number(item.qty || 0); }
    function allItems() { return orderData.stores.flatMap(store => store.items.map(item => ({ ...item, store }))); }
    function currentStore() { return orderData.stores.find(store => store.id === state.currentStoreId) || orderData.stores[0]; }
    function currentItems() { return currentStore().items || []; }

    function propIcon(type) {
      const color = { visual: "#f56c6c", graphic: "#e6a23c", display: "#67c23a", engineering: "#909399" }[type] || "#527DF7";
      return `<svg viewBox="0 0 48 48" aria-hidden="true"><rect x="10" y="10" width="28" height="28" rx="5" fill="#fff" stroke="${color}" stroke-width="2"/><path d="M17 19h14M17 25h14M17 31h9" stroke="${color}" stroke-width="2" stroke-linecap="round"/></svg>`;
    }

    function itemBadge(item) {
      if (item.propKind === "custom") return `<span class="kind-badge custom">定制</span>`;
      if (item.isNonStandard) return `<span class="kind-badge">非标</span>`;
      return "";
    }

    function suppliers() {
      const map = new Map();
      allItems().forEach(item => {
        const code = item.supplierCode || item.supplierName;
        if (!map.has(code)) {
          map.set(code, { code, name: item.supplierName || "-", count: 0, total: 0, items: [] });
        }
        const supplier = map.get(code);
        supplier.count += Number(item.qty || 0);
        supplier.total += amount(item);
        supplier.items.push(item);
      });
      return [...map.values()];
    }

    function currentSupplier() {
      const list = suppliers();
      if (!state.currentSupplierCode && list[0]) state.currentSupplierCode = list[0].code;
      return list.find(item => item.code === state.currentSupplierCode) || list[0] || { items: [], count: 0, total: 0 };
    }

    function totalQty() { return allItems().reduce((sum, item) => sum + Number(item.qty || 0), 0); }
    function totalAmount() { return allItems().reduce((sum, item) => sum + amount(item), 0); }
    function customCount() { return allItems().filter(item => item.propKind === "custom").length; }
    function nonStandardCount() { return allItems().filter(item => item.isNonStandard).length; }

    function renderSummary() {
      els.orderNoText.textContent = orderData.orderNo;
      const metrics = [
        ["订单类型", "按道具采购"],
        ["收货门店", `${orderData.stores.length} 个门店`],
        ["采购总数量", `${totalQty()}`],
        ["预估总金额", money(totalAmount()), "price"]
      ];
      els.summaryStrip.innerHTML = metrics.map(([label, value, cls]) => `
        <div class="metric">
          <div class="metric-label">${label}</div>
          <div class="metric-value ${cls || ""}">${escapeHtml(value)}</div>
        </div>
      `).join("");
    }

    function renderStoreTabs() {
      els.storeTabs.innerHTML = orderData.stores.map(store => `
        <button class="tab-btn ${store.id === state.currentStoreId ? "active" : ""}" data-store-id="${store.id}" type="button">
          ${escapeHtml(store.name)}
        </button>
      `).join("");
    }

    function renderDelivery() {
      const store = currentStore();
      const address = [store.provinceName, store.cityName, store.districtName, store.detail].filter(Boolean).join("");
      const fields = [
        ["收货门店", store.name],
        ["装修形象", store.decorationImage],
        ["收货地址", address || "-"],
        ["收货人", `${store.contact || "-"} ${store.phone || ""}`],
        ["要求到货时间", store.deliveryTime || "-"],
        ["采购原因", orderData.purchaseReason || "-"],
        ["备注", orderData.remark || "-", "full"]
      ];
      els.deliveryInfo.innerHTML = fields.map(([label, value, cls]) => `
        <div class="info-item ${cls || ""}">
          <div class="info-label">${label}</div>
          <div class="info-value">${escapeHtml(value)}</div>
        </div>
      `).join("");
    }

    function renderDetail() {
      const rows = currentItems().filter(row => state.detailMode === "custom" ? row.propKind === "custom" : row.propKind !== "custom");
      const modeLabel = state.detailMode === "custom" ? "定制道具" : "标准道具";
      els.detailTabs.querySelectorAll("[data-detail-mode]").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.detailMode === state.detailMode);
      });
      els.detailTitle.textContent = `${modeLabel}（共计${rows.length}个道具）`;
      els.detailExtra.textContent = `当前门店：${currentStore().name}`;
      els.detailHead.innerHTML = `<tr>
        <th style="width: 32%;">道具信息</th>
        <th style="width: 120px;">采购原因</th>
        <th>规格说明</th>
        <th style="width: 140px; text-align: right;">每单位价格（元）</th>
        <th style="width: 80px; text-align: center;">数量</th>
        <th style="width: 160px;">供应商</th>
      </tr>`;
      els.detailBody.innerHTML = rows.length ? rows.map(row => `
        <tr>
          <td>
            <div class="position-info">
              <div class="position-image">${propIcon(row.propType)}${itemBadge(row)}</div>
              <div class="position-content">
                <div class="position-title" title="${escapeHtml(row.propName)}">${escapeHtml(row.propName)}</div>
                ${row.propKind === "custom" ? "" : `<div class="position-desc">${escapeHtml(row.specCode || "-")}</div>`}
              </div>
            </div>
          </td>
          <td title="${escapeHtml(row.purchaseReason || "-")}">${escapeHtml(row.purchaseReason || "-")}</td>
          <td title="${escapeHtml(row.specDesc || "-")}">${escapeHtml(row.specDesc || "-")}</td>
          <td class="money" style="text-align:right;">${unitPrice(row)}</td>
          <td style="text-align:center;">${qtyText(row)}</td>
          <td title="${escapeHtml(row.supplierName || "-")}">${escapeHtml(row.supplierName || "-")}</td>
        </tr>
      `).join("") : `<tr><td colspan="6" class="muted" style="text-align:center; padding:32px;">暂无${modeLabel}</td></tr>`;
    }

    function renderSupplierTabs() {
      const list = suppliers();
      if (!state.currentSupplierCode && list[0]) state.currentSupplierCode = list[0].code;
      els.supplierTabs.innerHTML = list.map(item => `
        <button class="tab-btn ${item.code === state.currentSupplierCode ? "active" : ""}" data-supplier-code="${escapeHtml(item.code)}" type="button">
          ${escapeHtml(item.name)}
        </button>
      `).join("");
    }

    function renderSupplierTable() {
      const supplier = currentSupplier();
      els.supplierBody.innerHTML = supplier.items.map(row => `
        <tr>
          <td>
            <div class="position-info">
              <div class="position-image">${propIcon(row.propType)}${itemBadge(row)}</div>
              <div class="position-content">
                <div class="position-title" title="${escapeHtml(row.propName)}">${escapeHtml(row.propName)}</div>
                ${row.propKind === "custom" ? "" : `<div class="position-desc">${escapeHtml(row.specCode || "-")}</div>`}
              </div>
            </div>
          </td>
          <td title="${escapeHtml(row.specDesc || "-")}">${escapeHtml(row.specDesc || "-")}</td>
          <td class="money" style="text-align:right;">${unitPrice(row)}</td>
          <td style="text-align:center;">${qtyText(row)}</td>
          <td class="money" style="text-align:right;">${money(amount(row))}</td>
        </tr>
      `).join("");
      els.purchaseSummary.innerHTML = `
        <span>总数量：<strong class="summary-value">${supplier.count}</strong></span>
        <span>预估价格：<strong class="summary-value price">${money(supplier.total)}</strong></span>
      `;
    }

    function renderApproveState() {
      const remark = els.approveRemark.value.trim();
      els.submitBtn.disabled = !state.approveResult || !remark;
    }

    function render() {
      renderSummary();
      renderStoreTabs();
      renderDelivery();
      renderDetail();
      renderSupplierTabs();
      renderSupplierTable();
      renderApproveState();
    }

    function showToast(message, type = "success") {
      els.toast.textContent = message;
      els.toast.className = `toast show ${type === "warn" ? "warn" : ""}`;
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => els.toast.className = "toast", 2200);
    }

    function openAddressModal() {
      const store = currentStore();
      els.addressModal.classList.add("open");
      els.addressModal.innerHTML = `
        <div class="modal">
          <div class="modal-header">
            <span>修改收货地址</span>
            <button class="modal-close" data-modal-close type="button">×</button>
          </div>
          <div class="modal-body">
            <div class="form-row">
              <div class="form-label required">所属区域</div>
              <input id="modalArea" value="${escapeHtml([store.provinceName, store.cityName, store.districtName].filter(Boolean).join('/'))}">
            </div>
            <div class="form-row">
              <div class="form-label required">详细地址</div>
              <textarea id="modalDetail" maxlength="500">${escapeHtml(store.detail || "")}</textarea>
            </div>
            <div class="form-row">
              <div class="form-label required">收货人名字</div>
              <input id="modalContact" value="${escapeHtml(store.contact || "")}">
            </div>
            <div class="form-row">
              <div class="form-label required">手机号</div>
              <input id="modalPhone" value="${escapeHtml(store.phone || "")}">
            </div>
          </div>
          <div class="modal-footer">
            <button class="btn" data-modal-close type="button">取消</button>
            <button class="btn btn-primary" data-save-address type="button">保存</button>
          </div>
        </div>
      `;
    }

    function closeAddressModal() {
      els.addressModal.classList.remove("open");
      els.addressModal.innerHTML = "";
    }

    function saveAddress() {
      const area = document.getElementById("modalArea").value.trim();
      const detail = document.getElementById("modalDetail").value.trim();
      const contact = document.getElementById("modalContact").value.trim();
      const phone = document.getElementById("modalPhone").value.trim();
      if (!area || !detail || !contact || !phone) {
        showToast("请完整填写收货信息", "warn");
        return;
      }
      if (!/^1[3-9]\d{9}$/.test(phone)) {
        showToast("请输入有效手机号", "warn");
        return;
      }
      const store = currentStore();
      const [provinceName = "", cityName = "", districtName = ""] = area.split("/");
      Object.assign(store, { provinceName, cityName, districtName, detail, contact, phone });
      closeAddressModal();
      renderDelivery();
      showToast("保存成功");
    }

    els.storeTabs.addEventListener("click", event => {
      const btn = event.target.closest("[data-store-id]");
      if (!btn) return;
      state.currentStoreId = btn.dataset.storeId;
      renderStoreTabs();
      renderDelivery();
      renderDetail();
    });

    els.detailTabs.addEventListener("click", event => {
      const btn = event.target.closest("[data-detail-mode]");
      if (!btn) return;
      state.detailMode = btn.dataset.detailMode;
      renderDetail();
    });

    els.supplierTabs.addEventListener("click", event => {
      const btn = event.target.closest("[data-supplier-code]");
      if (!btn) return;
      state.currentSupplierCode = btn.dataset.supplierCode;
      renderSupplierTabs();
      renderSupplierTable();
    });

    document.querySelectorAll("input[name='approveResult']").forEach(input => {
      input.addEventListener("change", event => {
        state.approveResult = event.target.value;
        renderApproveState();
      });
    });

    els.approveRemark.addEventListener("input", renderApproveState);
    document.getElementById("editAddressBtn")?.addEventListener("click", openAddressModal);
    function backToOrderList() {
      if (window.parent !== window) {
        window.parent.postMessage({ type: "prototype-route", action: "originalStoreOrders" }, "*");
        return;
      }
      window.parent.postMessage({ type: "prototype-route", action: "originalStoreOrders" }, "*");
    }
    document.getElementById("backBtn").addEventListener("click", backToOrderList);
    els.submitBtn.addEventListener("click", () => {
      if (!state.approveResult) return showToast("请选择审批结果", "warn");
      if (!els.approveRemark.value.trim()) return showToast("请输入审批备注", "warn");
      backToOrderList();
    });
    els.addressModal.addEventListener("click", event => {
      if (event.target === els.addressModal || event.target.closest("[data-modal-close]")) closeAddressModal();
      if (event.target.closest("[data-save-address]")) saveAddress();
    });

    render();
  </script>
</body>
</html>
