<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>门店原始订单详情 - 按仓位采购</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #303133;
      background: #f2f4f7;
    }
    button, input, textarea { font: inherit; }
    .confirm-order-page {
      height: 100vh;
      min-height: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }
    .status-stamp {
      position: absolute;
      top: 32px;
      right: 24px;
      z-index: 10;
      width: 82px;
      height: 82px;
      border: 4px solid #527DF7;
      border-radius: 50%;
      color: #527DF7;
      display: grid;
      place-items: center;
      font-size: 18px;
      font-weight: 700;
      transform: rotate(-14deg);
      background: rgba(230, 247, 255, 0.75);
    }
    .store-tabs {
      flex: none;
      max-height: 80px;
      overflow: auto;
      margin-bottom: 6px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding-right: 100px;
    }
    .store-tab {
      min-height: 32px;
      padding: 6px 14px;
      border-radius: 4px;
      border: 1px solid #d9d9d9;
      background: #fff;
      color: #606266;
      cursor: pointer;
    }
    .store-tab.active {
      background: #527DF7;
      border-color: #527DF7;
      color: #fff;
    }
    .confirm-order-main {
      flex: 1;
      min-height: 0;
      overflow: auto;
      display: flex;
      flex-direction: column;
    }
    .info-section {
      flex: none;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }
    .info-card, .items-section, .purchase-orders-section, .page-footer {
      background: #fff;
      border: 1px solid #e8e8e8;
      border-radius: 4px;
    }
    .info-card { padding: 12px; min-width: 0; }
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .section-title {
      font-size: 14px;
      font-weight: 600;
      color: #303133;
      line-height: 22px;
    }
    .edit-link {
      border: 0;
      background: transparent;
      color: #527DF7;
      cursor: pointer;
      padding: 0;
      font-size: 13px;
    }
    .info-fields { display: flex; flex-direction: column; gap: 4px; }
    .info-field {
      display: flex;
      align-items: flex-start;
      line-height: 22px;
      font-size: 13px;
    }
    .label {
      flex: 0 0 90px;
      color: #909399;
    }
    .value {
      flex: 1;
      min-width: 0;
      color: #303133;
      word-break: break-all;
    }
    .purchase-orders-section {
      flex: none;
      margin-bottom: 12px;
      padding: 16px;
    }
    .items-section {
      flex: 1 0 auto;
      min-height: 300px;
      display: flex;
      flex-direction: column;
      padding: 12px;
    }
    .detail-header {
      flex: none;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 10px;
    }
    .detail-tabs {
      flex: none;
      display: inline-flex;
      align-items: center;
      border-bottom: 1px solid #e4e7ed;
    }
    .detail-tab {
      position: relative;
      height: 32px;
      padding: 0 18px;
      border: 0;
      background: transparent;
      color: #606266;
      cursor: pointer;
      font-size: 14px;
    }
    .detail-tab.active {
      color: #527DF7;
      font-weight: 600;
    }
    .detail-tab.active::after {
      content: "";
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: -1px;
      height: 2px;
      background: #527DF7;
      border-radius: 2px;
    }
    .items-table-body {
      flex: 1;
      min-height: 230px;
      max-height: min(480px, calc(100vh - 460px));
      overflow: auto;
      border: 1px solid #ebeef5;
      border-radius: 4px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 13px;
    }
    th {
      position: sticky;
      top: 0;
      z-index: 2;
      background: #f5f7fa;
      color: #909399;
      font-weight: 600;
      text-align: left;
      padding: 10px 8px;
      border-bottom: 1px solid #ebeef5;
    }
    td {
      padding: 8px;
      border-bottom: 1px solid #ebeef5;
      background: #fff;
      vertical-align: middle;
    }
    tr:hover td { background: #fafcff; }
    .expand-btn {
      width: 26px;
      height: 26px;
      border: 1px solid #dcdfe6;
      border-radius: 4px;
      background: #fff;
      color: #606266;
      cursor: pointer;
    }
    .position-info {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .position-image {
      width: 52px;
      height: 52px;
      flex: 0 0 auto;
      border: 1px solid #edf0f5;
      border-radius: 6px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #eef3ff, #f8fbff);
      position: relative;
      overflow: hidden;
    }
    .position-image svg { width: 30px; height: 30px; }
    .position-wfy {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 2px 0;
      background: rgba(72, 156, 97, 0.72);
      color: #fff;
      font-size: 10px;
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .position-content { min-width: 0; flex: 1; }
    .position-title {
      font-size: 13px;
      font-weight: 500;
      line-height: 18px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .position-desc {
      margin-top: 2px;
      color: #909399;
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .spec-row td {
      background: #fafafa;
      border-bottom-style: dashed;
      padding-top: 6px;
      padding-bottom: 6px;
    }
    .spec-row.hidden { display: none; }
    .spec-indent { padding-left: 84px; }
    .spec-image {
      width: 38px;
      height: 38px;
      flex-basis: 38px;
    }
    .spec-image svg { width: 24px; height: 24px; }
    .prop-kind-badge {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 2px 0;
      background: rgba(245, 108, 108, 0.9);
      color: #fff;
      font-size: 10px;
      line-height: 1;
      text-align: center;
      white-space: nowrap;
    }
    .prop-kind-badge.custom {
      background: rgba(24, 144, 255, 0.9);
    }
    .money, .total-amount {
      color: #ff4d4f;
      font-weight: 600;
    }
    .status-tag {
      display: inline-flex;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 12px;
      background: #eef3ff;
      color: #527DF7;
    }
    .total-section {
      flex: none;
      margin-top: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px 10px;
      justify-content: flex-end;
      align-items: center;
    }
    .total-label, .total-amount {
      font-size: 24px;
      font-weight: 600;
    }
    .total-label { color: #666; }
    .amount-breakdown {
      flex: 0 0 100%;
      display: flex;
      justify-content: flex-end;
      gap: 16px;
      color: #909399;
      font-size: 12px;
      line-height: 18px;
    }
    .amount-breakdown strong {
      color: #606266;
      font-size: 13px;
      font-weight: 600;
    }
    .page-footer {
      flex: none;
      margin-top: 12px;
      padding: 12px;
      display: flex;
      justify-content: center;
      gap: 10px;
    }
    .btn {
      min-width: 100px;
      min-height: 34px;
      padding: 6px 14px;
      border: 1px solid #dcdfe6;
      border-radius: 4px;
      background: #fff;
      color: #606266;
      cursor: pointer;
    }
    .btn-primary {
      background: #527DF7;
      border-color: #527DF7;
      color: #fff;
    }
    .btn-danger { color: #f56c6c; }
    .modal-mask {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, 0.42);
      padding: 24px;
    }
    .modal-mask.open { display: flex; }
    .modal {
      width: min(500px, calc(100vw - 48px));
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 18px 48px rgba(15, 23, 42, 0.22);
    }
    .modal-header, .modal-footer {
      padding: 12px 20px;
      background: #f8fafc;
      border-bottom: 1px solid #ebeef5;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
    }
    .modal-footer {
      border-top: 1px solid #ebeef5;
      border-bottom: 0;
      justify-content: flex-end;
      gap: 10px;
    }
    .modal-body { padding: 18px 20px; display: grid; gap: 12px; }
    .modal-close { border: 0; background: transparent; font-size: 22px; color: #909399; cursor: pointer; }
    .form-item { display: grid; gap: 6px; }
    .input, .textarea {
      width: 100%;
      border: 1px solid #dcdfe6;
      border-radius: 4px;
      padding: 8px 10px;
      outline: none;
    }
    .textarea { min-height: 76px; resize: none; }
    .toast {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      display: none;
      z-index: 80;
      min-width: 220px;
      padding: 10px 16px;
      border-radius: 6px;
      border: 1px solid #b3e19d;
      background: #f0f9eb;
      color: #67c23a;
      text-align: center;
      box-shadow: 0 8px 22px rgba(15, 23, 42, 0.12);
    }
    .toast.show { display: block; }

    :root {
      --surface: rgba(255, 255, 255, 0.96);
      --line-soft: #e8edf5;
      --line-strong: #d8e2ee;
      --text-strong: #172033;
      --text-main: #334155;
      --text-muted: #7b8798;
      --primary: #527DF7;
      --primary-soft: #eef3ff;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 12px 30px rgba(15, 23, 42, 0.08);
      --shadow-lg: 0 24px 70px rgba(15, 23, 42, 0.18);
    }

    body {
      color: var(--text-main);
      background: linear-gradient(180deg, #f7f9fc 0%, #eef2f7 100%);
    }

    .confirm-order-page {
      padding: 18px;
    }

    .store-tabs {
      max-height: 86px;
      margin-bottom: 12px;
      padding: 12px 112px 12px 14px;
      border: 1px solid rgba(216, 226, 238, 0.9);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow-sm);
      backdrop-filter: blur(10px);
    }

    .store-tab {
      border-color: var(--line-strong);
      border-radius: 6px;
      color: #465466;
      background: linear-gradient(180deg, #fff, #f8fafc);
      box-shadow: 0 1px 1px rgba(15, 23, 42, 0.03);
      transition: border-color 0.16s ease, color 0.16s ease, box-shadow 0.16s ease, transform 0.16s ease, background 0.16s ease;
    }

    .store-tab:hover {
      border-color: var(--primary);
      color: var(--primary);
      box-shadow: 0 6px 16px rgba(82, 125, 247, 0.12);
      transform: translateY(-1px);
    }

    .store-tab.active {
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
      box-shadow: 0 8px 18px rgba(82, 125, 247, 0.22);
    }

    .status-stamp {
      top: 32px;
      right: 30px;
      border-color: var(--primary);
      color: var(--primary);
      background: rgba(238, 243, 255, 0.78);
      box-shadow: 0 10px 24px rgba(82, 125, 247, 0.14);
    }

    .info-card,
    .items-section,
    .purchase-orders-section,
    .page-footer,
    .modal {
      border-color: rgba(216, 226, 238, 0.9);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow-sm);
    }

    .section-header,
    .detail-header,
    .modal-header,
    .modal-footer {
      border-color: var(--line-soft);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(248, 250, 252, 0.92));
    }

    .section-title {
      color: var(--primary);
      font-weight: 700;
    }

    .label,
    .position-desc,
    .amount-breakdown,
    th {
      color: var(--text-muted);
    }

    .value,
    .position-title,
    td {
      color: var(--text-main);
    }

    .detail-tabs {
      gap: 28px;
      border-color: var(--line-soft);
    }

    .detail-tab {
      color: var(--text-muted);
    }

    .detail-tab.active,
    .detail-tab:hover {
      color: var(--primary);
    }

    .detail-tab.active::after {
      background: var(--primary);
    }

    .items-table-body {
      border-color: var(--line-soft);
      border-radius: 8px;
      background: #fff;
    }

    th {
      background: #f8fafc;
      border-bottom-color: var(--line-soft);
    }

    td {
      border-bottom-color: var(--line-soft);
    }

    tr:hover td {
      background: #f8fbff;
    }

    .warehouse-row td {
      background: #fbfdff;
      cursor: pointer;
    }

    .warehouse-row:hover td {
      background: var(--primary-soft);
    }

    .expand-btn {
      border-color: var(--line-strong);
      border-radius: 6px;
      background: #fff;
      transition: border-color 0.16s ease, color 0.16s ease, box-shadow 0.16s ease, transform 0.16s ease;
    }

    .warehouse-row:hover .expand-btn,
    .expand-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
      box-shadow: 0 6px 16px rgba(82, 125, 247, 0.12);
      transform: translateY(-1px);
    }

    .position-image {
      border-color: var(--line-soft);
      background: linear-gradient(135deg, #f8fafc, var(--primary-soft));
    }

    .position-wfy,
    .prop-kind-badge.custom,
    .status-tag {
      background: var(--primary-soft);
      color: var(--primary);
    }

    .position-wfy {
      color: #fff;
      background: rgba(82, 125, 247, 0.82);
    }

    .money,
    .total-amount {
      color: var(--primary);
    }

    .total-section {
      margin-top: 12px;
    }

    .total-label {
      color: var(--text-strong);
    }

    .amount-breakdown strong {
      color: var(--text-main);
    }

    .page-footer {
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 -8px 24px rgba(15, 23, 42, 0.04);
    }

    .btn {
      border-color: var(--line-strong);
      border-radius: 6px;
      color: #465466;
      background: linear-gradient(180deg, #fff, #f8fafc);
      box-shadow: 0 1px 1px rgba(15, 23, 42, 0.03);
      transition: border-color 0.16s ease, color 0.16s ease, box-shadow 0.16s ease, transform 0.16s ease, background 0.16s ease;
    }

    .btn:hover {
      border-color: var(--primary);
      color: var(--primary);
      box-shadow: 0 6px 16px rgba(82, 125, 247, 0.12);
      transform: translateY(-1px);
    }

    .btn-primary,
    .btn-primary:hover {
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
      box-shadow: 0 8px 18px rgba(82, 125, 247, 0.22);
    }

    .btn-danger:hover {
      border-color: #f56c6c;
      color: #f56c6c;
      box-shadow: 0 6px 16px rgba(245, 108, 108, 0.12);
    }

    .input,
    .textarea {
      border-color: var(--line-strong);
      border-radius: 6px;
      color: var(--text-main);
      transition: border-color 0.16s ease, box-shadow 0.16s ease;
    }

    .input:focus,
    .textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(82, 125, 247, 0.12);
    }

    .modal-mask {
      background: rgba(15, 23, 42, 0.46);
      backdrop-filter: blur(6px);
    }

    .modal {
      box-shadow: var(--shadow-lg);
    }

    .toast {
      border-radius: 8px;
      box-shadow: var(--shadow-md);
    }
    @media (max-width: 900px) {
      .confirm-order-page { height: auto; min-height: 100vh; overflow: visible; }
      .info-section { grid-template-columns: 1fr; }
      .confirm-order-main { overflow: visible; }
      .items-table-body { max-height: none; }
      .store-tabs { padding-right: 14px; }
    }
  </style>
</head>

              specs: [
                { propType: "display", propName: "金属台卡", specCode: "P3001", specDesc: "拉丝金属底座，适配 A5 画面", price: 58, qty: 5, unit: "个", supplierName: "简造陈列供应商" },
                { propType: "engineering", propName: "导视灯箱电源", specCode: "P4001", specDesc: "12V 电源组件，含固定配件", price: 148, qty: 2, unit: "个", supplierName: "简造工程配套" }
              ]
            }
          ]
        },
        {
          id: "S002",
          storeCode: "CD002",
          name: "成都春熙路标准店",
          provinceName: "四川省",
          cityName: "成都市",
          districtName: "锦江区",
          detail: "春熙路北段 88 号 2F",
          contact: "周宁",
          phone: "13900139002",
          deliveryTime: "2026-06-21",
          purchaseReason: "其它",
          purchaseReasonRemark: "区域活动临时加配",
          remark: "",
          purchaseOrders: [
            { orderNo: "CG202606100003", supplier: "简造陈列供应商", amount: 680, status: "待收货" }
          ],
          warehouses: [
            {
              id: "W003",
              warehouseName: "试衣区导视位",
              location: "试衣区",
              description: "试衣间入口指引与活动信息展示",
              specs: [
                { propType: "graphic", propName: "吊旗画面", specCode: "P2001", specDesc: "双面写真覆膜，含吊挂配件", price: 39, qty: 6, unit: "个", supplierName: "华南印务" },
                { propType: "display", propName: "金属台卡", specCode: "P3001", specDesc: "拉丝金属底座，适配 A5 画面", price: 58, qty: 4, unit: "个", supplierName: "简造陈列供应商" }
              ]
            }
          ]
        }
      ]
    };
    const DRAWING_STORE_KEY = "prototype:opened-store:design-drawings";
    const defaultStoreDrawings = {
      CQ001: [{ fileName: "CQ001-门店平面图.pdf", drawingType: "平面图", source: "已开业门店", dataUrl: "", mimeType: "application/pdf" }]
    };
    function drawingsForStore(store) {
      const fallback = defaultStoreDrawings[store.storeCode] || [{ fileName: `${store.storeCode}-门店设计图纸.pdf`, drawingType: "设计图纸", source: "已开业门店", dataUrl: "", mimeType: "application/pdf" }];
      try {
        const saved = JSON.parse(localStorage.getItem(DRAWING_STORE_KEY) || "{}")[store.storeCode];
        return saved?.length ? saved : fallback;
      } catch (error) {
        return fallback;
      }
    }
    function drawingField(store, drawings) {
      const refreshButton = `<button class="btn btn-small" style="min-width:0;min-height:28px;margin:0 0 6px 8px;padding:3px 12px;color:#527DF7" data-refresh-drawing type="button">刷新</button>`;
      if (drawings.length) return `${drawings.map((drawing, index) => `<button class="btn btn-link" data-preview-drawing="${index}" type="button">${escapeHtml(drawing.fileName)}（预览）</button>`).join("<br>")}${refreshButton}`;
      return `<span style="color:#f56c6c">未上传设计图纸，请联系管理员/审核人上传</span>${refreshButton}`;
    }
    function goUploadDrawing(storeCode) {
      window.parent.postMessage({ type: "prototype-route", action: "openStoreDrawingTab", storeCode }, "*");
    }

    const state = {
      currentStoreId: orderData.stores[0].id,
      expandedIds: new Set(orderData.stores[0].warehouses.map(item => item.id)),
      detailMode: "standard"
    };
    const els = {
      storeTabs: document.getElementById("storeTabs"),
      deliveryInfo: document.getElementById("deliveryInfo"),
      orderInfo: document.getElementById("orderInfo"),
      purchaseBody: document.getElementById("purchaseBody"),
      itemsTitle: document.getElementById("itemsTitle"),
      detailTabs: document.getElementById("detailTabs"),
      itemsHead: document.getElementById("itemsHead"),
      itemsBody: document.getElementById("itemsBody"),
      totalAmount: document.getElementById("totalAmount"),
      amountBreakdown: document.getElementById("amountBreakdown"),
      modalMask: document.getElementById("modalMask"),
      toast: document.getElementById("toast")
    };
    function money(value) { return `¥${Number(value || 0).toFixed(2)}`; }
    function formatUnitPrice(item) { return `${money(item?.price || 0)}/每${item?.unit || "个"}`; }
    function formatQty(item) { return `${item?.qty ?? 0}${item?.unit || "个"}`; }
    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function propIcon(type) {
      const color = { visual: "#f56c6c", graphic: "#e6a23c", display: "#67c23a", engineering: "#909399" }[type] || "#527DF7";
      return `<svg viewBox="0 0 48 48" aria-hidden="true"><rect x="10" y="10" width="28" height="28" rx="5" fill="#fff" stroke="${color}" stroke-width="2"/><path d="M17 19h14M17 25h14M17 31h9" stroke="${color}" stroke-width="2" stroke-linecap="round"/></svg>`;
    }
    function warehouseIcon() {
      return `<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M8 21 24 11l16 10v17H8V21Z" fill="#eef3ff" stroke="#527DF7" stroke-width="2"/><path d="M16 38V25h16v13M20 29h8M20 34h8" stroke="#527DF7" stroke-width="2" stroke-linecap="round"/></svg>`;
    }
    function currentStore() { return orderData.stores.find(store => store.id === state.currentStoreId) || orderData.stores[0]; }
    function currentWarehouses() { return currentStore().warehouses || []; }
    function isCustomProp(item) { return item.propKindLabel === "定制道具"; }
    function standardSpecs(row) { return (row.specs || []).filter(item => !isCustomProp(item)); }
    function customProps() {
      return currentWarehouses().flatMap(row => (row.specs || []).filter(isCustomProp).map(spec => ({ ...spec, warehouseName: row.warehouseName, warehouseCode: row.id, location: row.location })));
    }
    function warehouseAmount(row) { return standardSpecs(row).reduce((sum, item) => sum + Number(item.price || 0) * Number(item.qty || 0), 0); }
    function warehouseQty(row) { return standardSpecs(row).reduce((sum, item) => sum + Number(item.qty || 0), 0); }
    function standardTotalAmount() { return currentWarehouses().reduce((sum, row) => sum + warehouseAmount(row), 0); }
    function customTotalAmount() { return customProps().reduce((sum, item) => sum + Number(item.price || 0) * Number(item.qty || 0), 0); }
    function totalAmount() { return standardTotalAmount() + customTotalAmount(); }
    function formatPurchaseReason(store) {
      const reason = store.purchaseReason || "-";
      const remark = store.purchaseReasonRemark || "";
      return reason === "其它" && remark ? `其它：${remark}` : reason;
    }
    function itemPurchaseReason(item) {
      const reason = item.purchaseReason || currentStore().purchaseReason || "-";
      const remark = item.purchaseReasonRemark || currentStore().purchaseReasonRemark || "";
      return reason === "其它" && remark ? `其它：${remark}` : reason;
    }
    function renderTabs() {
      els.storeTabs.innerHTML = orderData.stores.map(store => `<button class="store-tab ${store.id === state.currentStoreId ? "active" : ""}" data-store-id="${store.id}" type="button">${escapeHtml(store.name)}</button>`).join("");
    }
    function renderInfo() {
      const store = currentStore();
      const drawings = drawingsForStore(store);
      const address = [store.provinceName, store.cityName, store.districtName, store.detail].filter(Boolean).join("");
      const purchaseReason = formatPurchaseReason(store);
      const remark = [orderData.remark, store.remark].filter(Boolean).join("；") || "-";
      els.deliveryInfo.innerHTML = `
        <div class="info-field"><span class="label">收货门店</span><span class="value">${escapeHtml(store.name)}</span></div>
        <div class="info-field"><span class="label">收货地址</span><span class="value">${escapeHtml(address || "-")}</span></div>
        <div class="info-field"><span class="label">收货人</span><span class="value">${escapeHtml(store.contact || "-")} ${escapeHtml(store.phone || "")}</span></div>
        <div class="info-field"><span class="label">要求到货时间</span><span class="value">${escapeHtml(store.deliveryTime || "-")}</span></div>`;
      els.orderInfo.innerHTML = `
        <div class="info-field"><span class="label">原始订单号</span><span class="value">${escapeHtml(orderData.orderNo)}</span></div>
        <div class="info-field"><span class="label">订单类型</span><span class="value">按仓位采购</span></div>
        <div class="info-field"><span class="label">采购原因</span><span class="value">${escapeHtml(purchaseReason)}</span></div>
        <div class="info-field"><span class="label">创建人</span><span class="value">${escapeHtml(orderData.createUser)}</span></div>
        <div class="info-field"><span class="label">创建时间</span><span class="value">${escapeHtml(orderData.createTime)}</span></div>
        <div class="info-field"><span class="label">设计图纸</span><span class="value">${drawingField(store, drawings)}</span></div>
        <div class="info-field"><span class="label">备注</span><span class="value">${escapeHtml(remark)}</span></div>`;
    }
    function renderPurchaseOrders() {
      const rows = currentStore().purchaseOrders || [];
      els.purchaseBody.innerHTML = rows.map(row => `<tr>
        <td>${escapeHtml(row.orderNo)}</td>
        <td>${escapeHtml(row.supplier)}</td>
        <td class="money">${money(row.amount)}</td>
        <td><span class="status-tag">${escapeHtml(row.status)}</span></td>
            <td><button class="btn" style="min-width:0;height:28px;padding:2px 8px;" type="button" onclick="openPurchaseSubOrderPage()">查看</button></td>
      </tr>`).join("");
    }
    function renderItems() {
      els.detailTabs.querySelectorAll("[data-detail-mode]").forEach(btn => btn.classList.toggle("active", btn.dataset.detailMode === state.detailMode));
      if (state.detailMode === "custom") return renderCustomItems();
      const rows = currentWarehouses().filter(row => standardSpecs(row).length > 0);
      els.itemsTitle.textContent = `明细列表（共计${rows.length}个仓位）`;
      els.itemsHead.innerHTML = `<tr>
        <th style="width:48px;"></th>
        <th style="width:30%;">仓位 / 道具信息</th>
        <th>规格说明</th>
        <th style="width:140px;">采购原因</th>
        <th style="width:140px; text-align:right;">每单位价格（元）</th>
        <th style="width:90px; text-align:center;">数量</th>
        <th style="width:160px;">供应商</th>
      </tr>`;
      els.itemsBody.innerHTML = rows.map(row => {
        const expanded = state.expandedIds.has(row.id);
        const parent = `<tr class="warehouse-row" data-toggle-id="${row.id}">
          <td style="text-align:center;"><button class="expand-btn" data-toggle-id="${row.id}" type="button">${expanded ? "⌄" : "›"}</button></td>
          <td><div class="position-info"><div class="position-image">${warehouseIcon()}<div class="position-wfy">${escapeHtml(row.location || "-")}</div></div><div class="position-content"><div class="position-title" title="${escapeHtml(row.warehouseName)}">${escapeHtml(row.warehouseName)}</div><div class="position-desc" title="${escapeHtml(row.description || "-")}">${escapeHtml(row.description || "-")}</div></div></div></td>
          <td></td>
          <td></td>
          <td></td>
          <td style="text-align:center;"></td>
          <td></td>
        </tr>`;
        const specs = standardSpecs(row).map(spec => `<tr class="spec-row ${expanded ? "" : "hidden"}" data-parent-id="${row.id}">
          <td></td>
          <td class="spec-indent">
            <div class="position-info">
              <div class="position-image spec-image">${propIcon(spec.propType)}${spec.isNonStandard ? `<span class="prop-kind-badge">非标</span>` : ""}</div>
              <div class="position-content">
                <div class="position-title" title="${escapeHtml(spec.propName)}">${escapeHtml(spec.propName)}</div>
                <div class="position-desc">${escapeHtml(spec.specCode || "-")}</div>
              </div>
            </div>
          </td>
          <td title="${escapeHtml(spec.specDesc || "-")}">${escapeHtml(spec.specDesc || "-")}</td>
          <td title="${escapeHtml(itemPurchaseReason(spec))}">${escapeHtml(itemPurchaseReason(spec))}</td>
          <td class="money" style="text-align:right;">${formatUnitPrice(spec)}</td>
          <td style="text-align:center;">${formatQty(spec)}</td>
          <td title="${escapeHtml(spec.supplierName || "-")}">${escapeHtml(spec.supplierName || "-")}</td>
        </tr>`).join("");
        return parent + specs;
      }).join("");
      renderTotalAmount();
    }
    function renderCustomItems() {
      const rows = customProps();
      els.itemsTitle.textContent = `定制道具（共计${rows.length}个）`;
      els.itemsHead.innerHTML = `<tr>
        <th style="width:30%;">道具信息</th>
        <th>规格说明</th>
        <th style="width:140px;">采购原因</th>
        <th style="width:100px; text-align:center;">数量</th>
        <th style="width:140px; text-align:right;">每单位价格（元）</th>
        <th style="width:160px;">供应商</th>
      </tr>`;
      els.itemsBody.innerHTML = rows.length ? rows.map(row => `<tr>
        <td>
          <div class="position-info">
            <div class="position-image spec-image">${propIcon(row.propType)}</div>
            <div class="position-content">
              <div class="position-title" title="${escapeHtml(row.propName)}">${escapeHtml(row.propName)}</div>
            </div>
          </div>
        </td>
        <td title="${escapeHtml(row.specDesc || "-")}">${escapeHtml(row.specDesc || "-")}</td>
        <td title="${escapeHtml(itemPurchaseReason(row))}">${escapeHtml(itemPurchaseReason(row))}</td>
        <td style="text-align:center;">${formatQty(row)}</td>
        <td class="money" style="text-align:right;">${formatUnitPrice(row)}</td>
        <td title="${escapeHtml(row.supplierName || "-")}">${escapeHtml(row.supplierName || "-")}</td>
      </tr>`).join("") : `<tr><td colspan="6" style="text-align:center;color:#909399;padding:32px;">暂无定制道具</td></tr>`;
      renderTotalAmount();
    }
    function renderTotalAmount() {
      els.totalAmount.textContent = money(totalAmount());
      els.amountBreakdown.innerHTML = `
        <span>标准仓位金额：<strong>${money(standardTotalAmount())}</strong></span>
        <span>定制道具金额：<strong>${money(customTotalAmount())}</strong></span>`;
    }
    function render() { renderTabs(); renderInfo(); renderPurchaseOrders(); renderItems(); }
    function showToast(message, warn = false) {
      els.toast.textContent = message;
      els.toast.style.background = warn ? "#fffbe6" : "#f0f9eb";
      els.toast.style.color = warn ? "#d48806" : "#67c23a";
      els.toast.style.borderColor = warn ? "#ffe58f" : "#b3e19d";
      els.toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => els.toast.classList.remove("show"), 2200);
    }
    function openModal(title, body, footer) {
      els.modalMask.classList.add("open");
      els.modalMask.innerHTML = `<div class="modal"><div class="modal-header"><span>${title}</span><button class="modal-close" data-close type="button">×</button></div><div class="modal-body">${body}</div><div class="modal-footer">${footer}</div></div>`;
    }
    function closeModal() { els.modalMask.classList.remove("open"); els.modalMask.innerHTML = ""; }
    document.getElementById("storeTabs").addEventListener("click", event => {
      const btn = event.target.closest("[data-store-id]");
      if (!btn) return;
      state.currentStoreId = btn.dataset.storeId;
      state.expandedIds = new Set(currentWarehouses().map(item => item.id));
      render();
    });
    els.detailTabs.addEventListener("click", event => {
      const btn = event.target.closest("[data-detail-mode]");
      if (!btn) return;
      state.detailMode = btn.dataset.detailMode;
      renderItems();
    });
    els.itemsBody.addEventListener("click", event => {
      const target = event.target.closest("[data-toggle-id]");
      if (!target) return;
      const id = target.dataset.toggleId;
      if (state.expandedIds.has(id)) state.expandedIds.delete(id);
      else state.expandedIds.add(id);
      renderItems();
    });
    els.orderInfo.addEventListener("click", event => {
      const refresh = event.target.closest("[data-refresh-drawing]");
      if (refresh) {
        renderInfo();
        showToast("设计图纸已刷新");
        return;
      }
      const button = event.target.closest("[data-preview-drawing]");
      if (!button) return;
      const drawing = drawingsForStore(currentStore())[Number(button.dataset.previewDrawing)];
      if (!drawing) return;
      const isImage = /^image\//.test(drawing.mimeType || "") || /\.(png|jpe?g)$/i.test(drawing.fileName);
      const body = drawing.dataUrl
        ? (isImage ? `<img src="${drawing.dataUrl}" alt="${escapeHtml(drawing.fileName)}" style="display:block;max-width:100%;max-height:58vh;margin:auto">` : `<iframe src="${drawing.dataUrl}" title="${escapeHtml(drawing.fileName)}" style="width:100%;height:58vh;border:0"></iframe>`)
        : `<div style="padding:40px 12px;text-align:center;color:#606266"><div style="font-size:28px;margin-bottom:12px">PDF</div><div>${escapeHtml(drawing.fileName)}</div><div style="margin-top:8px;color:#909399">该图纸来自已开业门店档案</div></div>`;
      openModal("预览设计图纸", body, `<button class="btn btn-primary" data-close type="button">关闭</button>`);
    });
    function openPurchaseSubOrderPage() {
      if (window.parent !== window && typeof window.parent.renderPage === "function") {
        window.parent.renderPage("purchaseSubOrder");
        return;
      }
      window.parent.postMessage({ type: "prototype-route", action: "purchaseSubOrder" }, "*");
    }
    document.getElementById("backBtn").addEventListener("click", () => {
      if (window.parent !== window && typeof window.parent.renderPage === "function") {
        window.parent.renderPage("originalStoreOrders");
      } else {
        window.history.back();
      }
    });
    document.getElementById("cancelBtn").addEventListener("click", () => openModal("提示", "<div>确定要取消该订单吗？</div>", `<button class="btn" data-close type="button">取消</button><button class="btn btn-primary" data-confirm-cancel type="button">确定</button>`));
    els.modalMask.addEventListener("click", event => {
      if (event.target === els.modalMask || event.target.closest("[data-close]")) return closeModal();
      if (event.target.closest("[data-confirm-cancel]")) {
        closeModal();
        showToast("订单已取消");
      }
    });
    render();
  </script>
</body>
</html>
