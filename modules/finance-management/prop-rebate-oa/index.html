function filteredTasks(){return state().tasks.filter(t=>(!nodeFilter||t.node===nodeFilter)&&(!actorFilter||t.actor.includes(actorFilter))&&(metric===0||metric===1&&t.submitted||metric===2&&!t.submitted||metric===3&&t.viewed||metric===4&&!t.viewed));}
function statusTable(){const rows=filteredTasks(),names=[...new Set(rows.map(t=>t.node))];return `<table class="status-table"><colgroup><col style="width:10%"><col style="width:20%"><col style="width:20%"><col style="width:25%"><col style="width:15%"><col style="width:10%"></colgroup><thead><tr><th>序号</th><th>节点</th><th colspan="4">操作情况统计<button id="collapseAll" class="collapse-all" title="展开或收起全部">☷</button></th></tr></thead><tbody>${names.length?names.map((name,i)=>{const ts=rows.filter(t=>t.node===name);return `<tr class="node-row"><td>${i+1}</td><td><button data-collapse="${esc(name)}">${collapsed.has(name)?'＋':'－'} ${esc(name)}</button></td><td colspan="4">${ts.length} 人次　${ts.filter(t=>t.submitted).length} 已提交　${ts.filter(t=>!t.submitted).length} 未提交　${ts.filter(t=>t.viewed).length} 已查看　${ts.filter(t=>!t.viewed).length} 未查看</td></tr>${collapsed.has(name)?'':`<tr class="detail-head"><td></td><td>操作者</td><td>操作状态</td><td>操作时间</td><td>查看状态</td><td>操作意见</td></tr>${ts.map(t=>`<tr class="task-row"><td></td><td>${esc(t.actor)}</td><td>${t.submitted?'已提交':'未提交'}</td><td>${esc(t.time||'—')}</td><td>${t.viewed?'已查看':'未查看'}</td><td>${esc(t.note||'—')}</td></tr>`).join('')}`}`;}).join(''):'<tr><td colspan="6" class="empty-cell">暂无数据</td></tr>'}</tbody></table>`;}
function statusHTML(){const t=state().tasks,counts=[t.length,t.filter(x=>x.submitted).length,t.filter(x=>!x.submitted).length,t.filter(x=>x.viewed).length,t.filter(x=>!x.viewed).length];return `<div class="status-cards">${['总人次','已提交','未提交','已查看','未查看'].map((n,i)=>`<button class="status-card ${metric===i?'selected':''}" data-metric="${i}" style="--card-color:${['#3ac8d2','#8dc139','#b37bf8','#009bff','#ff1924'][i]}"><i class="workflow-icon">&#${[43264,43266,43267,43265,43268][i]};</i><div><b>${counts[i]}</b><p>${n}</p></div></button>`).join('')}</div><div class="status-content"><div class="filters"><label>按节点过滤：<select id="nodeFilter"><option value=""></option>${flow().workflow.nodes.map(n=>`<option ${n.name===nodeFilter?'selected':''}>${esc(n.name)}</option>`).join('')}</select></label><label>按操作者过滤：<input id="actorFilter" value="${esc(actorFilter)}" placeholder=""></label></div><div id="statusTable">${statusTable()}</div></div>`;}
function historyHTML(){return `<div class="table-scroll"><table class="records-table"><thead><tr><th>动作</th><th>节点</th><th>办理人</th><th>时间</th><th>轮次</th><th>意见／说明</th></tr></thead><tbody>${state().logs.map(l=>`<tr><td>${esc(l.name)}</td><td>${esc(l.node||'—')}</td><td>${esc(l.actor)}</td><td>${esc(l.time)}</td><td>${l.round}</td><td>${esc(l.note)}</td></tr>`).join('')}</tbody></table></div>`;}
function transferHTML(){const f=flow(),s=state();return `<section class="transfer-status"><div><span>RMS 当前状态</span><strong>${esc(s.rms)}</strong></div><div><span>OA 当前状态</span><strong>${esc(s.oa)}</strong></div><div><span>当前审批节点</span><strong>${esc(s.phase==='pending'?M.current(f,s)?.name:'—')}</strong></div></section><section class="transfer"><h2>系统流转说明</h2><div class="table-scroll"><table class="records-table"><thead><tr><th>动作</th><th>发起系统</th><th>接收系统</th><th>RMS结果</th><th>OA结果</th><th>处理说明</th></tr></thead><tbody>${f.integration.events.filter(e=>e.id!=='rms_withdraw'||f.workflow.withdraw.enabled).map(e=>`<tr class="${s.lastEvent===e.id?'current-event':''}" data-event-id="${esc(e.id)}"><td>${esc(e.name)}</td><td>${esc(e.from)}</td><td>${esc(e.to)}</td><td>${esc(e.rms)}</td><td>${esc(e.oa)}</td><td>${esc(e.description)}</td></tr>`).join('')}</tbody></table></div><h2>本次流转记录</h2>${s.logs.length?historyHTML():staticEmpty('暂无流转记录')}</section>`;}
function operationButtons(){const s=state(),withdraw=flow().workflow.withdraw.enabled;return s.phase==='draft'?'<button data-action="rms_submit">RMS提交</button>':s.phase==='pending'?'<button data-action="oa_approve">审批通过</button><button data-reject>审批驳回</button>'+(withdraw?'<button data-action="rms_withdraw">RMS撤回</button>':''):['rejected','withdrawn'].includes(s.phase)?'<button data-action="rms_resubmit">RMS重提</button>':s.phase==='await_archive'?'<button data-action="oa_archive">OA归档</button>':s.phase==='await_rms'?'<button data-action="rms_archive">RMS接收并处理</button>':'<span class="muted">本次流程已完成</span>';}
function render(){const f=flow(),s=state(),phase=s.phase==='draft'?'创建':['await_rms','done'].includes(s.phase)?'归档':'处理',pageTitle=f.metadata?.pageTitle||config.project.name;$('#app').innerHTML=`<div class="oa-live app-tab-${tab}"><header class="oa-live-header"><button class="oa-live-logo oa-icon-coms" id="navToggle" title="原型导航">&#xe984;</button><div class="oa-live-caption">${esc(pageTitle)}</div><div class="oa-live-tabs" role="tablist">${['流程表单','流程图','流程状态','流转说明'].map((n,i)=>`<button role="tab" aria-selected="${tab===i}" class="${tab===i?'active':''}" data-tab="${i}">${n}</button>`).join('')}</div><div class="oa-live-actions">${tab===0?`<button id="oaHeaderSubmit" class="btn primary" ${['draft','pending'].includes(s.phase)?'':'disabled'}>提 交</button>`:''}<button id="saveView" class="btn primary">保 存</button><button class="oa-live-menu" id="menuToggle" title="原型导航">☰</button></div></header><main class="oa-live-paper">${[formHTML,graphHTML,statusHTML,transferHTML][tab]()}</main></div>`;
 $('#navBody').innerHTML=`<label>流程<select id="flowSelector">${config.flows.map(f=>`<option value="${esc(f.id)}" ${f.id===flowId?'selected':''}>${esc(f.name)}</option>`).join('')}</select></label><div class="nav-status">RMS：${esc(s.rms)}<br>OA：${esc(s.oa)}</div><div class="nav-actions">${operationButtons()}</div><label>查看身份<select id="roleSelector"><option value="current">当前办理人</option>${[...new Map(f.workflow.nodes.map(n=>[n.role,n])).values()].map(n=>`<option value="${esc(n.role)}" ${role===n.role?'selected':''}>${esc(n.name)}</option>`).join('')}</select></label><div class="nav-actions"><button id="sourceEdit">RMS来源示例</button><button id="resetFlow">重置当前流程</button><button id="openConfig">原型配置</button></div><p class="nav-hint">离线原型。流程操作、附件及人员均用于演示。</p>`;
 bind();}
function bind(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=+b.dataset.tab;render();window.scrollTo(0,0);});$('#navToggle').onclick=$('#menuToggle').onclick=()=>{$('#prototypeNav').open=!$('#prototypeNav').open;};$('#saveView').onclick=()=>toast('本次演示内容已保留在当前页面');if($('#oaHeaderSubmit'))$('#oaHeaderSubmit').onclick=()=>perform(state().phase==='draft'?'rms_submit':'oa_approve');$('#flowSelector').onchange=e=>{flowId=e.target.value;metric=0;nodeFilter='';actorFilter='';collapsed.clear();role='current';render();};$('#roleSelector').onchange=e=>{role=e.target.value;render();};$('#resetFlow').onclick=()=>{states[flowId]=M.create(flow());render();};$('#sourceEdit').onclick=editSource;$('#openConfig').onclick=configDialog;
 document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>perform(b.dataset.action));document.querySelectorAll('[data-reject]').forEach(b=>b.onclick=rejectDialog);
 document.querySelectorAll('[data-edit]').forEach(e=>e.oninput=()=>{const f=M.allFields(flow()).find(f=>f.id===e.dataset.edit);if(editable(f))state().values[f.id]=e.value;});
 document.querySelectorAll('[data-file]').forEach(b=>b.onclick=()=>{const a=state().values[b.dataset.file][+b.dataset.fileIndex];showDialog('附件预览',`<p class="file-display">${esc(a.name)}</p><p>示例附件用于核对分类和预览入口。</p>`);});
 document.querySelectorAll('[data-metric]').forEach(b=>b.onclick=()=>{metric=+b.dataset.metric;render();});if($('#nodeFilter'))$('#nodeFilter').onchange=e=>{nodeFilter=e.target.value;updateStatusTable();};if($('#actorFilter'))$('#actorFilter').oninput=e=>{actorFilter=e.target.value;updateStatusTable();};bindStatusTable();}
function bindStatusTable(){document.querySelectorAll('[data-collapse]').forEach(b=>b.onclick=()=>{const n=b.dataset.collapse;collapsed.has(n)?collapsed.delete(n):collapsed.add(n);updateStatusTable();});if($('#collapseAll'))$('#collapseAll').onclick=()=>{if(collapsed.size)collapsed.clear();else state().tasks.forEach(t=>collapsed.add(t.node));updateStatusTable();};}
function updateStatusTable(){$('#statusTable').innerHTML=statusTable();bindStatusTable();}
function perform(id,note=''){try{M.act(flow(),state(),id,note);render();}catch(e){toast(e.message);}}
function showDialog(title,body,buttons=''){const d=$('#dialog');if(d.open)d.close();d.innerHTML=`<h2>${esc(title)}</h2><div class="dialog-content">${body}</div><div class="dialog-actions">${buttons}<button id="closeDialog">关闭</button></div>`;$('#closeDialog').onclick=()=>d.close();d.showModal();}
function rejectDialog(){showDialog('审批驳回','<label>驳回意见<textarea id="rejectNote" rows="4" placeholder="填写本次驳回意见"></textarea></label>','<button id="confirmReject" class="primary">确认驳回</button>');$('#confirmReject').onclick=()=>{const note=$('#rejectNote').value;if(!note.trim())return toast('请填写驳回意见');$('#dialog').close();perform('oa_reject',note);};}
function readDraftControls(){for(const e of $('#dialog').querySelectorAll('[data-edit]')){const f=M.allFields(flow()).find(f=>f.id===e.dataset.edit);editorDraft[f.id]=e.multiple?Array.from(e.selectedOptions).map(o=>o.value):['amount','number','percent'].includes(f.type)?e.value===''?null:Number(e.value):e.value;}for(const e of $('#dialog').querySelectorAll('[data-json-edit]')){try{const v=JSON.parse(e.value);if(!Array.isArray(v))throw Error();editorDraft[e.dataset.jsonEdit]=v;}catch{throw Error('请检查 '+e.dataset.jsonEdit+' 的数组格式');}}}
function sourceBody(){return `<p class="nav-hint">修改当前流程的RMS来源示例。条件字段变化后点击“刷新联动”；OA表单仍按接收后的只读规则展示。示例改值用于当前演示，导出配置沿用配置内默认示例。</p><div class="source-grid">${M.allFields(flow()).filter(f=>M.matches(f.visibleWhen,editorDraft)).map(f=>`<label class="source-field ${f.type==='table'?'full':''}">${esc(f.name)}${control(f,editorDraft,true)}</label>`).join('')}</div>`;}
function editSource(){if(!['draft','rejected','withdrawn'].includes(state().phase))return toast('请在提交前、驳回或撤回后调整来源示例');editorDraft=M.clone(state().values);drawSource();}
function drawSource(){showDialog('RMS来源示例',sourceBody(),'<button id="refreshSource">刷新联动</button><button id="applySource" class="primary">应用本次示例</button>');$('#refreshSource').onclick=()=>{try{readDraftControls();for(const f of M.allFields(flow()))if(f.optionsBy){const opts=M.options(f,editorDraft);if(!opts.some(o=>o.value===editorDraft[f.id]))editorDraft[f.id]=opts[0]?.value||'';}drawSource();}catch(e){toast(e.message);}};$('#applySource').onclick=()=>{try{readDraftControls();for(const f of M.allFields(flow()))if(f.type==='table'||f.type==='attachment'){if(!Array.isArray(editorDraft[f.id]))throw Error(f.name+'应为数组');}const errors=M.valueErrors(flow(),editorDraft);if(errors.length)throw Error(errors.join('；'));state().values=M.derive(flow(),editorDraft);$('#dialog').close();render();}catch(e){toast(e.message);}};}
function configDiff(next){const old=new Map(config.flows.map(f=>[f.id,f])),lines=[];for(const f of next.flows){if(!old.has(f.id)){lines.push('新增流程：'+f.name);continue;}const prev=old.get(f.id),a=new Map(M.allFields(prev).map(x=>[x.id,x])),b=new Map(M.allFields(f).map(x=>[x.id,x]));for(const [id,x]of b)if(!a.has(id))lines.push(f.name+'：新增字段 '+x.name);else if(JSON.stringify(a.get(id))!==JSON.stringify(x))lines.push(f.name+'：调整字段 '+a.get(id).name+' → '+x.name);for(const [id,x]of a)if(!b.has(id))lines.push(f.name+'：移除字段 '+x.name);if(JSON.stringify(prev.sections.map(s=>[s.id,s.name,s.fields.map(x=>x.id)]))!==JSON.stringify(f.sections.map(s=>[s.id,s.name,s.fields.map(x=>x.id)])))lines.push(f.name+'：分类或字段顺序变化');if(JSON.stringify(prev.workflow)!==JSON.stringify(f.workflow))lines.push(f.name+'：审批流程变化');if(JSON.stringify(prev.integration)!==JSON.stringify(f.integration))lines.push(f.name+'：系统流转变化');if(JSON.stringify(prev.sample)!==JSON.stringify(f.sample))lines.push(f.name+'：默认示例变化');old.delete(f.id);}for(const f of old.values())lines.push('移除流程：'+f.name);return lines;}
function configDialog(){showDialog('原型配置',`<p>导入 Codex 整理的 JSON 配置，检查改动后应用。导出成品 HTML 可直接转发。</p><label>选择配置文件<input type="file" id="configFile" accept=".json,application/json"></label><textarea id="configText" rows="9" placeholder="也可以在这里粘贴完整配置JSON"></textarea><div id="configResult" class="config-result"></div><div class="nav-actions"><button id="checkConfig">检查并预览改动</button><button id="applyConfig" class="primary" disabled>应用配置</button><button id="exportConfig">导出配置</button><button id="exportHTML">导出成品HTML</button><button id="restoreConfig">恢复打开时的配置</button></div>`);let candidate=null;const invalidate=()=>{candidate=null;$('#applyConfig').disabled=true;$('#configResult').textContent='';};$('#configText').oninput=invalidate;$('#configFile').onchange=async e=>{invalidate();const file=e.target.files[0];if(!file)return;if(file.size>5*1024*1024)return toast('配置文件请控制在5MB内');$('#configText').value=await file.text();};$('#checkConfig').onclick=()=>{try{candidate=null;$('#applyConfig').disabled=true;const next=JSON.parse($('#configText').value),errors=M.validate(next);if(errors.length)throw Error(errors.join('\n'));candidate=next;const lines=configDiff(next);$('#configResult').textContent='配置检查通过。\n'+(lines.length?lines.join('\n'):'配置内容相同。');$('#applyConfig').disabled=false;}catch(e){$('#configResult').textContent=e.message;}};$('#applyConfig').onclick=()=>{if(!candidate)return;config=M.clone(candidate);document.title=config.project.name;flowId=config.flows.some(f=>f.id===flowId)?flowId:config.flows[0].id;states={};role='current';metric=0;nodeFilter='';actorFilter='';collapsed.clear();$('#dialog').close();render();toast('配置已应用，演示记录已重置');};$('#exportConfig').onclick=()=>download(JSON.stringify(config,null,2),'原型配置.json','application/json');$('#exportHTML').onclick=exportHTML;$('#restoreConfig').onclick=()=>{config=M.clone(initialConfig);document.title=config.project.name;flowId=config.flows[0].id;states={};tab=0;metric=0;nodeFilter='';actorFilter='';collapsed.clear();role='current';$('#dialog').close();render();};}
function download(text,name,type){const url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);}
function exportHTML(){const doc=document.documentElement.cloneNode(true);doc.querySelector('title').textContent=config.project.name;doc.querySelector('#prototype-config').textContent=JSON.stringify(config).replace(/</g,'\\u003c');doc.querySelector('#app').innerHTML='';doc.querySelector('#navBody').innerHTML='';doc.querySelector('#prototypeNav').removeAttribute('open');const d=doc.querySelector('#dialog');d.innerHTML='';d.removeAttribute('open');doc.querySelector('#toast').hidden=true;doc.querySelector('#toast').textContent='';download('<!doctype html>\n'+doc.outerHTML,config.project.name+'原型.html','text/html;charset=utf-8');}
const initialErrors=M.validate(config);if(initialErrors.length){$('#app').textContent=initialErrors.join('\n');}else render();
</script></body></html>
